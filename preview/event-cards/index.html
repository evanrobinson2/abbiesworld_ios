<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Event Cards</title>
<style>:root{color-scheme:dark}body{margin:0;background:#171c3d;color:#fff4d8;font-family:Nunito,system-ui,sans-serif}h1{font:600 26px/1.2 Fredoka,system-ui,sans-serif;margin:0;padding:22px 16px 4px}p{margin:0 16px 14px;opacity:.85;max-width:60ch}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:0 16px 24px}figure{margin:0;text-align:center}img{width:100%;border-radius:4%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}figcaption{margin-top:6px;font-weight:800;font-size:14px}
.vs{display:flex;gap:18px;align-items:center;padding:0 16px 24px;flex-wrap:wrap}.vs figure{width:150px}.vs span{max-width:36ch;opacity:.9}</style></head><body>
<h1>World event cards</h1><p>Same Card Forge, same size, same print spec. A night-blue frame with rays, a burst-edged window and a WORLD EVENT banner tell an event from a tile card at a glance.</p>
<div class="vs"><figure><img src="tile-buttercup.webp" alt="A tile card"><figcaption>A tile card</figcaption></figure><figure><img src="thunderstorm.webp" alt="An event card"><figcaption>A world event</figcaption></figure><span>Tile cards sit in a pale tier frame with an arch, gable or scallop window. Events never do.</span></div>
<div class="row"><figure><img src="paint-rain.webp" alt="Paint Rain"><figcaption>Paint Rain</figcaption></figure><figure><img src="meteorite.webp" alt="Meteorite"><figcaption>Meteorite</figcaption></figure><figure><img src="rain-shower.webp" alt="Rain Shower"><figcaption>Rain Shower</figcaption></figure><figure><img src="thunderstorm.webp" alt="Thunderstorm"><figcaption>Thunderstorm</figcaption></figure><figure><img src="snowfall.webp" alt="Snowfall"><figcaption>Snowfall</figcaption></figure><figure><img src="rainbow.webp" alt="Rainbow"><figcaption>Rainbow</figcaption></figure><figure><img src="golden-dawn.webp" alt="Golden Dawn"><figcaption>Golden Dawn</figcaption></figure><figure><img src="starry-night.webp" alt="Starry Night"><figcaption>Starry Night</figcaption></figure><figure><img src="morning-fog.webp" alt="Morning Fog"><figcaption>Morning Fog</figcaption></figure><figure><img src="aurora.webp" alt="Northern Lights"><figcaption>Northern Lights</figcaption></figure></div></body></html>
