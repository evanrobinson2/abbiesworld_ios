<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AW-STUDY-0063 - The Research Lab</title>
<meta name="description" content="A walk-in research lab in Winchester where every study stands on a pedestal you can walk up to and inspect. Playable concept.">
<style>
:root{--aw-font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;--aw-ink:#2b211a;--aw-soft:#6b5d52;--paper:#fffaf2}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.45 var(--aw-font);background:#dfe9f2;color:var(--aw-ink);overflow:hidden;-webkit-font-smoothing:antialiased;touch-action:none}
canvas{display:block;width:100%;height:100%}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.28));backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 30px rgba(43,33,26,.22),inset 0 1px 0 rgba(255,255,255,.9)}
#door{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);padding:7px 16px;border-radius:999px;font-weight:700;letter-spacing:.2px;pointer-events:none;white-space:nowrap}
#hint{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 16px;border-radius:999px;font-size:13px;color:var(--aw-soft);transition:opacity .6s;pointer-events:none;text-align:center}
#card{position:fixed;right:16px;top:64px;width:min(360px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;border-radius:22px;padding:14px;display:none}
#card img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;background:#0001;display:block}
#card h2{margin:10px 0 2px;font-size:19px;line-height:1.2}
#card .n{font-size:12px;color:var(--aw-soft);letter-spacing:.4px}
#card .st{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:9px;font-size:11px;font-weight:700;color:#fff;background:var(--c,#7a4b2a)}
#card p{margin:8px 0}
#card .why{padding:9px 11px;border-radius:12px;background:#fff8;font-size:14px}
#card .row{display:flex;gap:8px;margin-top:10px}
#card a,#card button{flex:1;text-align:center;font:600 14px var(--aw-font);padding:10px 12px;border-radius:14px;border:1px solid #2b211a22;background:#fff;color:var(--aw-ink);text-decoration:none;cursor:pointer}
#card a.go{background:var(--c,#7a4b2a);color:#fff;border-color:transparent}
.joy{position:fixed;left:18px;bottom:max(18px,env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;display:none}
.joy i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.8)}
@media (pointer:coarse){.joy{display:block}#hint{bottom:150px}}
@media (max-width:640px){#card{right:8px;left:8px;width:auto;top:auto;bottom:8px;max-height:58vh}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="door" class="glass">Winchester Research Lab</div>
<div id="hint" class="glass">Drag to look · WASD or the stick to walk · tap a pedestal to inspect it</div>
<div id="card" class="glass"></div>
<div class="joy glass" id="joy"><i></i></div>
<script type="module">
import * as THREE from './three.module.js';
const STUDIES = await (await fetch('./studies.json')).json();
const SITE = 'https://app.abbies.world/studies/';
// Each wing of the lab is one shelf of the studies site; same colours as a wing's glass.
const WINGS = [
  ['Humans and humanoids', 0xff8fb1, 'People'],
  ['Games from memories', 0xffb347, 'Games'],
  ['Look and welcome', 0x7cc8ff, 'Look'],
  ['Places and kits', 0x8fd694, 'Places'],
  ['Oracle studies', 0xb59cff, 'Oracle'],
];
const col = g => new THREE.Color((WINGS.find(w => w[0] === g) || [0, 0x999999])[1]);
const hex = g => '#' + col(g).getHexString();

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdbe7f1);
scene.fog = new THREE.Fog(0xdbe7f1, 26, 60);
const cam = new THREE.PerspectiveCamera(62, 1, .1, 120);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9a48c, 1.05));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.4);
sun.position.set(8, 20, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, far: 60 });
scene.add(sun);

const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .7, ...o });
const R = 16; // hall radius
// floor: hex-tiled boards, as the town is
const floor = new THREE.Mesh(new THREE.CylinderGeometry(R + 2, R + 2, .4, 6), M(0xf1e6d2));
floor.position.y = -.2; floor.receiveShadow = true; floor.rotation.y = Math.PI / 6; scene.add(floor);
const inlay = new THREE.Mesh(new THREE.CylinderGeometry(5.2, 5.2, .06, 6), M(0xd9c3a0));
inlay.position.y = .02; inlay.rotation.y = Math.PI / 6; scene.add(inlay);

// glass dome
const dome = new THREE.Mesh(new THREE.SphereGeometry(R + 2, 40, 16, 0, Math.PI * 2, 0, Math.PI / 2.2),
  new THREE.MeshPhysicalMaterial({ color: 0xcfe6ff, transparent: true, opacity: .16, roughness: .05, side: THREE.DoubleSide, depthWrite: false }));
scene.add(dome);

const pick = [];           // clickable groups
const byId = {};
const walls = [];          // for collision: circles
function label(text, w = 4, h = 1, bg = '#fffaf2', fg = '#2b211a', size = 64) {
  const c = document.createElement('canvas'); c.width = 512; c.height = Math.round(512 * h / w);
  const x = c.getContext('2d');
  x.fillStyle = bg; x.beginPath(); x.roundRect(0, 0, c.width, c.height, 36); x.fill();
  x.fillStyle = fg; x.font = `700 ${size}px ui-rounded,system-ui,sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, c.width / 2, c.height / 2 + 3, c.width - 40);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t, transparent: true }));
}

// Each study: a pedestal, a specimen jar with a glowing low-poly specimen, and a hanging name card.
function specimen(s, c) {
  const g = new THREE.Group();
  const ped = new THREE.Mesh(new THREE.CylinderGeometry(.6, .75, .9, 8), M(0xf7f1e6)); ped.position.y = .45; ped.castShadow = ped.receiveShadow = true; g.add(ped);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(.68, .68, .08, 8), M(c)); cap.position.y = .94; g.add(cap);
  const jar = new THREE.Mesh(new THREE.CylinderGeometry(.5, .5, 1.1, 16, 1, true),
    new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: .22, roughness: .05, side: THREE.DoubleSide, depthWrite: false }));
  jar.position.y = 1.5; g.add(jar);
  const kinds = [new THREE.IcosahedronGeometry(.3, 0), new THREE.OctahedronGeometry(.34), new THREE.BoxGeometry(.4, .4, .4), new THREE.TorusKnotGeometry(.2, .07, 40, 6), new THREE.ConeGeometry(.28, .55, 6)];
  const sp = new THREE.Mesh(kinds[Math.abs(hash(s.id)) % kinds.length], M(c, { emissive: c, emissiveIntensity: .55, roughness: .35 }));
  sp.position.y = 1.5; sp.userData.spin = .6 + (Math.abs(hash(s.id)) % 7) / 10; g.add(sp);
  const lab = label(s.t.length > 22 ? s.t.slice(0, 21) + '…' : s.t, 1.7, .36, '#fffaf2ee', '#2b211a', 54);
  lab.position.set(0, 2.45, 0); lab.userData.billboard = true; g.add(lab);
  const light = new THREE.PointLight(c, .5, 3.2); light.position.y = 1.5; g.add(light);
  g.userData = { s, sp, ped };
  g.traverse(o => { if (o.isMesh) o.userData.root = g; });
  return g;
}
function hash(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return h; }

// Wings: five arcs, two rows of pedestals each
const wingStep = Math.PI * 2 / WINGS.length;
WINGS.forEach(([g, c, short], wi) => {
  const list = STUDIES.filter(s => s.g === g);
  const mid = wi * wingStep - Math.PI / 2;
  // wing glass wall behind the shelves
  const wall = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 4.2, 24, 1, true, mid - wingStep / 2 + .05, wingStep - .1),
    new THREE.MeshStandardMaterial({ color: c, transparent: true, opacity: .32, side: THREE.DoubleSide, roughness: .2 }));
  wall.position.y = 2.1; scene.add(wall);
  const arch = label(short + ' wing', 5, 1.1, '#' + new THREE.Color(c).getHexString(), '#fff', 72);
  arch.position.set(Math.cos(mid) * (R - .3), 4.9, Math.sin(mid) * (R - .3)); arch.lookAt(0, 4.9, 0); scene.add(arch);
  const perRow = Math.ceil(list.length / 2);
  list.forEach((s, i) => {
    const row = i % 2, k = Math.floor(i / 2);
    const rad = row ? 13.6 : 10.2;
    const span = wingStep * .82;
    const a = mid - span / 2 + span * (perRow > 1 ? (k + (row ? .5 : 0)) / (perRow) : .5) + (row ? span / perRow * .5 * 0 : 0);
    const p = specimen(s, col(g));
    p.position.set(Math.cos(a) * rad, 0, Math.sin(a) * rad);
    scene.add(p); pick.push(p); byId[s.id] = p;
    walls.push([p.position.x, p.position.z, .85]);
  });
});

// Centre: the map table, with the three newest studies on it
const table = new THREE.Group();
const top = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, .25, 6), M(0xe9dcc4)); top.position.y = 1; top.castShadow = top.receiveShadow = true; table.add(top);
const leg = new THREE.Mesh(new THREE.CylinderGeometry(.5, .8, 1, 8), M(0xb89a6a)); leg.position.y = .5; table.add(leg);
const hexes = new THREE.Group();
// Winchester is seven hexes: one in the middle and six around, three zones
const zone = [0x8fd694, 0x8fd694, 0xf0c27a, 0xf0c27a, 0xa3b8d6, 0xa3b8d6, 0x8fd694];
[[0, 0], ...[0, 1, 2, 3, 4, 5].map(i => [Math.cos(i * Math.PI / 3), Math.sin(i * Math.PI / 3)])].forEach(([x, z], i) => {
  const h = new THREE.Mesh(new THREE.CylinderGeometry(.48, .48, .12 + (i ? .03 * i : .1), 6), M(zone[i], { roughness: .55 }));
  h.position.set(x * .88, 1.2, z * .88); h.castShadow = true; hexes.add(h);
});
table.add(hexes);
const cap = label('Winchester', 1.2, .25, '#fffaf2dd', '#2b211a', 60); cap.position.set(0, 1.35, 2.2); cap.rotation.x = -1.1; table.add(cap);
scene.add(table); walls.push([0, 0, 2.7]);
const newest = [...STUDIES].sort((a, b) => b.at.localeCompare(a.at)).slice(0, 3);
// Floating "just in" banner tags over the newest pedestals (the lab's way of saying new)
newest.forEach(s => {
  const p = byId[s.id]; if (!p) return;
  const flag = label('NEW', .8, .3, '#ff7aa8', '#fff', 80); flag.position.set(.55, 2.05, 0); flag.userData.billboard = true; p.add(flag);
});

// Scene Builder arch: a flask doorway on the north side of the central ring, opens the sibling study
const door = new THREE.Group();
[-1, 1].forEach(sx => { const post = new THREE.Mesh(new THREE.CylinderGeometry(.18, .18, 3.4, 10), M(0xb89a6a)); post.position.set(sx * 1.2, 1.7, 0); post.castShadow = true; door.add(post); });
const lintel = new THREE.Mesh(new THREE.BoxGeometry(2.8, .3, .4), M(0xb89a6a)); lintel.position.y = 3.4; door.add(lintel);
const veil = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 3.2), new THREE.MeshBasicMaterial({ color: 0xfff1b8, transparent: true, opacity: .35, side: THREE.DoubleSide }));
veil.position.y = 1.7; door.add(veil);
const flask = new THREE.Mesh(new THREE.ConeGeometry(.45, .8, 12), M(0x7cc8ff, { emissive: 0x7cc8ff, emissiveIntensity: .5, transparent: true, opacity: .9 })); flask.position.y = 3.95; door.add(flask);
const dl = label('Scene Builder Lab', 2.6, .5, '#fffaf2ee', '#2b211a', 54); dl.position.set(0, 4.7, 0); door.add(dl);
door.position.set(0, 0, -6.2);
door.userData = { s: { id: 'scene-builder-door', t: 'The Scene Builder Lab', n: 'AW-STUDY-0062', st: 'A room in this lab', g: 'Look and welcome', why: 'Choose a family, season and land, let the game decorate a first pass, then build freely. It is the workshop next to the study shelves, behind ?exp=scene-builder.', s: 'The workshop room', src: 'scene-builder/index.html?exp=scene-builder', img: 'scene-builder/thumb.jpg' } };
door.traverse(o => { if (o.isMesh) o.userData.root = door; });
scene.add(door); pick.push(door); walls.push([0, -6.2, 1.5]);

// Walk: free movement inside the hall, collide with pedestals
const me = { x: 0, z: 6.5, yaw: 0, pitch: -.12, tx: null, tz: null };
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);
let joy = { x: 0, y: 0 };
const joyEl = document.getElementById('joy'), knob = joyEl.firstElementChild;
let joyId = null;
joyEl.addEventListener('pointerdown', e => { joyId = e.pointerId; joyEl.setPointerCapture(joyId); e.stopPropagation(); });
joyEl.addEventListener('pointermove', e => {
  if (e.pointerId !== joyId) return;
  const b = joyEl.getBoundingClientRect();
  let x = (e.clientX - b.left - 55) / 40, y = (e.clientY - b.top - 55) / 40; const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  joy = { x, y }; knob.style.transform = `translate(${x * 30}px,${y * 30}px)`;
});
const joyEnd = e => { if (e.pointerId === joyId) { joyId = null; joy = { x: 0, y: 0 }; knob.style.transform = ''; } };
joyEl.addEventListener('pointerup', joyEnd); joyEl.addEventListener('pointercancel', joyEnd);

const cv = renderer.domElement, ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: 0 }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
  me.yaw -= dx * .006; me.pitch = Math.max(-.7, Math.min(.5, me.pitch - dy * .004));
});
cv.addEventListener('pointerup', e => {
  const was = drag; drag = null;
  if (!was || was.moved > 6) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, cam);
  const hit = ray.intersectObjects(pick, true).find(h => h.object.userData.root);
  if (hit) { const g = hit.object.userData.root; walkTo(g.position.x, g.position.z, 2.6); open(g.userData.s); }
  else { const f = ray.intersectObject(floor)[0]; if (f) { me.tx = f.point.x; me.tz = f.point.z; } closeCard(); }
});
function walkTo(x, z, stop) { const dx = x - me.x, dz = z - me.z, l = Math.hypot(dx, dz) || 1; me.tx = x - dx / l * stop; me.tz = z - dz / l * stop; me.face = [x, z]; }

const card = document.getElementById('card');
function open(s) {
  const c = hex(s.g);
  card.style.setProperty('--c', c);
  const href = SITE + s.src;
  card.innerHTML = `${s.img ? `<img alt="" src="${SITE + s.img}" onerror="this.style.display='none'">` : ''}
    <h2>${s.t}</h2><div class="n">${s.n}${s.st ? `<span class="st">${s.st}</span>` : ''}</div>
    <p>${s.s || ''}</p>${s.why ? `<p class="why"><b>Why it matters.</b> ${s.why}</p>` : ''}
    <div class="row"><a class="go" href="${href}" target="_blank" rel="noopener">Read the study</a><button id="x">Step back</button></div>`;
  card.style.display = 'block';
  document.getElementById('x').onclick = closeCard;
  document.getElementById('hint').style.opacity = 0;
  if (location.hash !== '#' + s.id) history.replaceState(null, '', '#' + s.id);
}
function closeCard() { card.style.display = 'none'; }

function size() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', size); size();

// start: if the link names a study (#school-jump), walk straight up to it
const start = location.hash.slice(1);
if (byId[start]) { const p = byId[start]; me.x = p.position.x * .5; me.z = p.position.z * .5; walkTo(p.position.x, p.position.z, 2.6); open(p.userData.s); }

let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  let fx = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - joy.y;
  let sx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joy.x;
  if (keys.ArrowLeft) me.yaw += dt * 1.8; if (keys.ArrowRight) me.yaw -= dt * 1.8;
  let vx = 0, vz = 0;
  if (fx || sx) { me.tx = null; vx = (-Math.sin(me.yaw) * fx + Math.cos(me.yaw) * sx); vz = (-Math.cos(me.yaw) * fx - Math.sin(me.yaw) * sx); }
  else if (me.tx != null) {
    const dx = me.tx - me.x, dz = me.tz - me.z, l = Math.hypot(dx, dz);
    if (l < .08) { me.tx = null; if (me.face) { const w = Math.atan2(-(me.face[0] - me.x), -(me.face[1] - me.z)); let d = w - me.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); me.yaw += d; me.face = null; } }
    else { vx = dx / l; vz = dz / l; }
  }
  const sp = 4.2 * dt;
  let nx = me.x + vx * sp, nz = me.z + vz * sp;
  const r = Math.hypot(nx, nz); if (r > R - 1) { nx *= (R - 1) / r; nz *= (R - 1) / r; }
  for (const [wx, wz, wr] of walls) { const d = Math.hypot(nx - wx, nz - wz); if (d < wr + .35) { nx = wx + (nx - wx) / d * (wr + .35); nz = wz + (nz - wz) / d * (wr + .35); } }
  me.x = nx; me.z = nz;
  cam.position.set(me.x, 1.65 + Math.sin(t * 8) * (vx || vz ? .02 : 0), me.z);
  cam.rotation.set(me.pitch, me.yaw, 0, 'YXZ');
  pick.forEach(p => { const sp = p.userData.sp; if (sp) { sp.rotation.y += dt * sp.userData.spin; sp.position.y = 1.5 + Math.sin(t * 1.6 + p.position.x) * .05; } });
  scene.traverse(o => { if (o.userData.billboard) o.quaternion.copy(cam.quaternion); });
  veil.material.opacity = .28 + Math.sin(t * 2) * .08; flask.rotation.y = t;
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__lab = { me, byId, count: pick.length }; // for the headless run
</script>
</body>
</html>
