# One-off check of where the Sonniss bundles can be read from a GitHub runner (archive.org copies).
name: sound-probe
on:
  push:
    branches: ['claude/project-thread-mzo2r5']
    paths: ['.github/workflows/sound-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          for id in game-audio-gdcpart-6 game-audio-gdcpart-7 gdc-2023-game-audio-bundle sonniss-gdc-2024-game-audio-bundle-normalized sonniss-gdc-2023-game-audio-bundle-normalized sonniss-gdc-2020-game-audio-bundle-normalized sonniss-gdc-2020-game-audio-bundle sonniss.com-gdc-game-audio-bundles SonnissGameAudioGDCPart6; do
            echo "== $id"
            curl -s -m 30 "https://archive.org/metadata/$id" | python3 -c "
          import json,sys
          d=json.load(sys.stdin); m=d.get('metadata',{})
          print('title:',m.get('title'),'| date:',m.get('date') or m.get('publicdate'),'| desc:',str(m.get('description',''))[:300].replace('\n',' '))
          print('server:',d.get('d1'),d.get('dir'))
          for f in d.get('files',[]):
            n=f.get('name','')
            if n.lower().endswith(('.zip','.torrent','.7z','.rar')) or f.get('format') in ('ZIP',):
              print('  ',n,f.get('size'),f.get('source'),f.get('md5'))
          "
          done
          echo "== range test"
          curl -sL -o /dev/null -m 30 -w '%{http_code} %{size_download}B %{url_effective}\n' -r 0-99 "https://archive.org/download/game-audio-gdcpart-7/" || true
