# Puts every model (GLB/glTF), its reference image and provenance into Cloudflare R2 and the model_assets table.
# Runs when models change on main or the live Ranch Atelier branch, and on demand (Actions > model-store > Run workflow).
# Needs repository secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_PUBLIC_BASE_URL
# and, for the database, POSTGRES_URL. See tools/model-store/README.md.
name: model-store
on:
  workflow_dispatch:
  push:
    branches: [main, claude/live-snapshot-2026-10-22]
    paths:
      - '**.glb'
      - '**.gltf'
      - 'prototypes/ranch-atelier/dist/models/manifest.json'
      - 'tools/midjourney/**'
      - 'tools/model-store/**'
      - '.github/workflows/model-store.yml'
concurrency:
  group: model-store
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: main }
      - uses: actions/checkout@v4
        with: { ref: claude/live-snapshot-2026-10-22, path: live }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # The tool and the site code live on the live branch; main only carries this workflow.
      - name: Install and test
        run: |
          echo "TOOL=live/tools/model-store" >> "$GITHUB_ENV"
          npm install --prefix live/tools/model-store --no-audit --no-fund
          node --test live/tools/model-store/test.mjs
      - name: Check secrets
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          missing=""
          for k in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_BUCKET R2_PUBLIC_BASE_URL; do [ -n "${!k}" ] || missing="$missing $k"; done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them at https://github.com/${{ github.repository }}/settings/secrets/actions then re-run this workflow."
            node "$TOOL/sync.mjs" --tree main=main --tree live=live --dry-run
            exit 1
          fi
      # R2_ACCESS_KEY_ID may hold a Cloudflare API token (cfat_...) instead of an S3 Access Key ID. R2's S3 key
      # pair is then the token's id and the SHA-256 of the token. Same recipe as the sound-store workflow.
      # Writes the usable pair to GITHUB_ENV, masked; never prints a value.
      - name: Resolve R2 S3 keys
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          k="$R2_ACCESS_KEY_ID"; s="${R2_SECRET_ACCESS_KEY:-}"
          if [ "${#k}" -ne 32 ]; then
            id=""
            for u in "accounts/${R2_ACCOUNT_ID}/tokens/verify" "user/tokens/verify"; do
              id=$(curl -fsS -H "Authorization: Bearer $k" "https://api.cloudflare.com/client/v4/$u" | jq -r '.result.id // empty' || true)
              [ -n "$id" ] && break
            done
            [ -n "$id" ] || { echo "::error::R2_ACCESS_KEY_ID is neither a 32-character Access Key ID nor a working Cloudflare token"; exit 1; }
            s=$(printf '%s' "$k" | sha256sum | cut -d' ' -f1); k="$id"
            echo "R2_ACCESS_KEY_ID holds a Cloudflare token: using its id and SHA-256"
          fi
          echo "::add-mask::$k"; echo "::add-mask::$s"
          { echo "R2_KEY_ID=$k"; echo "R2_KEY_SECRET=$s"; } >> "$GITHUB_ENV"
      - name: Upload to R2 and catalogue
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ env.R2_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ env.R2_KEY_SECRET }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SITE_R2_BASE: https://pub-07c8c8a2d9aa40db9fa739b28c65b3e2.r2.dev
        run: node "$TOOL/sync.mjs" --tree main=main --tree live=live
      - name: Check the live site reads the store
        run: |
          code=$(curl -s -o /tmp/paths.json -w '%{http_code}' 'https://abbies-ranch-atelier.vercel.app/api/models?paths=1' || true)
          echo "live /api/models?paths=1 -> HTTP $code"
          [ "$code" = 200 ] && node -e "const d=require('/tmp/paths.json');console.log(Object.keys(d.paths).length+' game paths served from R2')" || echo "::notice::The live site isn't serving /api/models yet (deploy pending)."
