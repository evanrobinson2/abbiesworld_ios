name: models-live-check
on:
  push:
    branches: [claude/project-thread-tdiiox]
    paths: ['.github/workflows/models-live-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium webkit
      - run: |
          cat > c.js <<'JS'
          const { chromium, webkit } = require('playwright');
          (async()=>{
            const { devices } = require('playwright');
            for (const [name,bt,opt] of [['chromium',chromium,{viewport:{width:1280,height:900}}],['iphone-webkit',webkit,devices['iPhone 14']]]){
              const b=await bt.launch(); const ctx=await b.newContext(opt); const p=await ctx.newPage();
              const log=[];p.on('pageerror',e=>log.push('PAGEERROR '+e.message));p.on('console',m=>{if(m.type()==='error'||m.type()==='warning')log.push(m.type()+' '+m.text())});p.on('response',r=>{if(r.status()>=400)log.push(r.status()+' '+r.url())});p.on('requestfailed',r=>log.push('FAILED '+r.url()+' '+(r.failure()&&r.failure().errorText)));
              for (const path of ['https://ranch.abbies.world/models/pauldrons','https://ranch.abbies.world/models/mc-barn-upgrade','https://abbies-ranch-atelier.vercel.app/models/pauldrons','https://ranch.abbies.world/models']){
                log.length=0; await p.goto(path,{waitUntil:'networkidle'}).catch(e=>log.push('GOTO '+e.message)); await p.waitForTimeout(5000);
                const st=await p.evaluate(()=>({title:document.title,msgs:[...document.querySelectorAll('.msg')].map(m=>m.hidden?'ok':m.textContent),canv:document.querySelectorAll('canvas').length,gl:!!document.createElement('canvas').getContext('webgl2')}));
                await p.screenshot({path:name+path.replace(/\W+/g,'_')+'.png'});
                console.log(name,path,JSON.stringify(st)); console.log('  ',JSON.stringify(log.slice(0,15)));
              }
              await b.close();
            }
          })();
          JS
          node c.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: shots, path: '*.png'}
