# Narration for the welcome tour (AW-STUDY-0022; tools/welcome-narration/render.py). Manual only, so it never spends
# credits on its own. Runs on a runner because the cloud box can't reach api.elevenlabs.io. Secret: ELEVENLABS_API_KEY.
# Commits voice/*.mp3 and voice/manifest.json next to the tour, on the branch it runs on.
name: welcome-narration
on:
  workflow_dispatch:
    inputs:
      voice: { description: 'ElevenLabs voice id (default Matilda, warm and friendly)', default: 'XrExE9yKIg1WjnnlVkGX' }
      force: { description: 'Render every line again (true/false)', default: 'false' }
permissions:
  contents: write
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Render
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 tools/welcome-narration/render.py --voice "${{ inputs.voice }}" ${{ inputs.force == 'true' && '--force' || '' }}
      - name: Commit
        run: |
          git config user.name "welcome-narration"; git config user.email "actions@users.noreply.github.com"
          git add prototypes/ranch-atelier/dist/simulations/welcome/voice
          git diff --cached --quiet && exit 0
          git commit -m "Welcome tour: narration from ElevenLabs [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
