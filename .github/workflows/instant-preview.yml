# Legacy previews only. New studies use study-publish.yml and docs/design/STUDIES.md.
# Main-owned legacy pages remain at
#   https://app.abbies.world/r2/previews/<name>/index.html
# through the existing /r2/* rewrite. No Vercel build. Removing a directory does NOT delete its old R2 prefix.
# Secrets as for model-store: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET.
name: instant-preview
on:
  push:
    branches: [main]
    paths: ['preview/**']
  workflow_dispatch:
    inputs:
      name: { description: 'Preview name (folder under preview/)', required: true }
concurrency:
  group: instant-preview-legacy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: R2 keys
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash tools/model-store/r2-keys.sh
      - name: Sync preview/<name>/ to R2 previews/<name>/
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ env.R2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_KEY_SECRET }}
          AWS_DEFAULT_REGION: auto
          ONLY: ${{ inputs.name }}
        run: |
          ep="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for d in preview/*/; do
            [ ! -f "$d/study.json" ] || continue
            n=$(basename "$d")
            [ -z "$ONLY" ] || [ "$ONLY" = "$n" ] || continue
            aws s3 sync "$d" "s3://${R2_BUCKET}/previews/${n}/" --endpoint-url "$ep" --delete \
              --cache-control "no-cache" --only-show-errors
            echo "https://app.abbies.world/r2/previews/${n}/index.html"
            echo "- https://app.abbies.world/r2/previews/${n}/index.html" >> "$GITHUB_STEP_SUMMARY"
          done
