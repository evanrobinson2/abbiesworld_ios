name: Crayon Physics Apple build
on:
  workflow_dispatch:
  push:
    branches: [codex/crayon-physics-integration]
    paths: ['Games/CrayonPhysics/**', '.github/workflows/crayon-physics.yml', 'scripts/link-crayon-physics.rb', 'abbies.world.ios/**']
permissions:
  contents: read
jobs:
  standalone:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: Games/CrayonPhysics
      - name: Install project generator
        run: brew install xcodegen
      - name: Build and test on an available iPad simulator
        working-directory: Games/CrayonPhysics
        run: bash tools/verify-on-mac.sh
      - name: Package simulator app
        if: success()
        working-directory: Games/CrayonPhysics
        run: ditto -c -k --sequesterRsrc --keepParent DerivedData/Build/Products/Debug-iphonesimulator/CrayonPhysics.app verification/CrayonPhysics-simulator.zip
      - name: Preserve Apple build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crayon-physics-apple-evidence
          path: Games/CrayonPhysics/verification/
          retention-days: 14
  integrated-host:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            Games/CrayonPhysics
            abbies.world.ios
            scripts
      - name: Install project tools
        run: |
          brew install xcodegen
          gem install xcodeproj -v 1.27.0 --no-document --user-install
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"
      - name: Generate shared game and link host
        run: |
          (cd Games/CrayonPhysics && xcodegen generate)
          ruby scripts/link-crayon-physics.rb
      - name: Build integrated app for iPad simulator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification
          xcodebuild -project abbies.world.ios/abbies.world.ios.xcodeproj -scheme abbies.world.ios -destination 'generic/platform=iOS Simulator' -derivedDataPath HostDerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee verification/host-build.log
      - name: Package integrated simulator app
        if: success()
        run: ditto -c -k --sequesterRsrc --keepParent HostDerivedData/Build/Products/Debug-iphonesimulator/abbies.world.ios.app verification/AbbiesWorld-simulator.zip
      - name: Preserve host build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crayon-physics-host-evidence
          path: |
            verification/
            abbies.world.ios/abbies.world.ios.xcodeproj/project.pbxproj
          retention-days: 14
