# The sound engineer's pipeline (tools/sound-engineer/README.md).
#   index: reads the directory of every Sonniss GDC bundle zip over HTTP ranges and commits tools/sound-engineer/index/.
#          Runs when the index is missing, or on demand (task=index).
#   build: pulls each picked sound out of its bundle (only that file's bytes), trims, fades, loudness-normalises and
#          encodes it, then stores it in Cloudflare R2 (sounds/blobs/...) and the sound_assets table, and publishes
#          sounds/catalog.json for /api/sounds. The audio never goes into git: the repo is public and the Sonniss
#          licence forbids redistributing the sounds as sound effects.
# Needs the same secrets as model-store: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET,
# R2_PUBLIC_BASE_URL and optionally POSTGRES_URL.
name: sound-store
on:
  workflow_dispatch:
    inputs:
      task:
        description: index, build, or both
        default: build
  push:
    branches: [claude/live-snapshot-2026-10-22, 'claude/project-thread-mzo2r5']
    paths:
      - 'tools/sound-engineer/**'
      - '.github/workflows/sound-store.yml'
concurrency:
  group: sound-store-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Decide
        id: need
        run: |
          if [ "${{ inputs.task }}" = index ] || [ "${{ inputs.task }}" = both ] || [ ! -f tools/sound-engineer/index/gdc2024.json ]; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "Index present; skipping."; fi
      - uses: actions/setup-node@v4
        if: steps.need.outputs.run
        with: { node-version: 22 }
      - name: Index the bundles
        if: steps.need.outputs.run
        run: node tools/sound-engineer/index.mjs
      - name: Commit the index
        if: steps.need.outputs.run
        run: |
          git config user.name "sound-store[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sound-engineer/index
          git diff --cached --quiet && { echo "Index unchanged"; exit 0; }
          git commit -m "Sound engineer: index of the Sonniss GDC bundles (zip directories, no audio)"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
