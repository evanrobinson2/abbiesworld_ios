# When ChatGPT drops a request on GitHub as an issue (it posts as Evan), this workflow
#   1. handshakes at once with a comment on the issue, before any work starts, and
#   2. fires the "Abbie's World issue intake" Claude routine, which does the work and delivers to main.
# Scheduled-task GitHub triggers only support PR and release events, so this Action is the issue trigger.
# Secrets (repo secrets, never in the repo): CLAUDE_ISSUE_ROUTINE_ID (trig_...), CLAUDE_ISSUE_ROUTINE_TOKEN.
# Without them the handshake still happens and says so. See docs/dispatch/ISSUE_INTAKE.md.
name: chatgpt-issue-intake
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to (re)run intake for
        required: true
permissions:
  contents: read
  issues: write
concurrency:
  group: chatgpt-issue-intake-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          ROUTINE_ID: ${{ secrets.CLAUDE_ISSUE_ROUTINE_ID }}
          ROUTINE_TOKEN: ${{ secrets.CLAUDE_ISSUE_ROUTINE_TOKEN }}
          MANUAL_ISSUE: ${{ inputs.issue }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const TRUSTED = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const MARK = '<!-- abbies-intake:v1 -->';
            const manual = context.eventName === 'workflow_dispatch';
            const number = manual ? Number(process.env.MANUAL_ISSUE) : context.payload.issue.number;
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number });

            // Only requests from Evan's own identity (ChatGPT posts as him). Bridge-managed dispatches
            // (abbies-dispatch marker) have their own routine and relay; never double-handle them.
            const body = issue.body || '';
            const labels = issue.labels.map((l) => (typeof l === 'string' ? l : l.name));
            if (issue.pull_request || issue.state !== 'open') return core.info('not an open issue');
            if (!manual && !TRUSTED.has(issue.author_association)) return core.info(`ignoring ${issue.user.login} (${issue.author_association})`);
            if (body.includes('abbies-dispatch:v1') || labels.includes('dispatch')) return core.info('bridge dispatch, handled by dispatch-relay');
            if (issue.user.type === 'Bot') return core.info('bot issue');

            // Once per issue: the handshake comment is the lock.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            if (comments.some((c) => (c.body || '').includes(MARK)) && !manual) return core.info('already handled');

            const id = String(process.env.ROUTINE_ID || '').trim();
            const token = String(process.env.ROUTINE_TOKEN || '').trim();
            const connected = /^trig_[A-Za-z0-9]+$/.test(id) && token.length > 0;
            const branch = `claude/issue-${number}`;

            // 1. Handshake first.
            await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['claude-intake'] });
            const handshake = await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body: `${MARK}\nReceived. Claude is being started on this now${connected ? '' : ', but the intake routine is not connected yet, so it is queued until it is'}. Work goes on branch \`${branch}\`, merges to \`main\`, and the result is posted back on this issue.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
            });
            if (!connected) {
              core.warning('CLAUDE_ISSUE_ROUTINE_ID / CLAUDE_ISSUE_ROUTINE_TOKEN not set; handshake posted, routine not fired');
              return;
            }

            // 2. Start the routine.
            const payload = {
              protocol: 'abbies-issue-intake/v1',
              issue: number,
              title: issue.title,
              url: issue.html_url,
              branch,
              handshake_comment: handshake.data.id,
              reason: manual ? 'manual' : 'issue',
            };
            const text = `routine-fire-payload:\n${JSON.stringify(payload)}`;
            let last = '';
            for (let attempt = 1; attempt <= 4; attempt++) {
              try {
                const res = await fetch(`https://api.anthropic.com/v1/claude_code/routines/${id}/fire`, {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${token}`,
                    'anthropic-version': '2023-06-01',
                    'anthropic-beta': 'experimental-cc-routine-2026-04-01',
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({ text }),
                });
                last = `${res.status}`;
                if (res.ok) {
                  core.info(`routine fired for issue #${number}`);
                  return;
                }
                if (res.status < 500 && res.status !== 429) break;
              } catch (err) {
                last = err.message;
              }
              await new Promise((r) => setTimeout(r, 2000 * 2 ** attempt));
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body: `Could not start Claude automatically (routine fire returned ${last}). Re-run **chatgpt-issue-intake** with this issue number from the Actions tab to retry.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
            });
            core.setFailed(`routine fire failed: ${last}`);
