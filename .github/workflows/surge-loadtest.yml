# Launch-day load test (docs/launch/SURGE.md, tools/surge/loadtest.mjs). On demand only: Actions > surge-loadtest > Run workflow.
# It replays a first-time visit (GETs only, no paid AI) from many virtual visitors and writes the report to the run summary.
# Every run moves real bytes on Vercel: keep visitors modest (200 visitors is about 2-4 GB) and --max-gb guards the rest.
name: surge-loadtest
on:
  workflow_dispatch:
    inputs:
      url: { description: 'Site to test', default: 'https://ranch.abbies.world' }
      pages: { description: 'Pages a visitor opens, comma separated', default: '/,/sandbox' }
      visitors: { description: 'Virtual visitors in total', default: '200' }
      concurrency: { description: 'Visitors at the same time, per machine (keep 5 or less)', default: '5' }
      max_gb: { description: 'Refuse to run past this many GB (per machine)', default: '10' }
      machines: { description: 'Machines testing at once, each from its own address (1-20)', default: '1' }
concurrency:
  group: surge-loadtest
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # A crowd comes from many addresses; one machine past ~1,500 requests a second is blocked by Vercel's attack
  # protection (403). Split the visitors over several machines to test the site, not the bot defence.
  plan:
    runs-on: ubuntu-latest
    outputs:
      machines: ${{ steps.m.outputs.list }}
      start: ${{ steps.m.outputs.start }}
    steps:
      - id: m
        env: { N: '${{ inputs.machines }}' }
        # Every machine starts at the same second, three minutes from now (browser installs take about one).
        run: |
          node -e "const n=Math.min(20,Math.max(1,parseInt(process.env.N)||1));console.log('list='+JSON.stringify([...Array(n).keys()]))" >> "$GITHUB_OUTPUT"
          echo "start=$(( $(date +%s) + 180 ))" >> "$GITHUB_OUTPUT"
  load:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.plan.outputs.machines) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools/surge }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install a browser for the capture
        working-directory: tools/surge
        run: npm init -y >/dev/null && npm install playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Capture one visit, then replay it
        working-directory: tools/surge
        env:
          URL: ${{ inputs.url }}
          PAGES: ${{ inputs.pages }}
          VISITORS: ${{ inputs.visitors }}
          MACHINES: ${{ inputs.machines }}
          START: ${{ needs.plan.outputs.start }}
          CONCURRENCY: ${{ inputs.concurrency }}
          MAX_GB: ${{ inputs.max_gb }}
        run: |
          wait=$(( START - $(date +%s) )); if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          per=$(( (VISITORS + ${MACHINES:-1} - 1) / ${MACHINES:-1} ))
          node loadtest.mjs --url "$URL" --pages "$PAGES" --visitors "$per" --concurrency "$CONCURRENCY" --max-gb "$MAX_GB" --out surge-report
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'surge-report-${{ matrix.machine }}', path: 'tools/surge/surge-report*.json' }
