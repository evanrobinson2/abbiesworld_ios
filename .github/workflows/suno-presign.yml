# Lets Evan's PC upload his Suno songs straight to R2 without R2 keys and without git (the songs are private on Suno,
# whose CDN refuses them outside his browser). It fills tools/composer/suno/upload.ps1 with a presigned PUT URL for
# music/suno/<id>.mp3 for every song in songs.json (valid 6 hours), encrypts the script with a fresh AES-256 key
# (IV first, then CBC ciphertext) and that key with RSA-OAEP to the given public key, and attaches both to the
# `suno-library` release as suno-put.<run>.enc/.key. Whoever holds the private key (a Claude session) recovers the AES
# key and hands Evan a one-line PowerShell command that downloads, decrypts and runs the script. Afterwards run
# suno-store to check and catalogue the songs.
name: suno-presign
on:
  workflow_dispatch:
    inputs:
      pubkey: { description: 'RSA public key, PEM, base64 encoded on one line', required: true }
permissions:
  contents: write
jobs:
  presign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: R2 keys
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: tools/model-store/r2-keys.sh
      - name: Presign and encrypt
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_KEY_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PUBKEY: ${{ inputs.pubkey }}
        run: |
          set -euo pipefail
          pip install -q boto3
          umask 077; mkdir -p /tmp/p
          python3 - > /tmp/p/up.ps1 <<'PY'
          import boto3, json, os; from botocore.config import Config
          s3 = boto3.client('s3', endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com", region_name='auto', config=Config(signature_version='s3v4'))
          songs = json.load(open('tools/composer/suno/songs.json'))['songs']
          urls = {s['id']: s3.generate_presigned_url('put_object', ExpiresIn=21600,
                  Params={'Bucket': os.environ['R2_BUCKET'], 'Key': f"music/suno/{s['id']}.mp3", 'ContentType': 'audio/mpeg'}) for s in songs}
          print(open('tools/composer/suno/upload.ps1').read().replace('#URLS#', '\n'.join(f"'{k}'='{v}'" for k, v in urls.items())))
          PY
          echo "$PUBKEY" | base64 -d > /tmp/p/pub.pem
          openssl rand -out /tmp/p/k 32; openssl rand -out /tmp/p/iv 16
          n=${{ github.run_id }}
          openssl enc -aes-256-cbc -K "$(od -An -tx1 -v /tmp/p/k | tr -d " \n")" -iv "$(od -An -tx1 -v /tmp/p/iv | tr -d " \n")" -in /tmp/p/up.ps1 -out /tmp/p/ct
          cat /tmp/p/iv /tmp/p/ct > "suno-put.$n.enc"
          openssl pkeyutl -encrypt -pubin -inkey /tmp/p/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/p/k -out "suno-put.$n.key"
          rm -rf /tmp/p
          ls -l suno-put.*
      - name: Attach to the suno-library release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view suno-library >/dev/null 2>&1 || gh release create suno-library --prerelease --title "Abbie's World: Evan's Suno songs" --notes "Evan's own Suno songs, mirrored from our R2 CDN (music/suno/). Metadata: tools/composer/suno/songs.json."
          gh release upload suno-library suno-put.* --clobber
