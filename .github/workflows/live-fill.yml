# One-shot (retry): bring the snapshot fully in line with the live Ranch Atelier site, then remove itself.
name: live-fill
on:
  push:
    branches: [claude/live-snapshot-2026-10-22]
  workflow_dispatch:
    paths: [.github/workflows/live-fill.yml]
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: python3 .github/scripts/live-fill.py
      - run: |
          git rm -q .github/workflows/live-fill.yml .github/scripts/live-fill.py
          git add -A prototypes/ranch-atelier/dist
          git -c user.name="github-actions[bot]" -c user.email="41898583+github-actions[bot]@users.noreply.github.com" commit -m "Snapshot: re-sync every served file with the live site and add files only live has"
          git push origin HEAD:refs/heads/claude/live-resync-2026-10-22
