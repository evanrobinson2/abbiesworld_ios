<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Critter Carousel — Creature Lab prototype</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #12151f;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }
      /* Taps only: never let the browser turn a stray finger into a gesture. */
      canvas {
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/phaser/main.js"></script>
  </body>
</html>
