<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2430" />
  <title>Sprout Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #e8f0e4;
      --muted: rgba(232, 240, 228, 0.62);
      --moss: #6fbf6a;
      --moss-deep: #2f6b3a;
      --lamp: #ffe08c;
      --panel: rgba(16, 24, 20, 0.55);
      --line: rgba(232, 240, 228, 0.12);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      background:
        radial-gradient(1200px 700px at 70% -10%, rgba(255, 200, 90, 0.12), transparent 55%),
        radial-gradient(900px 600px at 10% 100%, rgba(70, 140, 90, 0.16), transparent 50%),
        linear-gradient(165deg, #121820 0%, #1a2620 45%, #152018 100%);
      color: var(--ink);
      font-family: "Manrope", system-ui, sans-serif;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      opacity: 0.5;
    }
    .shell {
      height: 100%;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 0.75rem;
      padding:
        calc(0.9rem + var(--safe-top))
        1rem
        calc(0.9rem + var(--safe-bottom));
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 1rem;
      animation: rise 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .brand {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: -0.03em;
      line-height: 0.95;
      margin: 0;
    }
    .brand span {
      display: block;
      font-size: 0.42em;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--moss);
      margin-bottom: 0.35rem;
    }
    .lede {
      max-width: 18rem;
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
      text-align: right;
      animation: rise 850ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .lab {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent 30%),
        var(--panel);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        0 30px 80px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      animation: rise 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .lab::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    #stage {
      display: block;
      max-width: 100%;
      max-height: 100%;
      cursor: grab;
      touch-action: none;
    }
    #stage:active { cursor: grabbing; }
    .hud {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      pointer-events: none;
    }
    .meter {
      min-width: 140px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(8, 14, 12, 0.55);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .meter .label {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .track {
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    #energyFill {
      display: block;
      height: 100%;
      width: 100%;
      transform-origin: left center;
      transform: scaleX(0.8);
      background: linear-gradient(90deg, var(--moss-deep), var(--moss), var(--lamp));
      transition: transform 120ms linear;
    }
    #status {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.05rem;
      color: var(--ink);
      text-shadow: 0 2px 16px rgba(0,0,0,0.45);
      max-width: 14rem;
      text-align: right;
    }
    footer {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: center;
      justify-content: space-between;
      animation: rise 1000ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    button, .speed {
      font: inherit;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--ink);
      border-radius: 999px;
      padding: 0.55rem 0.95rem;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }
    button:hover {
      background: rgba(111, 191, 106, 0.14);
      border-color: rgba(111, 191, 106, 0.35);
    }
    button:active { transform: translateY(1px); }
    .speed {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      cursor: default;
    }
    .speed input {
      width: 90px;
      accent-color: var(--moss);
    }
    .hint {
      color: var(--muted);
      font-size: 0.82rem;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 720px) {
      .shell { padding-left: 0.75rem; padding-right: 0.75rem; gap: 0.6rem; }
      header { flex-direction: column; align-items: start; }
      .lede { text-align: left; max-width: none; }
      .hud { flex-direction: column; align-items: start; }
      #status { text-align: left; }
      footer { align-items: stretch; }
      .controls { width: 100%; }
      .hint { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1 class="brand"><span>Abbie’s World</span>Sprout Lab</h1>
      <p class="lede">One seed. One light. One living thing trying to reach it.</p>
    </header>

    <section class="lab" aria-label="Sprout Lab chamber">
      <canvas id="stage" width="720" height="960"></canvas>
      <div class="hud">
        <div class="meter">
          <div class="label">Energy</div>
          <div class="track"><span id="energyFill"></span></div>
        </div>
        <div id="status">Germinating.</div>
      </div>
    </section>

    <footer>
      <div class="controls">
        <label class="speed">
          Speed
          <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1" />
          <span id="speedLabel">1.0×</span>
        </label>
        <button type="button" id="restart">Restart sprout</button>
        <button type="button" id="addPole">Add pole</button>
        <button type="button" id="resetScene">Reset scene</button>
      </div>
      <div class="hint">Drag the lamp or trellis. The plant keeps responding.</div>
    </footer>
  </div>
  <script type="module" src="./lab.js"></script>
</body>
</html>
