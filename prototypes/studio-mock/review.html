<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Review · Abbie’s World</title>
  <style>
    :root {
      --ink: #f7f1e8;
      --muted: rgba(247, 241, 232, 0.62);
      --board: #6bcf8e;
      --dump: #e07a6a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0a0a0c;
      color: var(--ink);
      font-family: "SF Pro Display", "Avenir Next", system-ui, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0c;
    }
    #card {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      will-change: transform;
      transition: none;
    }
    #card.snap {
      transition: transform 160ms cubic-bezier(0.2, 0.9, 0.2, 1), opacity 160ms ease;
    }
    #card.fly {
      transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 200ms ease;
    }
    #plate {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #111;
      pointer-events: none;
    }
    .veil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 80ms linear;
    }
    .veil.board { background: linear-gradient(180deg, rgba(107,207,142,0.55), rgba(107,207,142,0.08) 45%, transparent); }
    .veil.dump { background: linear-gradient(0deg, rgba(224,122,106,0.55), rgba(224,122,106,0.08) 45%, transparent); }
    .veil.show { opacity: 1; }

    #chrome {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding:
        calc(12px + var(--safe-top))
        18px
        calc(18px + var(--safe-bottom));
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      text-shadow: 0 1px 8px rgba(0,0,0,0.75);
    }
    .title {
      font-size: clamp(1rem, 2.2vw, 1.35rem);
      font-weight: 650;
      letter-spacing: 0.01em;
      max-width: 70vw;
      line-height: 1.2;
    }
    .semantic {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: ui-monospace, Menlo, monospace;
      margin-top: 0.25rem;
      word-break: break-all;
    }
    .counter {
      font-variant-numeric: tabular-nums;
      font-size: 1.1rem;
      font-weight: 600;
      opacity: 0.9;
      white-space: nowrap;
    }

    .hint-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      /* Sit above the collapsed drawer handle */
      padding-bottom: calc(28px + var(--safe-bottom));
    }
    .hint {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }
    .hint strong { color: var(--ink); font-weight: 650; letter-spacing: 0.08em; }
    .hint.board strong { color: var(--board); }
    .hint.dump strong { color: var(--dump); }
    .hint.center {
      text-align: center;
      flex: 1;
    }

    #flash {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 140ms ease, transform 140ms ease;
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 0 4px 24px rgba(0,0,0,0.55);
    }
    #flash.show { opacity: 1; transform: scale(1); }
    #flash.board { color: var(--board); }
    #flash.dump { color: var(--dump); }

    #done {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: #0a0a0c;
      padding: 2rem;
      text-align: center;
      z-index: 40;
    }
    #done.show { display: grid; }
    #done h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
    }
    #done p { color: var(--muted); margin: 0 0 1.25rem; max-width: 28rem; line-height: 1.4; }
    #done .log {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.78rem;
      color: #cfc4b4;
      text-align: left;
      background: #16151a;
      border-radius: 10px;
      padding: 0.9rem 1rem;
      max-width: 36rem;
      width: min(92vw, 36rem);
      max-height: 40vh;
      overflow: auto;
    }
    #done .feedback {
      text-align: left;
      max-width: 36rem;
      width: min(92vw, 36rem);
      margin: 0 0 1rem;
      padding: 0.9rem 1rem;
      border-radius: 10px;
      background: #16151a;
      color: #cfc4b4;
      font-size: 0.85rem;
      line-height: 1.35;
      max-height: 36vh;
      overflow: auto;
    }
    #done .feedback .row {
      margin: 0 0 0.65rem;
    }
    #done .feedback .row:last-child { margin-bottom: 0; }
    #done .feedback .kind {
      color: #8ec9ff;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    #done button {
      pointer-events: auto;
      margin-top: 1.25rem;
      font: inherit;
      font-weight: 650;
      border: 0;
      border-radius: 999px;
      padding: 0.7rem 1.4rem;
      background: var(--ink);
      color: #111;
      cursor: pointer;
    }

    /* Invisible hit affordances — overlay controls, not a dashboard */
    .edge-btn {
      pointer-events: auto;
      position: absolute;
      border: 0;
      background: transparent;
      color: transparent;
      width: 18%;
      height: 40%;
      top: 30%;
      cursor: pointer;
      z-index: 5;
    }
    .edge-btn.left { left: 0; }
    .edge-btn.right { right: 0; }
    .edge-btn.up {
      left: 20%;
      right: 20%;
      width: auto;
      height: 18%;
      top: 0;
      padding-top: var(--safe-top);
    }
    .edge-btn.down {
      left: 20%;
      right: 20%;
      width: auto;
      height: 14%;
      top: auto;
      /* Stop above drawer handle so dump zone doesn't eat the grip */
      bottom: calc(36px + var(--safe-bottom));
      padding-bottom: 0;
    }

    /* Bottom drawer — closed = low-profile handle only */
    #drawer {
      --drawer-closed: 28px;
      --drawer-open: 118px;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      height: calc(var(--drawer-closed) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: linear-gradient(180deg, transparent, rgba(8, 8, 10, 0.72) 28%, rgba(10, 10, 12, 0.94));
      transition: height 200ms cubic-bezier(0.2, 0.9, 0.2, 1);
      pointer-events: auto;
      touch-action: none;
    }
    #drawer.open {
      height: calc(var(--drawer-open) + var(--safe-bottom));
      background: linear-gradient(180deg, rgba(8, 8, 10, 0.15), rgba(10, 10, 12, 0.96) 22%);
    }
    #drawer.dragging { transition: none; }
    #drawer-handle {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 28px;
      width: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 0;
      color: inherit;
    }
    #drawer-handle .grip {
      width: 42px;
      height: 4px;
      border-radius: 999px;
      background: rgba(247, 241, 232, 0.38);
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      transition: background 120ms ease, width 120ms ease;
    }
    #drawer.open #drawer-handle .grip,
    #drawer-handle:active .grip {
      background: rgba(247, 241, 232, 0.72);
      width: 52px;
    }
    #thumbs {
      display: flex;
      gap: 10px;
      padding: 0 16px 10px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      scrollbar-width: none;
      height: 0;
      opacity: 0;
      pointer-events: none;
      transition: height 200ms cubic-bezier(0.2, 0.9, 0.2, 1), opacity 140ms ease;
    }
    #thumbs::-webkit-scrollbar { display: none; }
    #drawer.open #thumbs {
      height: 82px;
      opacity: 1;
      pointer-events: auto;
    }
    .thumb {
      flex: 0 0 auto;
      width: 112px;
      height: 72px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      background: #1a1a1e;
      padding: 0;
      cursor: pointer;
      scroll-snap-align: center;
      position: relative;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .thumb.active {
      border-color: rgba(247, 241, 232, 0.92);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
    }
    .thumb .n {
      position: absolute;
      left: 5px;
      bottom: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.85);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="card">
      <img id="plate" alt="Candidate" draggable="false" />
      <div class="veil board" id="veilBoard"></div>
      <div class="veil dump" id="veilDump"></div>
    </div>

    <div id="chrome">
      <div class="top">
        <div>
          <div class="title" id="title">Loading…</div>
          <div class="semantic" id="semantic"></div>
        </div>
        <div class="counter" id="counter">–/–</div>
      </div>
      <div class="hint-row">
        <div class="hint">← → <strong>browse</strong></div>
        <div class="hint center board">↑ <strong>Put on Board</strong></div>
        <div class="hint dump">↓ <strong>Dump</strong></div>
      </div>
    </div>

    <div id="flash"></div>

    <button type="button" class="edge-btn left" aria-label="Previous candidate" data-act="prev"></button>
    <button type="button" class="edge-btn right" aria-label="Next candidate" data-act="next"></button>
    <button type="button" class="edge-btn up" aria-label="Put on Board" data-act="board"></button>
    <button type="button" class="edge-btn down" aria-label="Dump" data-act="dump"></button>

    <div id="drawer" aria-expanded="false">
      <button type="button" id="drawer-handle" aria-label="Open candidate strip">
        <span class="grip" aria-hidden="true"></span>
      </button>
      <div id="thumbs" role="listbox" aria-label="Candidates"></div>
    </div>

    <div id="done">
      <div>
        <h1 id="doneTitle">Deck clear</h1>
        <p id="doneBlurb">Decisions stay in this browser until Mission MCP can take them. Swipe again after Reset.</p>
        <div class="feedback" id="feedbackBox" hidden></div>
        <pre class="log" id="log"></pre>
        <button type="button" id="reset">Reset deck</button>
      </div>
    </div>
  </div>

  <script>
    const THRESH = 72;
    const VELOCITY = 0.45;
    const STORAGE_KEY = "abbies.mission.review.decisions.v1";
    const DRAWER_CLOSED = 28;
    const DRAWER_OPEN = 118;

    const state = {
      deck: null,
      index: 0,
      decisions: [],
      dragging: false,
      startX: 0,
      startY: 0,
      dx: 0,
      dy: 0,
      t0: 0,
      locked: false,
      drawerOpen: false,
      drawerDrag: null,
    };

    const $ = (id) => document.getElementById(id);
    const card = $("card");
    const plate = $("plate");
    const flash = $("flash");
    const done = $("done");
    const drawer = $("drawer");
    const thumbs = $("thumbs");

    function buzz(ms = 12) {
      try { navigator.vibrate?.(ms); } catch { /* ignore */ }
    }

    function drawerHeights() {
      const safe = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--safe-bottom")) || 0;
      // safe-area is in env(); use padding from drawer itself
      const pad = parseFloat(getComputedStyle(drawer).paddingBottom) || 0;
      return {
        closed: DRAWER_CLOSED + pad,
        open: DRAWER_OPEN + pad,
      };
    }

    function setDrawerOpen(open, { animate = true } = {}) {
      state.drawerOpen = !!open;
      if (!animate) drawer.classList.add("dragging");
      drawer.classList.toggle("open", state.drawerOpen);
      drawer.setAttribute("aria-expanded", state.drawerOpen ? "true" : "false");
      $("drawer-handle").setAttribute(
        "aria-label",
        state.drawerOpen ? "Close candidate strip" : "Open candidate strip"
      );
      if (!animate) {
        requestAnimationFrame(() => drawer.classList.remove("dragging"));
      }
      if (state.drawerOpen) {
        const active = thumbs.querySelector(".thumb.active");
        active?.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
      }
      buzz(8);
    }

    function loadDecisions() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveDecision(entry) {
      state.decisions.push(entry);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.decisions));
    }

    function current() {
      return state.deck?.candidates?.[state.index] || null;
    }

    function renderThumbs() {
      thumbs.replaceChildren();
      if (!state.deck?.candidates?.length) return;
      state.deck.candidates.forEach((c, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "thumb" + (i === state.index ? " active" : "");
        btn.setAttribute("role", "option");
        btn.setAttribute("aria-selected", i === state.index ? "true" : "false");
        btn.dataset.index = String(i);
        const img = document.createElement("img");
        img.src = c.url;
        img.alt = c.label || `Candidate ${c.index}`;
        img.draggable = false;
        const n = document.createElement("span");
        n.className = "n";
        n.textContent = String(c.index);
        btn.append(img, n);
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          jumpTo(i);
        });
        thumbs.append(btn);
      });
    }

    function render() {
      const c = current();
      if (!c) {
        setDrawerOpen(false, { animate: true });
        showDone();
        return;
      }
      done.classList.remove("show");
      $("title").textContent = state.deck.title || "Review";
      $("semantic").textContent = state.deck.semanticId || "";
      $("counter").textContent = `${state.index + 1}/${state.deck.candidates.length}`;
      plate.src = c.url;
      plate.alt = c.label || `Candidate ${c.index}`;
      renderThumbs();
      resetCard(false);
    }

    function resetCard(animate) {
      card.classList.toggle("snap", !!animate);
      card.classList.remove("fly");
      card.style.transform = "translate3d(0,0,0) rotate(0deg)";
      card.style.opacity = "1";
      $("veilBoard").classList.remove("show");
      $("veilDump").classList.remove("show");
      state.dx = 0;
      state.dy = 0;
    }

    function renderFeedback(items) {
      const box = $("feedbackBox");
      const list = Array.isArray(items) ? items.filter(Boolean) : [];
      if (!list.length) {
        box.hidden = true;
        box.replaceChildren();
        return;
      }
      box.hidden = false;
      box.replaceChildren();
      const head = document.createElement("div");
      head.className = "kind";
      head.textContent = "ChatGPT / Mission feedback";
      box.append(head);
      list.slice(-8).forEach((f) => {
        const row = document.createElement("div");
        row.className = "row";
        const kind = document.createElement("div");
        kind.className = "kind";
        kind.textContent = f.kind || f.surface || "general";
        const text = document.createElement("div");
        text.textContent = f.text || "";
        row.append(kind, text);
        box.append(row);
      });
    }

    function showDone(opts = {}) {
      done.classList.add("show");
      if (opts.title) $("doneTitle").textContent = opts.title;
      if (opts.blurb) $("doneBlurb").textContent = opts.blurb;
      renderFeedback(opts.feedback || state.deck?.recentFeedback || []);
      $("log").textContent = state.decisions
        .map((d) => `${d.at.slice(11, 19)}  ${d.action.padEnd(5)}  #${d.candidateIndex}  ${d.deckId}`)
        .join("\n") || (opts.log || "(no decisions yet)");
    }

    function flashLabel(kind, text) {
      flash.textContent = text;
      flash.className = `show ${kind}`;
      setTimeout(() => { flash.className = ""; }, 280);
    }

    function jumpTo(i) {
      if (state.locked || !state.deck) return;
      if (i < 0 || i >= state.deck.candidates.length) return;
      state.index = i;
      buzz(10);
      render();
    }

    function go(delta) {
      if (state.locked || !state.deck) return;
      const next = state.index + delta;
      if (next < 0 || next >= state.deck.candidates.length) {
        buzz(8);
        resetCard(true);
        return;
      }
      state.index = next;
      buzz(10);
      render();
    }

    function commit(action) {
      if (state.locked || !current()) return;
      state.locked = true;
      setDrawerOpen(false);
      const c = current();
      const flyY = action === "board" ? -window.innerHeight * 1.15 : window.innerHeight * 1.15;
      card.classList.remove("snap");
      card.classList.add("fly");
      card.style.transform = `translate3d(0, ${flyY}px, 0) rotate(${action === "board" ? -6 : 6}deg)`;
      card.style.opacity = "0";
      flashLabel(action === "board" ? "board" : "dump", action === "board" ? "On Board" : "Dumped");
      buzz(action === "board" ? 18 : 24);

      const entry = {
        at: new Date().toISOString(),
        action,
        deckId: state.deck.id,
        missionId: state.deck.missionId || null,
        proofId: state.deck.proofId || null,
        requirementId: state.deck.requirementId || null,
        semanticId: state.deck.semanticId || null,
        candidateIndex: c.index,
        candidateUrl: c.url,
        surface: "ipad_gesture_review",
      };
      saveDecision(entry);
      postDecision(entry);

      window.__lastReviewDecision = entry;
      console.log("[review]", entry);

      setTimeout(() => {
        state.deck.candidates.splice(state.index, 1);
        if (state.index >= state.deck.candidates.length) state.index = Math.max(0, state.deck.candidates.length - 1);
        state.locked = false;
        render();
      }, 230);
    }

    function onPointerDown(e) {
      if (state.locked || done.classList.contains("show")) return;
      if (e.target.closest?.("#drawer")) return;
      if (e.target.closest?.(".edge-btn")) return;
      state.dragging = true;
      state.startX = e.clientX;
      state.startY = e.clientY;
      state.t0 = performance.now();
      state.dx = 0;
      state.dy = 0;
      card.classList.remove("snap", "fly");
      card.setPointerCapture?.(e.pointerId);
    }

    function onPointerMove(e) {
      if (!state.dragging || state.locked) return;
      state.dx = e.clientX - state.startX;
      state.dy = e.clientY - state.startY;
      const rot = state.dx * 0.04;
      card.style.transform = `translate3d(${state.dx}px, ${state.dy}px, 0) rotate(${rot}deg)`;
      const up = state.dy < -28;
      const down = state.dy > 28;
      $("veilBoard").classList.toggle("show", up);
      $("veilDump").classList.toggle("show", down);
    }

    function onPointerUp() {
      if (!state.dragging || state.locked) return;
      state.dragging = false;
      const dt = Math.max(16, performance.now() - state.t0);
      const vx = state.dx / dt;
      const vy = state.dy / dt;
      const absX = Math.abs(state.dx);
      const absY = Math.abs(state.dy);

      if (absY > absX && (absY > THRESH || Math.abs(vy) > VELOCITY)) {
        if (state.dy < 0 || vy < -VELOCITY) commit("board");
        else commit("dump");
        return;
      }
      if (absX > absY && (absX > THRESH || Math.abs(vx) > VELOCITY)) {
        if (state.dx < 0 || vx < -VELOCITY) go(1);
        else go(-1);
        return;
      }
      resetCard(true);
    }

    const stage = $("stage");
    stage.addEventListener("pointerdown", onPointerDown);
    stage.addEventListener("pointermove", onPointerMove);
    stage.addEventListener("pointerup", onPointerUp);
    stage.addEventListener("pointercancel", () => { state.dragging = false; resetCard(true); });

    // Drawer: tap handle toggles; drag handle/sheet vertically to open/close
    let suppressHandleClickUntil = 0;
    $("drawer-handle").addEventListener("click", (e) => {
      e.stopPropagation();
      if (performance.now() < suppressHandleClickUntil) return;
      setDrawerOpen(!state.drawerOpen);
    });

    drawer.addEventListener("pointerdown", (e) => {
      if (e.target.closest?.(".thumb")) return;
      if (e.target.closest?.("#thumbs") && state.drawerOpen) return;
      const { closed, open } = drawerHeights();
      state.drawerDrag = {
        startY: e.clientY,
        startH: state.drawerOpen ? open : closed,
        moved: false,
        pointerId: e.pointerId,
      };
      drawer.classList.add("dragging");
      drawer.setPointerCapture?.(e.pointerId);
      e.stopPropagation();
    });

    drawer.addEventListener("pointermove", (e) => {
      const d = state.drawerDrag;
      if (!d || d.pointerId !== e.pointerId) return;
      const { closed, open } = drawerHeights();
      const dy = d.startY - e.clientY; // up = positive = taller
      if (Math.abs(dy) > 6) d.moved = true;
      const h = Math.min(open, Math.max(closed, d.startH + dy));
      drawer.style.height = `${h}px`;
      const progress = (h - closed) / Math.max(1, open - closed);
      thumbs.style.height = `${Math.round(82 * progress)}px`;
      thumbs.style.opacity = String(progress);
      e.stopPropagation();
    });

    function endDrawerDrag(e) {
      const d = state.drawerDrag;
      if (!d) return;
      if (e && d.pointerId !== e.pointerId) return;
      const { closed, open } = drawerHeights();
      const currentH = parseFloat(drawer.style.height) || (state.drawerOpen ? open : closed);
      drawer.style.height = "";
      thumbs.style.height = "";
      thumbs.style.opacity = "";
      drawer.classList.remove("dragging");
      if (d.moved) {
        suppressHandleClickUntil = performance.now() + 280;
        const shouldOpen = currentH > (closed + open) / 2;
        state.drawerDrag = null;
        setDrawerOpen(shouldOpen);
      } else {
        state.drawerDrag = null;
      }
    }

    drawer.addEventListener("pointerup", endDrawerDrag);
    drawer.addEventListener("pointercancel", endDrawerDrag);

    document.querySelectorAll(".edge-btn").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const act = btn.dataset.act;
        if (act === "prev") go(-1);
        else if (act === "next") go(1);
        else if (act === "board") commit("board");
        else if (act === "dump") commit("dump");
      });
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      else if (e.key === "ArrowRight") go(1);
      else if (e.key === "ArrowUp") { e.preventDefault(); commit("board"); }
      else if (e.key === "ArrowDown") { e.preventDefault(); commit("dump"); }
      else if (e.key === " " || e.key === "t") {
        e.preventDefault();
        setDrawerOpen(!state.drawerOpen);
      }
      else if (e.key === "Escape" && state.drawerOpen) setDrawerOpen(false);
    });

    const MISSIONS_API = "https://studio-mock-iota.vercel.app/api/missions";
    const PLATE_BASE = "https://studio-mock-iota.vercel.app/api/plate";

    async function postDecision(entry) {
      const missionId = state.deck?.missionId;
      const proofId = state.deck?.proofId;
      if (!missionId || !proofId) {
        console.warn("[review] missing missionId/proofId — decision local only");
        return;
      }
      try {
        const res = await fetch(MISSIONS_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            missionId,
            proofId,
            action: entry.action,
            candidateIndex: entry.candidateIndex,
            surface: "ipad_gesture_review",
          }),
        });
        const payload = await res.json().catch(() => ({}));
        if (!res.ok) {
          console.warn("[review] world decide failed", res.status, payload);
          flashLabel("dump", res.status === 401 ? "Auth" : "Save fail");
        } else {
          console.log("[review] world saved", payload.worldRevision);
        }
      } catch (err) {
        console.warn("[review] world post failed", err);
      }
    }

    function deckFromSemantic(semantic, title) {
      const id = `deck.semantic.${String(semantic).replace(/\./g, "_")}`;
      return {
        id,
        title: title || semantic,
        semanticId: semantic,
        missionId: null,
        proofId: null,
        requirementId: null,
        status: "open",
        provider: "legacy_semantic",
        candidates: [
          {
            index: 1,
            label: "Candidate 1",
            url: `${PLATE_BASE}?semantic=${encodeURIComponent(semantic)}`,
          },
        ],
      };
    }

    async function boot() {
      const params = new URLSearchParams(location.search);
      const missionId = params.get("missionId");
      const proofId = params.get("proofId");
      const semantic = params.get("semantic");
      const deckUrl = params.get("deck");
      let raw;

      if (missionId) {
        const qs = new URLSearchParams({ missionId });
        if (proofId) qs.set("proofId", proofId);
        const res = await fetch(`${MISSIONS_API}?${qs}`);
        raw = await res.json();
        if (!res.ok) {
          throw new Error(
            raw?.hint ||
              raw?.error ||
              `mission_deck_failed ${res.status} — need Auth0 on Studio (ABBIES_WORLD_TOKEN) or Bearer`
          );
        }
      } else if (deckUrl) {
        const res = await fetch(deckUrl);
        if (!res.ok) throw new Error(`deck_load_failed ${res.status}`);
        raw = await res.json();
      } else if (semantic) {
        // Legacy plate-only view — not world SoT.
        raw = deckFromSemantic(semantic, params.get("title") || "");
      } else {
        // Inbox: list missions + ChatGPT feedback (sidecar check surface).
        const res = await fetch(MISSIONS_API);
        const payload = await res.json();
        if (!res.ok) {
          throw new Error(
            payload?.hint ||
              payload?.error ||
              `mission_list_failed ${res.status} — refresh Studio ABBIES_WORLD_TOKEN`
          );
        }
        const missions = payload.missions || [];
        const withFb = missions.filter((m) => m.lastFeedback);
        const awaiting = missions.filter((m) => m.awaitingProofs > 0);
        const lines = missions
          .slice(0, 12)
          .map((m) => {
            const bits = [`${m.title} [${m.status}]`];
            if (m.awaitingProofs) bits.push(`${m.awaitingProofs} awaiting`);
            if (m.lastFeedback) bits.push(`fb: ${m.lastFeedback.text.slice(0, 80)}`);
            return bits.join(" — ");
          });
        state.deck = {
          id: "inbox",
          title: "Mission inbox",
          candidates: [],
          recentFeedback: withFb.map((m) => ({
            kind: m.lastFeedback.kind,
            text: `${m.title}: ${m.lastFeedback.text}`,
            surface: m.lastFeedback.surface,
            at: m.lastFeedback.at,
          })),
        };
        state.decisions = [];
        setDrawerOpen(false, { animate: false });
        showDone({
          title: awaiting.length ? `${awaiting.length} awaiting review` : "Inbox",
          blurb: awaiting.length
            ? "Open a mission link to swipe Board/Dump. ChatGPT notes below."
            : "No art proofs waiting. ChatGPT mission_feedback shows below when present.",
          feedback: state.deck.recentFeedback,
          log: lines.join("\n") || "(no missions)",
        });
        return;
      }

      state.deck = structuredClone(raw);
      state.decisions = loadDecisions().filter((d) => d.deckId === state.deck.id);
      state.deck.candidates = (state.deck.candidates || []).filter(
        (c) =>
          !state.decisions.some(
            (d) => d.candidateIndex === c.index && (d.action === "board" || d.action === "dump")
          )
      );
      state.index = 0;
      setDrawerOpen(false, { animate: false });
      render();
    }

    $("reset").addEventListener("click", async () => {
      const all = loadDecisions().filter((d) => d.deckId !== state.deck?.id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
      state.decisions = [];
      await boot();
    });

    boot().catch((err) => {
      $("title").textContent = "Could not load deck";
      $("semantic").textContent = String(err?.message || err);
    });
  </script>
</body>
</html>
