<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scene Generator · Ranch Atelier</title><link rel="stylesheet" href="/navigation.css"><link rel="stylesheet" href="/app-style.css"><link rel="stylesheet" href="/scene-generator.css"><link rel="stylesheet" href="/tile-editor.css"><script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script></head><body><script src="/view-context.js"></script><script src="/app-actions.js"></script><header><a class="brand" href="/scene-generator"><strong>Scene Generator</strong></a></header><main><div class="scene-caption"><small>RANCH TILE EDITOR · METRE SCALE</small><h1 id="tile-title">Build your ranch</h1><p id="tile-caption">Drag a tile to move it. Drop on another tile to swap.</p></div><div id="scene-viewport" aria-label="Seven-cell hex board. Drag a tile to move or swap it. Hold middle mouse and drag to orbit; release to stop. Pinch to zoom."></div><section class="controls scene-controls"><label for="generator-family">Scene type</label><select id="generator-family" data-scene="ranch"><option value="ranch">Ranch · tile board</option><option value="market">Marketplace</option><option value="simulation">Ranch · daily simulation</option></select><p id="generator-description"></p><h2>Place a tile</h2><div id="tile-picker" class="tile-picker"><button data-tile="ranch">Ranch</button><button data-tile="paddock">Paddock</button><button data-tile="crop">Crop</button></div><label for="tile-type">Tile contents</label><select id="tile-type"><option value="ranch">Ranch</option><option value="paddock">Paddock</option><option value="crop">Crop</option><option value="woodland">Woodland</option><option value="pond">Pond</option><option value="meadow">Meadow</option></select><label for="tile-cell">Cell</label><select id="tile-cell"><option value="0">Center</option><option value="1">Ring 1 · East</option><option value="2">Ring 2 · Southeast</option><
