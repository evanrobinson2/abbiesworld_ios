<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abbie’s World: the demo</title>
<link rel="stylesheet" href="/app-style.css?v=1">
<style>
/* The demo flow (opening tour, scientist chat, board, mission board). The 3D stage fills the screen; everything else is
   a glass object summoned over it. The play HUD is two icon buttons and has zero words. */
html,body{margin:0;height:100%;overflow:hidden;background:#cfe6f5;font-family:var(--app-font,system-ui,sans-serif);color:var(--app-ink,#4c4330);-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
#smoke{position:fixed;inset:0;z-index:50;pointer-events:none;display:none}
#gate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:linear-gradient(160deg,#ffd9ea,#cfd8ff 55%,#cfeedd);transition:opacity .5s}
#gate.go{opacity:0;pointer-events:none}
#gate div{display:grid;gap:18px;justify-items:center;text-align:center;padding:24px}
#gate h1{margin:0;font:700 clamp(30px,7vw,52px)/1.05 var(--app-heading,Georgia,serif);letter-spacing:-.02em}
#gate button,.glass{appearance:none;border:1px solid #fff9;color:inherit;font:inherit;cursor:pointer;background:linear-gradient(170deg,#ffffffcc,#ffffff55);box-shadow:0 10px 26px #2a1f1230,inset 0 1px 0 #fff,inset 0 -3px 6px #00000014;backdrop-filter:none}
#gate button{border-radius:999px;padding:16px 36px;font-size:22px;font-weight:700;transition:transform .2s}
#gate button:hover{transform:translateY(-3px) scale(1.03)}
#dock{position:fixed;z-index:30;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end}
#dock[hidden],#chest[hidden]{display:none}
#pin{width:56px;height:56px;border-radius:20px;font-size:26px}
#tray{display:flex;gap:10px;padding:8px 12px;border-radius:22px;background:linear-gradient(170deg,#c99a63,#8a5b32);box-shadow:0 8px 20px #0004,inset 0 2px 0 #ffffff44}
#tray:empty{display:none}
.tile{width:56px;height:62px;border:0;cursor:pointer;background:none;position:relative;filter:drop-shadow(0 6px 8px #0003);transition:transform .2s}
.tile::before{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#9fe07a,#5aa05a)}
.tile.moon::before{background:linear-gradient(160deg,#e4e4ee,#8a8a98)}
.tile i{position:relative;font-style:normal;font-size:26px}
.tile.held{transform:translateY(-8px) scale(1.1)}.tile.locked{opacity:.55}
#chest{position:fixed;z-index:30;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:150px;padding:8px 10px 10px;border-radius:16px;background:linear-gradient(170deg,#7a5232,#4a301e);box-shadow:0 10px 22px #0005,inset 0 2px 0 #ffffff33,inset 0 -4px 8px #0006;color:#ffe9b8;text-align:center}
#chest b{display:block;font:700 12px var(--app-heading,Georgia,serif);letter-spacing:.06em;margin-bottom:5px}
#chest div{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.slot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:14px;background:#00000050;box-shadow:inset 0 2px 3px #0008}
.slot.have{background:radial-gradient(circle at 35% 30%,#fff3b0,#e8b84a)}
/* the town noticeboard: cork in a painted frame with a brass plate, four die-cut cards pinned on it */
.missions{position:fixed;z-index:25;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;width:min(900px,calc(100vw - 24px));transition:.5s cubic-bezier(.2,.9,.3,1.1);
 padding:30px 18px 18px;border-radius:18px;border:10px solid #3f7ea6;box-shadow:0 18px 40px #0005,inset 0 0 30px #5b3a1f88;
 background:radial-gradient(circle at 20% 30%,#d9a870,#c08850 60%,#b57d45)}
.missions.in{opacity:1;transform:translate(-50%,0)}
.plate{position:absolute;left:50%;top:-16px;transform:translateX(-50%);padding:3px 18px;border-radius:6px;background:linear-gradient(#efd27a,#c9a23a);color:#4a3412;font:800 13px var(--app-heading,Georgia,serif);letter-spacing:.14em;box-shadow:0 3px 6px #0005,inset 0 1px 0 #fff8}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr;gap:14px;align-items:start}
.card{position:relative;text-align:left;border-radius:10px;padding:16px 12px 14px;border:6px solid #fffdf4;color:inherit;font:inherit;cursor:pointer;transform:rotate(var(--tilt));
 background:radial-gradient(circle at 20% 0,color-mix(in srgb,var(--tint) 45%,#fff),#fffdf4 75%);box-shadow:0 8px 14px #3a24104d;transition:transform .2s}
.card:hover{transform:rotate(0) translateY(-4px)}
.card u{position:absolute;left:50%;top:-8px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a8a,#c4402e);box-shadow:0 2px 3px #0006;text-decoration:none}
.card i{font-style:normal;font-size:30px;display:block}.card h3{margin:2px 0 2px;font:700 15px/1.15 var(--app-heading,Georgia,serif)}.card p{margin:0;font-size:12px;opacity:.8;line-height:1.3}
.card em{display:inline-block;margin-top:6px;font:700 11px system-ui;font-style:normal;padding:3px 9px;border-radius:999px;background:#3f7ea6;color:#fff}
.card .medal{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:radial-gradient(circle at 35% 30%,#fff,var(--tint));box-shadow:inset 0 -3px 5px #0003,0 2px 6px #0003}
.card .tag{position:absolute;left:8px;bottom:8px;padding:2px 8px;border-radius:999px;background:#3f9d4a;color:#fff;font:800 11px system-ui}
.card.sealed{filter:grayscale(.9) brightness(.96)}
.card.finale{padding:22px 14px 18px}.card.finale h3{font-size:18px}.card.finale i{font-size:40px}
#mission{position:fixed;inset:0;z-index:45;background:#000}
#mission[hidden]{display:none}
#mission iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#mission button{position:absolute;z-index:2;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));width:44px;height:44px;border-radius:16px;font-size:20px}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card p{display:none}#chest{width:110px}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<canvas id="smoke"></canvas>
<div id="gate"><div><h1>Abbie’s World</h1><button aria-label="Begin">▶</button></div></div>
<div id="chest" hidden></div>
<div id="dock" hidden><button id="pin" class="glass" aria-label="Missions">📌</button><div id="tray"></div></div>
<div id="mission" hidden><button class="glass" aria-label="Back to the board">✕</button><iframe title="Mission" allow="autoplay; fullscreen"></iframe></div>
<script type="importmap">{"imports": {"three": "/vendor/three.module.js", "three/addons/loaders/GLTFLoader.js": "/vendor/loaders/GLTFLoader.js"}}</script>
<script type="module">import {start} from '/simulations/demo/flow.mjs'; start();</script>
<script type="module">/* Abbie's backpack: the inventory, on every page she plays (AW-STUDY-0046). Tap it or press B. */ import {inventory} from '/simulations/inventory.mjs?v=8'; inventory();</script>
</body>
</html>
