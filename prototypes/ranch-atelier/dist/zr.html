<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zombie Run · Asset workshop</title><link rel="stylesheet" href="/zr.css"><link rel="stylesheet" href="/app-appearance.css"><script src="/view-context.js" defer></script></head><body><header><a href="/sandbox" aria-label="Back to Sandbox">←</a><h1>Zombie Run <small>v0.1.1</small></h1><nav aria-label="Zombie Run"><button data-tab="assets" aria-selected="true">Assets</button><button data-tab="play">Play</button><button data-tab="direction">Art & plan</button></nav></header><main id="workspace"><aside id="filters"><label>Search assets<input id="search" type="search" placeholder="Name, category, company…"></label><label>Category<select id="category"><option>All</option></select></label><label>Status<select id="status"><option>All</option><option>In game · 2D</option><option>Reviewed · 3D source</option></select></label><label>Sort<select id="sort"><option value="name">Name A–Z</option><option value="category">Category</option><option value="status">Status</option></select></label><p id="count" aria-live="polite"></p><p class="muted">All registered Zombie Run assets. Reviewed 3D props are remaster sources; the playable run uses the labelled 2D set.</p><button id="launch">Suit up →</button></aside><section id="assets" aria-label="Asset previews"><div id="grid"></div></section><section id="play" hidden><div id="play-grid"><div id="stage"><canvas id="world" width="900" height="560" aria-label="School to home map"></canvas><div id="map-buttons"></div><div id="stage-caption"></div></div><aside id="game-panel"></aside><div id="party" aria-label="Party health"></div></div></section><section id="direction" hidden></section></main><dialog id="asset-dialog"><button id="close-detail" aria-label="Close asset details">×</button><div id="detail"></div></dialog><script type="module" src="/zr-app.mjs"></script></body></html>
