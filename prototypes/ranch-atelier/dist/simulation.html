<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Simulation · Abbie’s Ranch</title><link rel="stylesheet" href="navigation.css?v=9"><link rel="stylesheet" href="simulation.css"><link rel="stylesheet" href="/app-style.css?v=1"><script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script></head><body><script src="/view-context.js?v=1"></script>
<header><a class="brand" href="/simulation"><strong>Abbie’s Ranch</strong></a><button id="library">Saved runs</button></header>
<main id="stage"><svg id="map" role="img" aria-label="Simulation territory and inhabitants"></svg><section class="heading"><small>THE RANCH · SIMULATION</small><h1 id="title">A place to begin.</h1><p id="subtitle">Preview the land. Let the family build.</p></section><div class="map-tools"><button id="zoom-in" aria-label="Zoom in">＋</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="fit" aria-label="Whole territory">⌖</button><button id="ranch-view">Ranch</button></div><aside id="selection" hidden></aside>
<section class="controls"><div id="setup"><label>Region <select id="size"><option value="small">Small · tested baseline</option><option value="large">Large · 2× area & animals</option></select></label><span id="seed"></span><p id="objective">Build shelters and sustain 16 animals.</p><div class="actions"><button id="new">New territory</button><button id="run" class="primary">Run simulation</button></div></div>
<div id="running" hidden><p id="progress-text" role="status">Preparing…</p><progress id="progress" max="1" value="0"></progress><button id="cancel">Cancel run</button></div>
<div id="result" hidden><strong id="result-title">The ranch has grown.</strong><p id="summary"></p><div class="actions"><button id="save">Save</button><button id="discard">Discard</button><button id="watch" class="primary">Watch replay</button></div></div>
<div id="playback" hidden><div class="actions"><button id="play" class="primary">Pause</button><label>Speed <select id="speed"><option value="1">Real time</option><option value="10" selected>10 sec / sec</option><option value="60">1 min / sec</option><option value="300">5 min / sec</option><option value="1800">30 min / sec</option><option value="7200">2 hours / sec</option><option value="86400">1 day / sec</option></select></label><button id="end">Result</button></div><label class="timeline"><span id="clock"></span><input id="scrub" type="range" min="0" max="1" value="0" aria-label="Replay time"></label></div>
<p id="notice" role="status"></p><p id="planner-note"></p><details id="units" hidden><summary>People &amp; animals</summary><div id="unit-list"></div></details></section></main>
<dialog id="saved"><div class="dialog-head"><h2>Saved on this device</h2><button id="close-saved" aria-label="Close saved runs">×</button></div><div id="saved-list"></div><p>Runs stay in this browser. Clearing site data removes them.</p></dialog>
<script type="module" src="/simulation-visual.js"></script><script src="simulation.js"></script><script src="simulation-land-art.js"></script><script src="/navigation.js?v=brand-theme-1"></script></body></html>
