<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon Simulator</title></head><body><script>fetch('/index.html').then(r=>{if(!r.ok)throw Error('Simulator shell unavailable');return r.text()}).then(html=>{document.open();document.write(html.replace('<head>','<head><base href="/">').replace('<title>Simulations','<title>Moon Simulator'));document.close()}).catch(e=>document.body.textContent=e.message);</script></body></html>
