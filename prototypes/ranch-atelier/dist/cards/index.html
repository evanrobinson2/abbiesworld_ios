<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a120c">
<title>Card Forge · Abbie’s World</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/app-180.png">
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
<link rel="stylesheet" href="/cards/cards.css?v=1">
</head>
<body>
<script src="/view-context.js?v=1"></script>
<main id="table" aria-label="Card table">
  <div class="mark"><b>Card Forge</b><span id="set-name">Ranch</span></div>

  <div class="dock" role="toolbar" aria-label="Card Forge">
    <button id="btn-deal" class="orb" type="button" aria-label="Open a pack"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z" /><path d="M9 11h6M9 15h4" /></svg></button>
    <button id="btn-binder" class="orb" type="button" aria-label="Binder: every card in the set"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="9" rx="1.5" /><rect x="13" y="4" width="7" height="9" rx="1.5" /><rect x="4" y="15" width="7" height="5" rx="1.5" /><rect x="13" y="15" width="7" height="5" rx="1.5" /></svg></button>
    <button id="btn-print" class="orb" type="button" aria-label="Print and download"><svg viewBox="0 0 24 24"><path d="M7 9V4h10v5" /><rect x="4" y="9" width="16" height="7" rx="2" /><path d="M7 14h10v6H7z" /></svg></button>
  </div>

  <section id="stage" aria-live="polite">
    <div id="hero" class="c3d" hidden></div>
    <div id="caption" hidden>
      <p id="flavour"></p>
      <button id="qc-chip" type="button"></button>
    </div>
  </section>

  <section id="hand" aria-label="Your hand"></section>
  <div id="deck" aria-hidden="true"></div>

  <section id="binder" hidden aria-label="Binder">
    <div class="binder-head"><h2>Ranch · First Harvest</h2><p id="binder-sum"></p></div>
    <div id="binder-grid"></div>
  </section>

  <section id="qc-sheet" hidden aria-label="Quality check">
    <div class="sheet-card">
      <h3 id="qc-title"></h3>
      <ul id="qc-list"></ul>
      <button class="close" type="button" data-close>Done</button>
    </div>
  </section>

  <section id="print-sheet" hidden aria-label="Print">
    <div class="sheet-card">
      <h3>Print the set</h3>
      <p>Studio files are 600 ppi with 3 mm bleed, one PNG per card plus finish masks, the card back, the rubric manifests and the quality report. The home sheet prints nine cards a page with crop marks.</p>
      <div class="row">
        <button id="btn-zip" class="pill gold" type="button">Studio files (.zip)</button>
        <button id="btn-sheet" class="pill" type="button">Home print sheet</button>
      </div>
      <p id="print-status" class="status"></p>
      <button class="close" type="button" data-close>Close</button>
    </div>
  </section>

  <div id="loading"><div class="spinner"></div><p id="loading-text">Forging cards…</p></div>
</main>
<div id="print-pages" aria-hidden="true"></div>
<script src="/vendor/jszip.min.js"></script>
<script type="module" src="/cards/table.mjs?v=1"></script>
</body>
</html>
