<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fritigern: the wagon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Alegreya:ital,wght@0,500;1,500&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@500;600&display=swap">
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
<style>
  :root { --ink:#2c241d; --paper:#f4ecdc; --chip:#fbf6eaee; --line:#cdbf9f; }
  html,body { margin:0; height:100%; background:#1c1813; color:var(--ink); font:14px/1.35 Georgia, "Iowan Old Style", serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  #stage canvas { display:block; }
  .title { position:fixed; top:16px; left:16px; color:var(--paper); text-shadow:0 1px 6px #0008; pointer-events:none; max-width:min(440px, calc(100vw - 32px)); }
  .title small { letter-spacing:.14em; font-size:11px; opacity:.85; }
  .title h1 { margin:2px 0 4px; font-size:24px; font-weight:normal; }
  .title p { margin:0; font-size:13px; opacity:.9; }
  .bar { position:fixed; left:16px; right:16px; bottom:max(14px, env(safe-area-inset-bottom)); display:grid; gap:8px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; font-size:13px; padding:9px 12px; min-height:40px; border-radius:20px; border:1px solid var(--line); background:var(--chip); color:var(--ink); cursor:pointer; }
  button[aria-pressed="true"] { background:#5b3b2b; color:var(--paper); border-color:#5b3b2b; }
  .time { display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:center; background:var(--chip); border:1px solid var(--line); border-radius:22px; padding:6px 12px 6px 6px; }
  .time .track { position:relative; height:34px; }
  #strip { position:absolute; inset:0; width:100%; height:100%; }
  #scrub { position:absolute; inset:0; width:100%; opacity:0; cursor:pointer; margin:0; }
  #readout { font-size:13px; color:var(--paper); text-shadow:0 1px 5px #000a; min-height:18px; }
  #shot-label { position:fixed; top:16px; right:16px; color:var(--paper); font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.8; }

  #overlay { position:fixed; inset:0; pointer-events:none; overflow:hidden; font-family:"Barlow", system-ui, sans-serif; }
  #overlay > * { position:absolute; opacity:0; transition:none; }
  .ov-bars, .ov-vignette { opacity:1 !important; inset:0; display:none; }
  .ov-bars i { position:absolute; left:0; right:0; height:calc((100% - 100vw / 2.39) / 2); background:#000; }
  .ov-bars i:first-child { top:0 } .ov-bars i:last-child { bottom:0 }
  .ov-vignette { background:radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(10,6,2,.55) 100%); }
  [data-style="cinema"] .ov-bars, [data-style="telltale"] .ov-bars, [data-style="cinema"] .ov-vignette, [data-style="telltale"] .ov-vignette, [data-style="storybook"] .ov-vignette { display:block; }
  [data-style="storybook"] .ov-vignette { background:radial-gradient(ellipse at 50% 50%, transparent 58%, rgba(60,40,20,.45) 100%); box-shadow:inset 0 0 0 14px #efe4cc, inset 0 0 0 16px #b89a6a; }
  .ov-card { left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; color:#f6ead2; font:600 clamp(26px,5vw,60px)/1.1 Cinzel, Georgia, serif; letter-spacing:.18em; text-shadow:0 2px 18px #000c; }
  .ov-card small { display:block; font:500 clamp(12px,1.6vw,18px)/2 Cinzel, Georgia, serif; letter-spacing:.3em; opacity:.85; margin-top:6px; }
  .ov-card[data-kind="end"] { top:auto; bottom:calc((100% - 100vw / 2.39) / 2 + 22px); transform:none; font:italic 500 clamp(16px,2.2vw,26px)/1.3 Alegreya, Georgia, serif; letter-spacing:.02em; }
  .ov-card[data-kind="episode"] { font-family:"Barlow Condensed", sans-serif; font-weight:700; letter-spacing:.12em; }
  .ov-card[data-kind="episode"] small { font-family:"Barlow Condensed", sans-serif; font-size:clamp(18px,2.4vw,30px); letter-spacing:.06em; text-transform:none; }
  .ov-narr { left:50%; bottom:9%; transform:translateX(-50%); width:min(760px, 84%); text-align:center; color:#fff7e6; font:italic 500 clamp(18px,2.5vw,30px)/1.35 Alegreya, Georgia, serif; text-shadow:0 2px 10px #000, 0 0 2px #000; }
  .ov-line { left:50%; bottom:calc((100% - 100vw / 2.39) / 2 + 26px); transform:translateX(-50%); width:min(820px, 90%); text-align:center; color:#fff; font:600 clamp(16px,2.1vw,24px)/1.3 Barlow, sans-serif; text-shadow:0 2px 6px #000, 0 0 3px #000; }
  .ov-line b { display:block; font:700 .7em "Barlow Condensed", sans-serif; letter-spacing:.14em; margin-bottom:2px; }
  .ov-choices { left:50%; bottom:calc((100% - 100vw / 2.39) / 2 + 18px); transform:translateX(-50%); display:grid; grid-template-columns:1fr 1fr; gap:8px 28px; width:min(760px,92%); }
  .ov-choices span { color:#fff; font:600 clamp(14px,1.8vw,21px) Barlow, sans-serif; text-shadow:0 2px 6px #000; display:flex; gap:10px; align-items:center; }
  .ov-choices kbd { font:700 12px "Barlow Condensed", sans-serif; border:2px solid #fff; border-radius:4px; padding:1px 6px; }
  .ov-choices span.on { color:#ffd27a } .ov-choices span.on kbd { border-color:#ffd27a; background:#ffd27a; color:#111 } .ov-choices span.off { opacity:.3 }
  .ov-timer { grid-column:1 / -1; height:3px; background:#ffffff33; } .ov-timer i { display:block; height:100%; background:#fff; transform-origin:center; }
  .ov-remember { left:28px; top:calc((100% - 100vw / 2.39) / 2 + 18px); color:#fff; font:600 clamp(13px,1.6vw,18px) Barlow, sans-serif; text-shadow:0 2px 6px #000; display:flex; gap:8px; align-items:center; }
  .ov-remember i { font-style:normal; color:#ffd27a; font-size:1.3em; }
  .ov-objective { left:24px; top:22px; display:none; opacity:1 !important; color:#f4ead6; font:600 18px "Barlow Condensed", sans-serif; text-shadow:0 1px 4px #000; border-left:3px solid #ffcf7a; padding:2px 0 2px 10px; }
  .ov-objective small { display:block; font-size:11px; letter-spacing:.2em; color:#ffcf7a; }
  [data-style="hud"] .ov-objective, [data-style="hud"] .ov-map { display:block; }
  .ov-map { right:22px; bottom:22px; width:150px; height:150px; display:none; opacity:1 !important; }
  .ov-toast { left:50%; top:16%; transform:translateX(-50%); text-align:center; color:#fff; font:700 clamp(20px,2.6vw,30px) "Barlow Condensed", sans-serif; letter-spacing:.06em; text-shadow:0 2px 8px #000; }
  .ov-toast small { display:block; font-size:.5em; letter-spacing:.3em; color:#ffcf7a; }
  .ov-prompt { left:50%; bottom:20%; transform:translateX(-50%); color:#fff; font:600 18px Barlow, sans-serif; display:flex; gap:10px; align-items:center; text-shadow:0 2px 6px #000; }
  .ov-prompt kbd { background:#fff; color:#111; font:700 14px "Barlow Condensed", sans-serif; border-radius:50%; width:28px; height:28px; display:grid; place-items:center; }
  .ov-item { right:22px; top:22px; display:flex; gap:12px; align-items:center; background:linear-gradient(90deg, #2a1d0ecc, #4a3412cc); border:1px solid #e9b85c; padding:10px 14px; color:#fff; font:500 14px Barlow, sans-serif; max-width:320px; }
  .ov-item .ic { width:42px; height:42px; flex:none; background:radial-gradient(circle at 40% 35%, #ffe7a3, #c8902e 60%, #6e4a14); clip-path:polygon(50% 0, 95% 30%, 90% 75%, 50% 100%, 10% 75%, 5% 30%); }
  .ov-item small { display:block; color:#ffcf7a; font:700 11px "Barlow Condensed", sans-serif; letter-spacing:.2em; } .ov-item b { display:block; font:700 18px "Barlow Condensed", sans-serif; } .ov-item span { opacity:.8; font-size:12px; }
  .ov-tag { left:0; top:0; text-align:center; color:#fff; font:700 13px "Barlow Condensed", sans-serif; letter-spacing:.1em; text-shadow:0 1px 4px #000; display:grid; gap:2px; justify-items:center; }
  .ov-tag small { font:500 10px Barlow, sans-serif; letter-spacing:.05em; opacity:.85; }
  .ov-tag meter { width:70px; height:6px; }
  .styles { display:flex; gap:6px; flex-wrap:wrap; }
  .styles button { min-height:34px; padding:6px 11px; font-size:12px; background:#2b2420dd; color:var(--paper); border-color:#5a4a3a; }
  .styles button[aria-pressed="true"] { background:#e2a25a; color:#1c1813; border-color:#e2a25a; }
  .noui #overlay { z-index:5 }
  .noui .bar, .noui .title, .noui #shot-label { display:none; }
  @media (max-width:600px) { .title h1 { font-size:19px; } .title p { display:none; } button { padding:8px 10px; font-size:12px; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="title"><small>FRITIGERN · SCENE 1 · BLOCKING STUDY</small><h1>The wagon</h1><p>Outside Marcianople, 376. Alaric waits in the wagon at the edge of the camp. His father comes back through the gate, wounded, carrying a Roman officer's helmet.</p></div>
<span id="shot-label"></span>
<div id="overlay"></div>
<div class="bar">
  <div class="styles" role="group" aria-label="Presentation style"><button data-style="clean">Clean</button><button data-style="cinema">Cinema</button><button data-style="storybook">Storybook</button><button data-style="hud">Game HUD</button><button data-style="telltale">Telltale</button></div>
  <div id="readout"></div>
  <div class="row">
    <button data-shot="director">Director</button>
    <button data-shot="wide">Wide</button>
    <button data-shot="alaric">Alaric's eyes</button>
    <button data-shot="over">Over his shoulder</button>
    <button data-shot="reverse">Reverse</button>
    <button data-shot="follow">Follow Fritigern</button>
    <button data-shot="orbit">Free look</button>
    <button id="rays">Sightline</button>
  </div>
  <div class="time"><button id="play" aria-label="Play or pause">▶</button><div class="track"><canvas id="strip"></canvas><input id="scrub" type="range" min="0" value="0" aria-label="Scene time"></div></div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
