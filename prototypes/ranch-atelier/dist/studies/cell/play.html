<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Abbie's Science Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
/* AW-STUDY-0047: Abbie's science adventure. The green goo outside the science lab in Abbie's Town is alive; a drop
   under the lab's lens becomes a pond, and Abbie is a tiny pink cell in it. Style from Spore's Cell Stage (Oracle
   record docs/oracle/identity/examples/spore.json), never its expression. The water is a shader
   (simulations/lens-pond.mjs), the cells are rigged SVG (simulations/microbe-kit.mjs), and every cell body is a
   liquid-glass lens that bends the water behind it. Round 2 (Evan 12:49 PM): couch brawl, five difficulty levels, boost cards, evolution to a tardigrade, and you win by
   walking off the slide. Play HUD: a small glass pill per player and their hand of cards, zero words. */
html,body{margin:0;height:100%;background:#0b2a24;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:Fredoka,ui-rounded,system-ui,sans-serif}
#pond{position:fixed;left:0;top:0;width:100vw;height:100dvh;display:block}
#world{position:fixed;left:0;top:0;width:100vw;height:100dvh;display:block;overflow:visible}
.glass{position:fixed;z-index:4;border-radius:22px;border:1px solid rgba(255,255,255,.7);
 background:linear-gradient(160deg,rgba(255,255,255,.34),rgba(255,255,255,.06) 45%),rgba(222,255,240,.12);
 -webkit-backdrop-filter:blur(10px) saturate(1.7);backdrop-filter:blur(10px) saturate(1.7);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(0,40,30,.25),0 8px 26px rgba(0,20,16,.35)}
/* each player's corner: a glass pill with their cell (it heats red as it's hit, Brawlhalla's lesson: the colour is the
   gauge), five growth beads and, for player one, Daddy's coins. Rivals played by the goo get a smaller pill. */
#huds{opacity:0;transition:opacity .4s}#huds.on{opacity:1}
.phud{height:34px;padding:0 10px 0 6px;display:flex;align-items:center;gap:6px;pointer-events:none}
.phud.tl{left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top))}
.phud.tr{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top))}
.phud.bl{left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom))}
.phud.br{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom))}
.phud.bot{transform:scale(.72);opacity:.85}.phud.bot.tr{transform-origin:100% 0}.phud.bot.bl{transform-origin:0 100%}.phud.bot.br{transform-origin:100% 100%}
@media (max-width:700px){.phud.bot.bl{bottom:auto;top:calc(max(12px,env(safe-area-inset-top)) + 30px);left:auto;right:max(12px,env(safe-area-inset-right));transform-origin:100% 0}.phud.bot.br{bottom:auto;top:calc(max(12px,env(safe-area-inset-top)) + 60px);transform-origin:100% 0}}
.phud .me{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,transparent 13%),color-mix(in srgb,var(--c),#ff3b1f calc(var(--h,0) * 100%));box-shadow:inset 0 0 0 2px var(--d),0 0 calc(var(--h,0) * 14px) #ff5a2a;transition:transform .2s}
.phud .me.ko{transform:scale(.4);opacity:.4}
.hand{bottom:max(12px,env(safe-area-inset-bottom))}.hand.tl{left:max(12px,env(safe-area-inset-left))}.hand.tr{right:max(12px,env(safe-area-inset-right))}
.hand.bl{left:max(12px,env(safe-area-inset-left));bottom:auto;top:40%}.hand.br{right:max(12px,env(safe-area-inset-right));bottom:auto;top:40%}
.aw-caption{bottom:calc(max(18px,env(safe-area-inset-bottom)) + var(--aw-chh,0px) + var(--hand-h,0px))!important}
#back{left:50%;right:auto;margin-left:-18px;width:36px;height:36px}
#win{position:fixed;left:0;top:0;width:100vw;height:100dvh;z-index:7;background:#2a2238;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .8s}
#win.on{opacity:1}
#win .scope{position:absolute;left:50%;bottom:34%;height:min(40vh,300px);translate:-95% 0}
#win .glow{position:absolute;left:50%;bottom:24%;width:min(80vw,520px);aspect-ratio:1;translate:-50% 0;border-radius:50%;background:radial-gradient(circle,rgba(255,216,74,.35),rgba(255,216,74,0) 65%)}
#win .bench{position:absolute;left:0;right:0;bottom:0;height:34%;background:#6b4a33;border-top:14px solid #8c6446}
#win .slide{position:absolute;left:50%;bottom:calc(34% - 8px);width:min(70vw,420px);height:22px;translate:-50% 0;border-radius:4px;background:#cfe7ee;box-shadow:inset 0 2px 0 #fff,0 6px 12px rgba(0,0,0,.3)}
#win .slide i{position:absolute;left:30%;top:-6px;width:28%;height:12px;border-radius:50%;background:#9cf06a;opacity:.8}
#win .bear{position:absolute;left:50%;bottom:calc(34% - 4px);width:min(30vw,170px);animation:walk 2.4s ease-out forwards}
#win .bear svg{width:100%;height:auto;display:block}
#win .bear svg.pk{position:absolute;width:48%;left:4%;top:-14%;overflow:visible}
#win .bear .swing{animation:jingle 1.1s ease-in-out infinite;transform-origin:76px 54px}@keyframes jingle{50%{transform:rotate(16deg)}}
@keyframes walk{from{transform:translate(-20%,0)}to{transform:translate(60%,30px)}}
.phud .bead{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7);position:relative;overflow:hidden}
#huds .bead.done{background:radial-gradient(circle at 35% 30%,#fff,#ff8fd0 45%,#c93c95)}
#huds .bead i{position:absolute;left:0;bottom:0;width:100%;background:#ff8fd0;transition:height .3s}
#huds .coin{width:15px;height:15px;margin-left:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c0,#ffcc33 45%,#c98a08);box-shadow:0 0 0 1.5px #7a4f00}
#huds b{color:#fff;font-weight:600;font-size:16px;text-shadow:0 1px 2px rgba(0,0,0,.4);min-width:10px}
#back{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;padding:0;cursor:pointer;display:grid;place-items:center}
#back svg{width:20px;height:20px}
/* the part picker: two or three glass lenses, each magnifying a part on Abbie's cell. Summoned, never in play. */
#maker{left:50%;top:50%;transform:translate(-50%,-48%) scale(.9);width:min(86vw,400px);padding:12px 14px 14px;display:grid;gap:10px;opacity:0;pointer-events:none;z-index:6;transition:opacity .3s,transform .45s cubic-bezier(.2,1.4,.4,1);max-height:96dvh}
#maker.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#mkSvg{width:min(54vw,38dvh,240px);aspect-ratio:6/5;justify-self:center;overflow:visible}
#maker .row{display:flex;justify-content:center;gap:10px;align-items:center}
#maker .row button{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);padding:4px;cursor:pointer;display:grid;place-items:center;transition:transform .15s,border-color .15s,background .15s}
#maker .row button svg{width:100%;height:100%;overflow:visible}
#maker .row button.sw{width:30px;height:30px;padding:0;background:var(--c);box-shadow:inset 0 -3px 5px rgba(0,0,0,.25),inset 0 2px 3px rgba(255,255,255,.7)}
#maker .row button[aria-pressed=true]{border-color:#fff;background:rgba(255,255,255,.4);transform:scale(1.14);box-shadow:0 0 14px rgba(190,255,235,.8)}
#maker .row button.sw[aria-pressed=true]{background:var(--c)}
#maker .stats{display:flex;justify-content:center;gap:16px}
#maker .stat{display:flex;gap:2px;align-items:center}
#maker .stat svg{width:16px;height:16px;margin-right:3px}
#maker .stat i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25)}
#maker .stat i.on{background:#bfffe9;box-shadow:0 0 6px #8ff7e8}
#maker .go{width:78px;height:78px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;border:2px solid #fff;background:radial-gradient(circle at 35% 30%,#fff,#b6ff6a 40%,#3fae46);box-shadow:0 8px 22px rgba(0,60,30,.5),inset 0 -6px 10px rgba(0,80,30,.35);cursor:pointer;padding:0;display:grid;place-items:center}
#maker .go:active{transform:scale(.93)}
#maker .go svg{width:36px;height:36px}
#maker .row button.dice{width:40px;height:40px}
#pausem{left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);display:flex;gap:14px;padding:16px 18px;opacity:0;pointer-events:none;z-index:9;transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1)}
#pausem.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#pausem button{width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.14);padding:12px;cursor:pointer}
#pausem button:active{transform:scale(.93)}#pausem svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#hint{position:fixed;left:50%;top:64%;translate:-50% 0;z-index:5;pointer-events:none;opacity:0;transition:opacity .5s}
#hint.on{opacity:.95}#hint svg{width:84px;height:84px;display:block;overflow:visible}
#hint .ring{animation:hintring 1.6s ease-out infinite;transform-origin:center}@keyframes hintring{from{r:8;opacity:.9}to{r:34;opacity:0}}
#hint .fing{animation:hintdrag 1.6s ease-in-out infinite}@keyframes hintdrag{0%{transform:translate(0,0)}60%{transform:translate(26px,-16px)}100%{transform:translate(0,0)}}
#win .rew{position:absolute;left:0;right:0;top:9%;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transition:opacity .8s .6s}
#win.on .rew{opacity:1}
#win .row{display:flex;gap:16px;align-items:center}
#win .charm{width:min(26vw,110px);aspect-ratio:1;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.7),rgba(190,170,255,.28) 55%,rgba(60,40,120,.45));box-shadow:0 0 34px rgba(190,170,255,.65),inset 0 -8px 14px rgba(40,20,90,.35);animation:charmin 1.2s .8s cubic-bezier(.2,1.5,.4,1) backwards}
#win .charm svg{width:100%;height:auto}
#win .gcoin{width:min(18vw,74px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c0,#ffcc33 45%,#c98a08);box-shadow:0 0 0 3px #7a4f00,0 0 30px rgba(255,208,70,.8);animation:charmin 1.2s 1.3s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes charmin{from{transform:scale(.2) rotate(-40deg);opacity:0}}
#win .stats{display:flex;gap:10px}#win .stats b{padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.5);color:#fff;font:600 17px Fredoka,system-ui,sans-serif}
.beaker .star{pointer-events:none}
#picker{position:fixed;left:50%;top:70%;transform:translate(-50%,-50%) scale(.6);display:flex;gap:18px;z-index:6;opacity:0;pointer-events:none;transition:opacity .3s,transform .45s cubic-bezier(.2,1.4,.4,1)}
#picker.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#picker button{width:min(34vw,150px);aspect-ratio:1;border-radius:50%;padding:10px;cursor:pointer;position:relative}
#picker button:active{transform:scale(.94)}
#picker svg{width:100%;height:100%;overflow:visible}
.pi-hair{animation:hair .6s ease-in-out infinite alternate;animation-delay:calc(var(--j)*-.07s);transform-origin:0 0;transform-box:fill-box}
@keyframes hair{to{transform:rotate(28deg)}}
.pi-jawa{animation:jawa .5s ease-in-out infinite alternate;transform-origin:.8px .12px}
.pi-jawb{animation:jawb .5s ease-in-out infinite alternate;transform-origin:.8px -.12px}
@keyframes jawa{to{transform:rotate(28deg)}}@keyframes jawb{to{transform:rotate(-28deg)}}
.pi-tail{animation:tail .5s ease-in-out infinite alternate}
@keyframes tail{to{d:path("M-.95 0C-1.3 .25 -1.5 -.25 -1.9 0")}}
.pi-puff{animation:puff 1s steps(12) infinite}
@keyframes puff{from{r:.08;opacity:.9}to{r:.42;opacity:0}}
/* the lab: the beaker of goo on the bench, the lens over the slide */
#lab{position:fixed;left:0;top:0;width:100vw;height:100dvh;z-index:7;transition:opacity .6s;background:#2a2238}
#lab.gone{opacity:0;pointer-events:none}
#lab svg{width:100%;height:100%;display:block}
#beaker{cursor:pointer}
#lensRing{position:fixed;left:0;top:0;width:100vw;height:100dvh;z-index:5;pointer-events:none;overflow:visible}
.coinfly{position:fixed;z-index:8;width:64px;height:64px;margin:-32px 0 0 -32px;pointer-events:none}
</style>
</head>
<body>
<canvas id="pond"></canvas>
<svg id="world" aria-label="A drop of green goo under the lens">
 <defs></defs>
 <g id="cam"><g id="shadows"></g><g id="food"></g><g id="clouds"></g><g id="cells"></g><g id="fx"></g></g>
 <g id="pres"></g>
</svg>
<svg id="lensRing" aria-hidden="true"></svg>
<div id="huds"></div>
<button id="back" class="glass" aria-label="Back to the lab"><svg viewBox="0 0 20 20"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

 <div class="stats" aria-hidden="true"></div>
 <div class="row"><button class="dice" type="button" aria-label="Surprise me"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.3" fill="#fff"/><circle cx="15" cy="15" r="1.3" fill="#fff"/><circle cx="15" cy="9" r="1.3" fill="#fff"/><circle cx="9" cy="15" r="1.3" fill="#fff"/></svg></button>
  <button class="go" type="button" aria-label="Drop in"><svg viewBox="0 0 24 24" fill="#17612a"><path d="M12 3c3.5 4.6 6 7.8 6 11a6 6 0 0 1-12 0c0-3.2 2.5-6.4 6-11z"/></svg></button></div></div>
<div id="win" aria-label="Off the slide"><svg class="scope" viewBox="0 0 120 200" aria-hidden="true"><path d="M20 190h80M60 190V80M60 80l30-50M84 14l18 24" stroke="#c9c2dd" stroke-width="12" stroke-linecap="round" fill="none"/><circle cx="96" cy="26" r="16" fill="#9ee8ff" stroke="#fff" stroke-width="4"/><rect x="28" y="140" width="64" height="9" rx="3" fill="#e6e1f2"/></svg><div class="glow"></div><div class="bench"></div><div class="slide"><i></i></div><div class="bear"></div><div class="rew"><div class="row"><div class="charm"></div><div class="gcoin"></div></div><div class="stats"></div></div></div>
<div id="lab">
 <svg viewBox="0 0 400 700" preserveAspectRatio="xMidYMid meet" aria-label="The science lab bench">
  <defs>
   <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d3358"/><stop offset="1" stop-color="#2a2238"/></linearGradient>

   <ellipse cx="38" cy="124" rx="40" ry="7" fill="#000" opacity=".25"/>
   <path d="M10 10h56M16 10v90q0 22 22 22q22 0 22-22V10" fill="rgba(220,240,255,.16)" stroke="#e8f4ff" stroke-width="4" stroke-linejoin="round"/>
   <path d="M19 52q10-6 19 0t19 0v48q0 19-19 19q-19 0-19-19Z" fill="url(#goo3)"/>

function frameCamera(dt) {

 for (const c of focus) { x0 = Math.min(x0, c.x); x1 = Math.max(x1, c.x); y0 = Math.min(y0, c.y); y1 = Math.max(y1, c.y); rr = Math.max(rr, c.r); }

let last = performance.now(), fps = 60, slow = 0;
function loop(now) {

const STATS = {speed: c => (c.move === 'flagellum' ? 3 : 2), turn: c => (c.move === 'cilia' ? 3 : 1) + (c.eyes === 3 ? 1 : 0), bite: c => (c.mouth === 'jaw' ? 3 : 1), graze: c => (c.mouth === 'filter' ? 3 : 1)};
const STAT_ICON = {speed: '<path d="M3 12h14M12 6l6 6-6 6" />', turn: '<path d="M5 12a7 7 0 1 1 7 7M5 12l-2-3M5 12l3-2" />', bite: '<path d="M4 8l4 8 4-8 4 8 4-8" />', graze: '<path d="M12 21V8M12 12c-5 0-7-4-7-8 5 0 7 3 7 8zM12 15c4 0 6-3 6-6-4 0-6 2-6 6z" />'};
