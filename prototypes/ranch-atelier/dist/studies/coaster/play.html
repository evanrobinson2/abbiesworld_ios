<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Toy-Car Coaster</title>
<style>
/* AW-STUDY-0054: the toy-car coaster at the skate park on Main Street. Round 2: a garage of six cars, our own theme
   music and the sound store's effects, golden-hour light with bloom, letterbox bars for the cinematic moments, slow motion
   when a tennis ball nearly takes your head off and while you fly the gap, and an on-ride photo at the end.
   No words on screen: a play orb, a star chip and a thin progress line while you ride, a photo and a prize at the end. */
html,body{margin:0;height:100%;background:#9fd6f0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100dvh}
.glass{position:fixed;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.55);
 box-shadow:0 10px 30px rgba(20,60,90,.3),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -6px 14px rgba(40,120,160,.2);-webkit-backdrop-filter:none;backdrop-filter:none}
#back,#again,#go,#prize{display:grid;place-items:center;color:#fff;text-decoration:none;cursor:pointer}
#back{left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:44px;height:44px;opacity:.85;z-index:3;transition:top .3s ease}
/* the town's overhead strip (the chronograph: time, weather, season, pause) rides along: shown in the garage, tucked away
   during the ride and the cinematic beats, and summoned with a tap at any time; the back button steps down beside it */
#v2-chrono,#v2-box{transition:opacity .3s ease,transform .3s ease}
body.tucked #v2-chrono,body.tucked #v2-box{opacity:0;transform:translateY(-14px);pointer-events:none}
body:not(.tucked) #back{top:calc(max(12px,env(safe-area-inset-top)) + 84px)}
#go{left:50%;top:62%;translate:-50% -50%;width:88px;height:88px;transition:transform .25s ease,opacity .35s ease;animation:breathe 2.4s ease-in-out infinite}
#go.gone{opacity:0;transform:scale(.6);pointer-events:none}
@keyframes breathe{50%{box-shadow:0 10px 40px rgba(255,170,60,.6),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -6px 14px rgba(40,120,160,.2)}}
#hud{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));height:36px;padding:0 12px 0 10px;display:none;align-items:center;gap:8px;z-index:3;
 color:#fff;font:800 16px/1 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(20,40,70,.6)}
#hud i{width:16px;height:16px;background:#ffe08a;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 0 4px #ffb020)}
#hud.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.25)}}
#prog{left:50%;top:max(14px,env(safe-area-inset-top));translate:-50% 0;width:120px;height:6px;display:none;overflow:hidden;z-index:3}
#prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd76a,#ff7a14)}
#prize{left:calc(50% + 120px);top:44%;translate:-50% -50%;width:112px;height:112px;font-size:56px;display:none;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
#photo{position:fixed;left:calc(50% - 70px);top:44%;translate:-50% -50%;width:min(56vw,300px);padding:10px 10px 34px;background:#fffdf7;border-radius:6px;display:none;rotate:-4deg;
 box-shadow:0 18px 50px rgba(20,30,50,.45);animation:drop .8s cubic-bezier(.2,1.4,.4,1)}
#photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:2px;background:#ccc}
#photo span{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:800 15px/1 ui-rounded,system-ui;color:#e85d04;letter-spacing:.06em}
@keyframes drop{from{transform:translateY(-60vh) rotate(18deg)}}
#fire{right:max(14px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:58px;height:58px;display:none;place-items:center;cursor:pointer;z-index:3;transition:transform .2s ease,box-shadow .3s ease}
#fire svg{width:30px;height:30px;filter:drop-shadow(0 1px 2px rgba(80,20,0,.5))}
#fire.on{box-shadow:0 0 0 2px #ffb020,0 0 26px rgba(255,120,20,.85),inset 0 1px 0 rgba(255,255,255,.7)}
#fire.new{animation:pop .7s cubic-bezier(.2,1.6,.4,1),breathe 1.6s ease-in-out .7s 4}
#again{left:50%;bottom:max(22px,env(safe-area-inset-bottom));translate:-50% 0;width:64px;height:64px;display:none;z-index:3}
/* the inspect pair: put it back (left) and choose it (right), small glass orbs low on the sides so the car stays clear */
#putback,#keep{bottom:max(26px,env(safe-area-inset-bottom));width:60px;height:60px;display:grid;place-items:center;color:#fff;cursor:pointer;z-index:3;opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;transform:scale(.7)}
#putback{left:max(22px,env(safe-area-inset-left))}#keep{right:max(22px,env(safe-area-inset-right))}
body.inspecting #putback,body.inspecting #keep{opacity:1;pointer-events:auto;transform:none}
#keep{box-shadow:0 0 0 2px #9be84c,0 10px 30px rgba(20,60,90,.3),inset 0 1px 0 rgba(255,255,255,.7)}
@media (max-width:560px){#photo{left:50%;top:40%}#prize{left:50%;top:76%;width:84px;height:84px;font-size:42px}}
</style>

<a id="back" class="glass" href="./" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>

<script type="module">

const opt = async p => { try { return await import(p); } catch { return {}; } };

const Q = new URLSearchParams(location.search), TEST = Q.has('test'), SKIP = Q.get('skip') === 'tile';

const AU = coasterAudio({muted: TEST});

// ---------- renderer, sky, golden-hour light ----------
const renderer = new T.WebGLRenderer({antialias: false, powerPreference: 'high-performance'});

const SUN_DIR = new T.Vector3(.62, .38, .42).normalize(); // a low late-afternoon sun: long shadows, warm rims
const skyMesh = new T.Mesh(new T.SphereGeometry(1000, 32, 16), new T.ShaderMaterial({side: T.BackSide, depthWrite: false, fog: false, uniforms: {uSun: {value: SUN_DIR}, uDay: {value: 1}, uCloud: {value: 0}},
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `uniform vec3 uSun; uniform float uDay, uCloud; varying vec3 vP; void main(){ float h = clamp(vP.y * 1.5 + .1, 0., 1.);
    vec3 lo = vec3(1., .78, .55), mid = vec3(.62, .8, .96), hi = vec3(.24, .46, .88);
    vec3 c = mix(lo, mid, smoothstep(0., .32, h)); c = mix(c, hi, smoothstep(.32, 1., h));
    vec3 n = mix(vec3(.16, .12, .26), vec3(.02, .04, .12), smoothstep(0., .6, h)); c = mix(n, c, uDay);

const hemi = new T.HemisphereLight('#a9d4ff', '#e8b98a', .85); scene.add(hemi);
const sun = new T.DirectionalLight('#ffd9a8', 3.1);
const [HX, HZ] = HEX_C; sun.position.set(HX + SUN_DIR.x * 160, SUN_DIR.y * 160, HZ + SUN_DIR.z * 160); sun.target.position.set(HX, 0, HZ); scene.add(sun, sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left: -95, right: 95, top: 95, bottom: -95, near: 10, far: 420}); sun.shadow.bias = -.0006; sun.shadow.normalBias = .03;
const fill = new T.DirectionalLight('#9fc4ff', .5); fill.position.set(HX - 80, 60, HZ - 90); scene.add(fill); // a cool bounce from the far side
// the world clock (shared with the town) drives the light: the hour moves the sun, clouds and rain dim and grey it, night
// brings out stars and leaves the track's lamps doing the work. Golden hour is the look the ride was lit for.
const SKY = {day: 1, cloud: 0, rain: 0, paused: false, hour: 17}, skyNow = {day: 1, cloud: 0, rain: 0};
const sunCol = new T.Color(), C_GOLD = new T.Color('#ffd9a8'), C_NOON = new T.Color('#fff4e6'), C_MOON = new T.Color('#8fa8d8'), fogDay = new T.Color('#ffd9b0'), fogNight = new T.Color('#1a2038'), fogGrey = new T.Color('#9aa3ad');
addEventListener('aw-world-clock', e => { const d = e.detail; SKY.hour = d.hour; SKY.day = Math.min(1, d.daylight * 1.6 + (d.hour > 5.5 && d.hour < 18.5 ? .15 : 0)); SKY.cloud = d.weather === 'Clear' ? 0 : 1; SKY.rain = d.weather === 'Rain' ? 1 : 0; SKY.paused = d.paused; });
const rainN = 700, rainPos = new Float32Array(rainN * 6), rainSeed = [...Array(rainN)].map(() => [(Math.random() - .5) * 40, Math.random() * 30, (Math.random() - .5) * 40]);
const rainGeo = new T.BufferGeometry(); rainGeo.setAttribute('position', new T.BufferAttribute(rainPos, 3));
const rain = new T.LineSegments(rainGeo, new T.LineBasicMaterial({color: '#cfe2f2', transparent: true, opacity: 0, fog: false, name: 'rain'})); rain.name = 'rain'; rain.frustumCulled = false; scene.add(rain);

  const dir = day > .05 ? new T.Vector3(Math.cos(a) * .85, Math.max(.12, Math.sin(Math.max(0, Math.min(Math.PI, a))) * .9), .42).normalize() : new T.Vector3(-.4, .7, .5).normalize();
  SUN_DIR.lerp(dir, k).normalize(); skyMesh.material.uniforms.uDay.value = day; skyMesh.material.uniforms.uCloud.value = cloud;
  sun.position.set(HX + SUN_DIR.x * 160, SUN_DIR.y * 160, HZ + SUN_DIR.z * 160);
  sunCol.copy(C_GOLD).lerp(C_NOON, Math.max(0, SUN_DIR.y - .35) * 1.6); sunCol.lerp(C_MOON, 1 - day); sun.color.copy(sunCol);

  scene.fog.color.copy(fogNight).lerp(fogDay, day).lerp(fogGrey, cloud * .6); renderer.toneMappingExposure = 1.08 + (1 - day) * .25;

  if (rain.visible) { const c = camera.getWorldPosition(new T.Vector3()); for (let i = 0; i < rainN; i++) { const r = rainSeed[i]; r[1] -= dt * 22; if (r[1] < -6) r[1] += 30; rainPos.set([c.x + r[0], c.y + r[1], c.z + r[2], c.x + r[0] + .05, c.y + r[1] + .7, c.z + r[2]], i * 6); } rainGeo.attributes.position.needsUpdate = true; }
}

// ---------- the world, the track ----------
const trk = buildTrack(T, TRACK_30S);
const world = buildWorld(T); scene.add(world);
const gates = buildGates(T, trk); scene.add(gates.group);
const trackG = trackMeshes(T, trk); scene.add(trackG);

// ---------- the garage: six original toy cars on a painted display stage at the foot of the start tower ----------
const garage = new T.Group(); garage.name = 'garage stage'; scene.add(garage);
{ const m = (c, o = {}) => new T.MeshStandardMaterial({color: c, roughness: .5, flatShading: true, ...o});

  const lip = new T.Mesh(new T.BoxGeometry(17.2, .14, .3), m('#ffcf3a', {emissive: '#ffb020', emissiveIntensity: .4})); lip.position.set(10.5, .5, 8.2); garage.add(lip);
  for (let i = 0; i < 6; i++) { const pad = new T.Mesh(new T.CylinderGeometry(1.05, 1.1, .12, 20), m(['#ff5d8f', '#ffcf3a', '#3ad1e0', '#9be84c', '#c58bff', '#ff7a14'][i])); pad.position.set(3.2 + i * 2.9, .56, 6); pad.name = 'turntable'; garage.add(pad); }
  const back = new T.Mesh(new T.BoxGeometry(17, 2.6, .25), m('#26324a')); back.position.set(10.5, 1.55, 3.9); back.castShadow = true; garage.add(back);
  for (let i = 0; i < 14; i++) { const b = new T.Mesh(new T.SphereGeometry(.09, 6, 4), new T.MeshStandardMaterial({color: '#fff', emissive: ['#ff5d8f', '#ffcf3a', '#3ad1e0', '#9be84c', '#c58bff'][i % 5], emissiveIntensity: 1.6})); b.position.set(2.6 + i * 1.22, 2.95, 4.05); garage.add(b); } }
const cars = CARS.map((def, i) => { const c = buildCar(T, def); c.position.set(3.2 + i * 2.9, .62, 6); c.rotation.y = Math.PI + .5; c.userData.slot = c.position.clone(); c.userData.slotRot = c.rotation.y; scene.add(c); return c; });
const tapProxy = c => { const p = new T.Mesh(new T.SphereGeometry(1.25, 8, 6), new T.MeshBasicMaterial({visible: false})); p.name = 'tap proxy'; p.position.y = .55; c.add(p); };
cars.forEach(tapProxy);
let car = cars[0];
const saved = (() => { try { return JSON.parse(localStorage.getItem('aw-coaster') || '{}'); } catch { return {}; } })();
if (saved.car) car = cars.find(c => c.userData.def.id === saved.car) || car;
if (saved.paint) car.userData.paint(saved.paint);
// the toy cars made from free Printables models (models/toy-cars.json) park on a second stage in front of the first
const modelCars = (async () => { const TM = await opt('/simulations/toy-car-models.mjs'); const list = TM.modelCarList ? await TM.modelCarList() : []; if (!list.length) return;
  const m = (c, o = {}) => new T.MeshStandardMaterial({color: c, roughness: .5, flatShading: true, ...o}), n = list.length, w = n * 2.9 + 1.4;
  const stage = new T.Mesh(new T.BoxGeometry(w, .3, 3.6), m('#3a2f4f')); stage.position.set(2.2 + w / 2 - .7, .15, 10.2); stage.receiveShadow = true; stage.name = 'garage stage (free models)'; garage.add(stage);
  await Promise.all(list.map(async (def, i) => { try { const c = await TM.loadModelCar(T, def); const x = 2.9 + i * 2.9;
    const pad = new T.Mesh(new T.CylinderGeometry(1.05, 1.1, .1, 20), m(['#ffcf3a', '#3ad1e0', '#ff5d8f', '#9be84c', '#c58bff', '#ff7a14', '#f4ece0', '#1fb6c9'][i % 8])); pad.position.set(x, .35, 10.2); pad.name = 'turntable'; garage.add(pad);
    c.position.set(x, .4, 10.2); c.rotation.y = Math.PI + .5; c.userData.slot = c.position.clone(); c.userData.slotRot = c.rotation.y; tapProxy(c); scene.add(c); cars.push(c);
    if (saved.car === def.id && S.mode !== 'ride' && car !== c) { const old = car; old.position.copy(old.userData.slot); old.rotation.set(0, old.userData.slotRot, 0); car = c; parkAtStart(c); if (saved.paint) c.userData.paint(saved.paint); }
  } catch (e) { console.warn('toy car', def.id, e.message); } }));
  if (S.mode === 'zoom' && !tween) tweenTo(frameGarage(), 1.2); })();

// the mirror charms: whatever Abbie has earned hangs in front of her, inside whichever car she picks
const charmRig = new T.Group(); charmRig.name = 'mirror charms';
const charms = [];
{ const ids = (BP.keychain ? BP.keychain() : []).slice(0, 5), list = BP.CHARMS || [];
  const mir = new T.Mesh(new T.CylinderGeometry(.018, .018, .006, 16), new T.MeshStandardMaterial({color: '#e8f4ff', emissive: '#8fc3ea', emissiveIntensity: .35, roughness: .15, name: 'mirror glass'})); mir.rotation.x = Math.PI / 2; mir.scale.x = 1.8; mir.name = 'mirror'; charmRig.add(mir);
  ids.forEach((id, k) => { const c = list.find(x => x.id === id); if (!c) return;
    const cv = document.createElement('canvas'); cv.width = cv.height = 64; const g = cv.getContext('2d'); g.font = '44px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(c.icon, 32, 34);
    const tex = new T.CanvasTexture(cv); tex.colorSpace = T.SRGBColorSpace; const sp = new T.Sprite(new T.SpriteMaterial({map: tex, transparent: true})); sp.scale.setScalar(.075); sp.position.y = -.08;
    const g2 = new T.Group(); g2.position.set(-.04 + k * .022, -.02, 0); g2.add(sp); charmRig.add(g2); charms.push({g: g2, ph: k * 1.3}); }); }
charmRig.visible = false;
const driver = new T.Group(); driver.name = 'Abbie (toy figure)';
{ const m = (n, c, o = {}) => new T.MeshStandardMaterial({name: n, color: c, roughness: .45, ...o});
  const body = new T.Mesh(new T.CapsuleGeometry(.13, .16, 3, 10), m('jacket pink', '#ff6fa8')); body.position.y = -.2; driver.add(body);
  const head = new T.Mesh(new T.SphereGeometry(.12, 14, 10), m('skin', '#f2c6a0')); head.position.y = .02; driver.add(head);
  const helmet = new T.Mesh(new T.SphereGeometry(.15, 16, 10, 0, Math.PI * 2, 0, Math.PI * .55), m('helmet pink gloss', '#ff3d8b', {roughness: .2})); helmet.position.y = .04; driver.add(helmet);
  const visor = new T.Mesh(new T.SphereGeometry(.152, 16, 6, -Math.PI * .35 - Math.PI / 2, Math.PI * .7, Math.PI * .32, Math.PI * .2), m('visor glass', '#3ad1e0', {metalness: .5, roughness: .1})); visor.position.y = .04; driver.add(visor);
  const pack = new T.Mesh(new T.BoxGeometry(.2, .2, .1), m('backpack canvas', '#c58bff')); pack.position.set(0, -.18, .15); driver.add(pack);
  for (let i = 0; i < 3; i++) { const ch = new T.Mesh(new T.SphereGeometry(.025, 6, 4), m('charm', ['#ffd23a', '#3ad1e0', '#ff5d8f'][i], {metalness: .6, roughness: .2})); ch.position.set(-.05 + i * .05, -.28, .21); driver.add(ch); }
  for (const sx of [-1, 1]) { const arm = new T.Mesh(new T.CapsuleGeometry(.04, .14, 2, 6), m('jacket pink', '#ff6fa8')); arm.position.set(sx * .15, -.14, -.1); arm.rotation.x = 1.1; driver.add(arm); }
  driver.traverse(o => { if (o.isMesh) o.castShadow = true; }); }
