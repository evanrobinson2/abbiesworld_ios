<title>The School Jump</title>
<style>
/* AW-STUDY-0032: the school jump, game ready. Walk bub, three throws, the third lands on the roof; a side-on climb where
   one tap moves the right hand; an iso roof you sneak across while station wagons sweep past at golden dusk.
   No words on screen: a play orb to begin, one small score chip, a timing glass only while you need it. */
html,body{margin:0;height:100%;background:#2a1f33;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100dvh}
body.pixel canvas{image-rendering:pixelated}
.glass{position:fixed;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.45);
 box-shadow:0 10px 30px rgba(20,10,40,.35),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -6px 14px rgba(80,40,120,.18)}
#hang{left:50%;bottom:max(18px,env(safe-area-inset-bottom));translate:-50% 0;width:min(56vw,240px);height:34px;display:none}
#hang i{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%}
#zone{position:absolute;top:6px;bottom:6px;border-radius:999px;background:linear-gradient(90deg,#ffd76a,#ffb347);box-shadow:0 0 14px #ffcf5a}
#ring{left:50%;bottom:max(18px,env(safe-area-inset-bottom));translate:-50% 0;width:68px;height:68px;border-radius:50%;display:none}
#ring svg{position:absolute;inset:0;overflow:visible}
#dot{background:radial-gradient(circle at 35% 30%,#fff,#e9f2ff 40%,#8fb4ff);box-shadow:0 2px 8px rgba(0,0,40,.4)}
#back,#again,#go{width:44px;height:44px;display:grid;place-items:center;color:#fff;text-decoration:none;cursor:pointer}
#back{left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));opacity:.8}
#again{left:50%;bottom:max(22px,env(safe-area-inset-bottom));translate:-50% 0;width:64px;height:64px;display:none}
#go{left:50%;top:58%;translate:-50% -50%;width:84px;height:84px;transition:transform .25s ease,opacity .35s ease;animation:breathe 2.4s ease-in-out infinite}
#go.gone{opacity:0;transform:scale(.6);pointer-events:none}
@keyframes breathe{50%{box-shadow:0 10px 40px rgba(255,190,90,.55),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -6px 14px rgba(80,40,120,.18)}}
#hud{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));height:34px;padding:0 12px;display:none;align-items:center;gap:10px;
 color:#fff;font:700 15px/1 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(40,20,60,.6)}
#hud span{display:flex;align-items:center;gap:4px}
#hud i{display:inline-block;width:14px;height:14px;border-radius:50%}
.ib{background:radial-gradient(circle at 35% 30%,#f4ff9a,#cfe63a 60%,#8ea01a)}
.ic{background:radial-gradient(circle at 35% 30%,#fff3b0,#ffcc33 55%,#b8860b)}
.is{background:none!important;width:14px;height:14px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background-color:#ffe08a!important}
.pop{position:fixed;pointer-events:none;color:#fff7c2;font:800 18px/1 ui-rounded,system-ui,sans-serif;text-shadow:0 2px 6px rgba(60,30,0,.7);translate:-50% -50%;transition:transform 1s ease-out,opacity 1s ease-in}
</style>

<body>
<a id="back" class="glass" href="./" aria-label="Back to the study"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<div id="hud" class="glass" aria-label="Score"><span><i class="ib"></i><b id="nb">0</b></span><span><i class="is"></i><b id="ns">0</b></span></div>

<div id="again" class="glass" role="button" aria-label="Play again"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></div>
<script type="module">
import * as T from 'three';
import {H, GYM, CANOPY, RECT, BLOCKERS, ROAD_X, LANES, FASCIA, schoolMaterials, buildSchool, plantTrees, scatter, duskSky, duskEnvironment, streetFurniture, makeWagon} from './school-world.mjs';
import {makeBlackLab} from '/simulations/black-lab.mjs';
import {makeYoungDaddy} from '/simulations/young-daddy.mjs';
import {planGrab, holdNear as kitHoldNear, bestNext} from '/simulations/climb-kit.mjs';
import {TOON_LOOKS, toonify, inkHulls} from '/simulations/toon-kit.mjs';

// Shared pieces from the basement and the presentation layer; the page still runs on its own if they are missing.
const opt = async (path) => { try { return await import(path); } catch { return {}; } };
const [PL] = await Promise.all([opt('/simulations/presentation-layer.mjs')]);
const presentation = PL.presentation || ((o) => o);
const playerCamera = PL.playerCamera || ((c) => c);
const Q = new URLSearchParams(location.search), TEST = Q.has('test'), PIXEL = Q.has('pixel');
// the look, from the Shaders article's toon set: Sunday Toon by default; ?look=ink adds ink lines, ?look=plain is plain three
const LOOK = TOON_LOOKS[Q.get('look')] !== undefined ? Q.get('look') : PIXEL ? 'plain' : 'sunday';
if (PIXEL) document.body.classList.add('pixel');

const renderer = new T.WebGLRenderer({antialias: !PIXEL, powerPreference: 'high-performance'});
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);
const scene = new T.Scene();
const camera = playerCamera(new T.PerspectiveCamera(40, 1, .05, 400));
const v3 = (x = 0, y = 0, z = 0) => new T.Vector3(x, y, z);

// ---------- Light: one late-October dusk drives sky, sun, windows, streetlights and the fog. ----------
const sky = duskSky(T, scene);
scene.environment = duskEnvironment(T, renderer); scene.environmentIntensity = .42;
scene.fog = new T.Fog('#e8a27c', 38, 175);
const hemi = new T.HemisphereLight('#ffd2b0', '#4a3550', .5); scene.add(hemi);
// a low golden sun from the street side, raking across the climbing wall (Evan's key art); its shadow follows you
const SUN_OFF = v3(-31, 6.5, 25).normalize().multiplyScalar(40);
const sun = new T.DirectionalLight('#ffa060', 3.2); sun.castShadow = true;
Object.assign(sun.shadow.camera, {left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 100}); sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0005; sun.shadow.normalBias = .02;
scene.add(sun, sun.target);

// ---------- The world: the school, the street, trees, grass, leaves. ----------
const {M, occluders, flag} = buildSchool(T, scene);
const flagBase = flag.geometry.attributes.position.array.slice();
const {lamps: streetLamps} = streetFurniture(T, scene, M);
const TREES = [[-13.5, -8, 1.1], [-12.5, 11, 1.3], [-4, 12, 1], [26, -9, 1.2, true], [14, 13, 1.1], [-14.5, 15, .9, true], [9, 12.5, 1], [26, 6, 1.4], [-25, -14, 1.2], [-25.5, 12, 1.1, true], [2, 14, 1.2], [-8, 15, 1], [20, 13, 1.1, true], [-23, -33, 1.2], [-24, 30, 1.3], [-12, -14, 1], [-11.5, 6.8, 1.15]]; // the last one throws its leaf shadow across the climb, as in the key art
plantTrees(T, scene, M, TREES);
Object.assign(M, {
 ball: new T.MeshStandardMaterial({color: '#d7f04a', roughness: .9, emissive: '#7a8a10', emissiveIntensity: .25, name: 'tennis ball felt'}),
 chalk: new T.MeshBasicMaterial({color: '#f4efe6', transparent: true, opacity: .85, name: 'chalk target'}),
 coverall: new T.MeshStandardMaterial({color: '#5b6b78', roughness: .9, name: 'janitor coveralls'}),
 skin: new T.MeshStandardMaterial({color: '#e2b08c', roughness: .7, name: 'skin'}),
 grate: new T.MeshStandardMaterial({color: '#6b7680', roughness: .5, metalness: .7, name: 'mesh grate'}),
});
const inAnyRect = (x, z, m) => Object.values(RECT).some(([x0, x1, z0, z1]) => x > x0 - m && x < x1 + m && z > z0 - m && z < z1 + m);
const onPaving = (x, z) => (x > -22.9 && x < -15.3) || (x > -18 && x < 22 && z > -27 && z < -7) || (x > 8 && x < 24 && z > -21 && z < 13) || (x > -15.8 && x < -9.4 && z > 1.2 && z < 9.2) || (x > -13.5 && x < -7 && z > -.5 && z < 2.5) || (x > 24 && x < 60 && z > -34 && z < 10);
const grassAt = r => { const near = r() < .55; let x, z;
 if (near) { const k = ['A', 'B', 'C', 'D'][(r() * 4) | 0], [x0, x1, z0, z1] = RECT[k], s = (r() * 4) | 0, t = r(); [x, z] = [[x0 + (x1 - x0) * t, z0 - .35 - r() * .5], [x0 + (x1 - x0) * t, z1 + .35 + r() * .5], [x0 - .35 - r() * .5, z0 + (z1 - z0) * t], [x1 + .35 + r() * .5, z0 + (z1 - z0) * t]][s]; }
 else { x = -30 + r() * 70; z = -40 + r() * 70; }
 return inAnyRect(x, z, .3) || onPaving(x, z) ? null : [x, 0, z]; };
scatter(T, scene, {count: 3200, area: grassAt, geo: new T.ConeGeometry(.045, .38, 3).translate(0, .19, 0), mat: new T.MeshStandardMaterial({roughness: 1, name: 'grass tuft'}), scale: [.6, 1.4], colors: ['#7f8a3c', '#9a9440', '#6b7a34', '#b2a04a', '#8a7a38'], seed: 51});
const leafGeo = new T.PlaneGeometry(.13, .09).rotateX(-Math.PI / 2).translate(0, .02, 0);
scatter(T, scene, {count: 900, area: r => { const t = TREES[(r() * TREES.length) | 0], a = r() * 6.3, d = r() * 3.4; const x = t[0] + Math.cos(a) * d, z = t[1] + Math.sin(a) * d; return inAnyRect(x, z, 0) ? null : [x, onPaving(x, z) ? .11 : .01, z]; }, geo: leafGeo, mat: new T.MeshStandardMaterial({roughness: 1, side: T.DoubleSide, name: 'fallen maple leaf'}), scale: [.8, 1.3], colors: ['#d5622f', '#b8352b', '#e09a35', '#9a3a22'], seed: 53, tilt: .4});
scatter(T, scene, {count: 70, area: r => { const x = -6.5 + r() * 11, z = -3 + r() * 6; return [x, H + .07, z]; }, geo: leafGeo, mat: new T.MeshStandardMaterial({roughness: 1, side: T.DoubleSide, name: 'fallen maple leaf'}), scale: [.8, 1.2], colors: ['#d5622f', '#b8352b', '#e09a35'], seed: 59, tilt: .3});

// ---------- The climbing walls. A wall is an origin on the ground, a right vector and the normal toward the climber. ----------
class Wall {
 constructor(origin, right, normal) { this.o = origin; this.r = right; this.n = normal; }
 at(u, y, out = 0) { return this.o.clone().addScaledVector(this.r, u).add(v3(0, y, 0)).addScaledVector(this.n, out); }
 put(mesh, u, y, out = 0) { mesh.position.copy(this.at(u, y, out)); mesh.lookAt(mesh.position.clone().add(this.n)); scene.add(mesh); mesh.castShadow = true; mesh.receiveShadow = true; return mesh; }
}
const NW = new Wall(v3(-7, 0, 1.0), v3(0, 0, 1), v3(-1, 0, 0));
const GW = new Wall(v3(2.5, H, 3.5), v3(-1, 0, 0), v3(0, 0, -1));
const SW = new Wall(v3(5, CANOPY, 1.2), v3(0, 0, -1), v3(1, 0, 0));
const part = (geo, mat, name) => Object.assign(new T.Mesh(geo, mat), {name});
const upright = m => { m.rotation.set(0, 0, 0); return m; };
const along = (m, wall) => { m.quaternion.setFromUnitVectors(v3(0, 1, 0), wall.r); return m; };
// north-west face: the door (in the world model), the grate, the lamp, the drainpipe, two conduit runs, the phone box, the hydro cage
NW.put(part(new T.BoxGeometry(.6, .44, .05), M.grate, 'mesh grate'), 0, 2.62, .07);
NW.put(part(new T.BoxGeometry(.66, .05, .07), M.steel, 'grate frame'), 0, 2.86, .08); NW.put(part(new T.BoxGeometry(.66, .05, .07), M.steel, 'grate frame'), 0, 2.38, .08);
NW.put(part(new T.BoxGeometry(.2, .26, .12), M.steel, 'wall lamp'), -1.0, 2.45, .1); const wallLampLens = NW.put(part(new T.BoxGeometry(.16, .14, .02), M.wallLamp, 'wall lamp lens'), -1.0, 2.4, .17);
const wallLampLight = new T.PointLight('#ffcf80', 0, 5, 1.8); wallLampLight.position.copy(NW.at(-1, 2.3, .4)); scene.add(wallLampLight);
upright(NW.put(part(new T.CylinderGeometry(.065, .065, H - .2, 12), M.pipe, 'drainpipe'), .95, (H - .2) / 2, .15));
upright(NW.put(part(new T.CylinderGeometry(.09, .065, .3, 12), M.pipe, 'drainpipe shoe'), .95, .15, .2));
along(NW.put(part(new T.CylinderGeometry(.035, .035, 2.6, 8), M.conduit, 'electrical conduit'), .55, 3.2, .1), NW);
along(NW.put(part(new T.CylinderGeometry(.035, .035, 1.8, 8), M.conduit, 'electrical conduit'), .45, 5.6, .1), NW);
upright(NW.put(part(new T.CylinderGeometry(.03, .03, 1.2, 8), M.conduit, 'telephone line'), .4, 5.0, .08));
upright(NW.put(part(new T.CylinderGeometry(.03, .03, 2.2, 8), M.conduit, 'telephone line'), .4, 3.3, .08));
NW.put(part(new T.BoxGeometry(.36, .46, .14), M.phone, 'telephone junction box'), .4, 4.4, .1);
{ // beside the door: the hydro station in its wire-mesh cage behind aluminium poles, under an angled sheet-metal hood. Scenery only.
 const cage = new T.MeshStandardMaterial({color: '#9aa3ab', roughness: .5, metalness: .7, transparent: true, opacity: .45, name: 'wire mesh cage', depthWrite: false});
 NW.put(part(new T.BoxGeometry(.75, 1.5, .7), cage, 'hydro station cage'), -1.75, .75, .38);
 NW.put(part(new T.BoxGeometry(.5, 1.1, .4), new T.MeshStandardMaterial({color: '#5d6a52', roughness: .7, name: 'hydro transformer box'}), 'hydro transformer'), -1.75, .55, .3);
 NW.put(part(new T.BoxGeometry(.9, .06, .85), M.alu, 'angled sheet-metal hood'), -1.75, 1.62, .42).rotateX(-.35);
 for (const du of [-.5, 0, .5]) upright(NW.put(part(new T.CylinderGeometry(.04, .04, 1.0, 8), M.alu, 'aluminium pole'), -1.75 + du, .5, 1.0));
}
GW.put(part(new T.BoxGeometry(.7, .5, .08), M.louvre, 'louvre vent'), -.3, .9, .04);
GW.put(part(new T.BoxGeometry(.7, .5, .08), M.louvre, 'louvre vent'), -.25, 1.85, .04);
upright(GW.put(part(new T.CylinderGeometry(.05, .05, 2.4, 10), M.pipe, 'drainpipe'), .38, 1.2, .12));
SW.put(part(new T.BoxGeometry(.6, .25, .3), M.steel, 'vent hood'), -.2, .55, .1);
upright(SW.put(part(new T.CylinderGeometry(.05, .05, 2.4, 10), M.pipe, 'drainpipe'), .25, 1.2, .12));

// The holds are the real things on the wall: hinges, the knob, the frame, the grate's edge, the pipe brackets round
// the drainpipe, the conduit straps, the phone box and the roof's lip. Big invisible targets; the shine is presentation.
const HOLD_GEO = {
 hinge: new T.CylinderGeometry(.035, .035, .16, 8), knob: new T.SphereGeometry(.06, 12, 8), bar: new T.BoxGeometry(.5, .05, .07),
 clamp: new T.TorusGeometry(.085, .022, 6, 14), strap: new T.BoxGeometry(.06, .12, .1), lip: new T.BoxGeometry(.5, .08, .12), lamp: new T.BoxGeometry(.2, .04, .25), box: new T.BoxGeometry(.12, .12, .06),
};
const glowTex = (() => { const c = Object.assign(document.createElement('canvas'), {width: 64, height: 64}), g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 2, 32, 32, 30); r.addColorStop(0, 'rgba(255,240,190,1)'); r.addColorStop(.45, 'rgba(255,220,150,.55)'); r.addColorStop(1, 'rgba(255,200,120,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new T.CanvasTexture(c); })();
const ringTex = (() => { const c = Object.assign(document.createElement('canvas'), {width: 64, height: 64}), g = c.getContext('2d'); g.strokeStyle = 'rgba(255,236,170,1)'; g.lineWidth = 5; g.beginPath(); g.arc(32, 32, 25, 0, 7); g.stroke(); return new T.CanvasTexture(c); })();
function holds(wall, list) {
 return list.map(([id, u, y, kind, extra = {}]) => {
  const onPipe = kind === 'clamp' && /pipe/.test(id), geo = HOLD_GEO[kind === 'top' ? 'lip' : kind === 'clamp' && !onPipe ? 'strap' : kind];
  const mat = kind === 'knob' ? M.brass : kind === 'top' ? M.fascia : M.steel;
  const mesh = part(geo, mat, id); wall.put(mesh, u, y, onPipe ? .15 : kind === 'top' ? FASCIA : .12);
  if (kind === 'hinge') upright(mesh); if (onPipe) mesh.rotation.set(Math.PI / 2, 0, 0);
  // the worn, shiny spot where small hands have been: a soft glow drawn for the player only
  const glow = presentation(new T.Sprite(new T.SpriteMaterial({map: glowTex, transparent: true, depthWrite: false, depthTest: false, blending: T.AdditiveBlending, opacity: 0})), {purpose: 'reachable hold'});
  glow.scale.setScalar(.55); glow.position.copy(wall.at(u, y, .3)); glow.renderOrder = 5; scene.add(glow);
  const h = {id, u, y, kind, wall, mesh, glow, at: wall.at(u, y, .2), ...extra}; return h;
 });
}
// The north-west climb, cartoonishly tall. Hands go left and right of each other, never across.
const CLIMB1 = {wall: NW, top: H, holds: holds(NW, [
 ['low hinge', -.5, .35, 'hinge'], ['middle hinge', -.5, 1.05, 'hinge'], ['top hinge', -.5, 1.75, 'hinge'], ['door knob', .38, 1.0, 'knob'],
 ['door frame top', 0, 2.25, 'bar'], ['grate corner', -.3, 2.62, 'clamp'], ['grate top', .15, 2.86, 'bar'],
 ['pipe bracket', .95, 2.6, 'clamp'], ['conduit clamp', .45, 3.2, 'clamp'], ['far conduit clamp', 1.45, 3.2, 'clamp'], ['second pipe bracket', .95, 3.8, 'clamp'],
 ['telephone box', .4, 4.4, 'box'], ['third pipe bracket', .95, 5.0, 'clamp'], ['high conduit clamp', .45, 5.6, 'clamp'], ['top pipe bracket', .95, 6.2, 'clamp'],
 ['roof edge', .5, H + .02, 'top'], ['roof edge east', 1.3, H + .02, 'top'],
 ['wall lamp', -1.0, 2.6, 'lamp', {loose: true}], ['loose bracket', 1.6, 4.6, 'lamp', {loose: true}],
])};
const CLIMB2 = {wall: GW, top: GYM - H, holds: holds(GW, [
 ['low louvre', -.3, .9, 'bar'], ['pipe clamp', .38, 1.4, 'clamp'], ['high louvre', -.25, 1.85, 'bar'], ['gym edge', .1, 2.55, 'top'], ['loose gym bracket', .9, 1.9, 'lamp', {loose: true}],
])};
const CLIMB3 = {wall: SW, top: H - CANOPY, holds: holds(SW, [['vent hood', -.2, .55, 'bar'], ['canopy pipe clamp', .25, 1.6, 'clamp'], ['main roof edge', 0, 2.45, 'top']])};
const allHolds = [...CLIMB1.holds, ...CLIMB2.holds, ...CLIMB3.holds];
// the next-hold ring: one soft circle on the best hold upward, for the first climb (a nudge, never a word)
const nextRing = presentation(new T.Sprite(new T.SpriteMaterial({map: ringTex, transparent: true, depthWrite: false, depthTest: false, opacity: 0})), {purpose: 'next hold'});
nextRing.renderOrder = 6; scene.add(nextRing);

// ---------- You (young Daddy), bub, the leash, tennis balls. ----------
const KID_S = 1.18;
const kidRig = makeYoungDaddy(T); const kid = kidRig.group; kid.scale.setScalar(KID_S); scene.add(kid);
const carryBalls = [0, 1, 2].map(i => { const b = new T.Mesh(new T.SphereGeometry(.07, 10, 8), M.ball); b.name = 'carried ball'; b.position.set((i - 1) * .1, .86 + (i === 1 ? .08 : 0), .24); b.visible = false; kid.add(b); return b; });
const bub = makeBlackLab(T); const dog = bub.group; dog.scale.setScalar(1.12); scene.add(dog);
const leashGeo = new T.BufferGeometry().setFromPoints([v3(), v3(), v3()]);
const leash = new T.Line(leashGeo, new T.LineBasicMaterial({color: '#c0392b', name: 'leash'})); leash.frustumCulled = false; scene.add(leash);
const PILE = v3(-11.6, 0, 4.2);

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const REGIONS = {low: ['A', 'B'], gym: ['C'], canopy: ['E'], yard: ['Y']};
RECT.Y = [-16, -7.2, -9, 9, 0];
const YARD_BLOCK = [[-10.2, -7, -5.2, -.9], [-8.4, -7, -1.4, -.1]]; // the annex and the hydro cage
const inRect = (k, x, z, m = .35) => { const [x0, x1, z0, z1] = RECT[k]; return x > x0 + m && x < x1 - m && z > z0 + m && z < z1 - m; };
const inBlock = (lvl, x, z, m = .32) => (lvl === 'yard' ? YARD_BLOCK : BLOCKERS).some(([x0, x1, z0, z1]) => x > x0 - m && x < x1 + m && z > z0 - m && z < z1 + m);
const walkable = (lvl, x, z) => REGIONS[lvl].some(k => inRect(k, x, z)) && !inBlock(lvl, x, z);
const levelY = lvl => ({low: H, gym: GYM, canopy: CANOPY, yard: 0})[lvl];
const balls = [];
