/* AW-STUDY-0026: the school jump, round 2. Walk the dog, three throws, the third lands on the roof. A first-person
   latch-and-let-go climb in the basement's 8-bit look rises, without a cut, into an iso roof you sneak across while
   cars sweep past. No words on screen: the score chip is icons and numbers, the hang-drop glass shows only while you hang. */
html,body{margin:0;height:100%;background:#1b1426;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}
.glass{position:fixed;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.45);
 box-shadow:0 10px 30px rgba(20,10,40,.35),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -6px 14px rgba(80,40,120,.18)}
#hang{left:50%;bottom:max(18px,env(safe-area-inset-bottom));translate:-50% 0;width:min(56vw,240px);height:34px;display:none}

#zone{position:absolute;top:6px;bottom:6px;border-radius:999px;background:linear-gradient(90deg,#ffd76a,#ffb347);box-shadow:0 0 14px #ffcf5a}
#dot{background:radial-gradient(circle at 35% 30%,#fff,#e9f2ff 40%,#8fb4ff);box-shadow:0 2px 8px rgba(0,0,40,.4)}
#back,#again{width:44px;height:44px;display:grid;place-items:center;color:#fff;text-decoration:none;cursor:pointer}
#back{left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));opacity:.8}
#again{left:50%;bottom:max(22px,env(safe-area-inset-bottom));translate:-50% 0;width:64px;height:64px;display:none}
#hud{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));height:34px;padding:0 12px;display:none;align-items:center;gap:10px;
 color:#fff;font:700 15px/1 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(40,20,60,.6)}
#hud span{display:flex;align-items:center;gap:4px}
#hud i{display:inline-block;width:14px;height:14px;border-radius:50%}
.ib{background:radial-gradient(circle at 35% 30%,#f4ff9a,#cfe63a 60%,#8ea01a)}
.ic{background:radial-gradient(circle at 35% 30%,#fff3b0,#ffcc33 55%,#b8860b)}
.is{background:none!important;width:14px;height:14px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background-color:#ffe08a!important}
.pop{position:fixed;pointer-events:none;color:#fff7c2;font:800 18px/1 ui-rounded,system-ui,sans-serif;text-shadow:0 2px 6px rgba(60,30,0,.7);translate:-50% -50%;transition:transform 1s ease-out,opacity 1s ease-in}

<script type="module">
import * as T from 'three';

// Shared pieces from the basement and the presentation layer; the page still runs on its own if they are missing.
const opt = async (path) => { try { return await import(path); } catch { return {}; } };
const [PL, GB, MC, CR] = await Promise.all([opt('/simulations/presentation-layer.mjs'), opt('/simulations/grace-basement.mjs'), opt('/simulations/memory-coins.mjs'), opt('/simulations/coin-reward.mjs')]);
const presentation = PL.presentation || ((o) => o);
const playerCamera = PL.playerCamera || ((c) => c);

const renderer = new T.WebGLRenderer({antialias: false, powerPreference: 'high-performance'});
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);
const scene = new T.Scene();
const NIGHTSKY = new T.Color('#3b2f5c');
scene.background = new T.Color('#b98a9e'); scene.fog = new T.Fog('#d98a5e', 40, 120);
const camera = playerCamera(new T.PerspectiveCamera(66, 1, .05, 220));

// ---------- Light: one late-October dusk drives sky, sun, windows and streetlights. ----------
const hemi = new T.HemisphereLight('#ffd2b0', '#4a3040', .75); scene.add(hemi);
// a low golden sun from the street side, raking across the climbing wall (Evan's picture, 09:36Z)
const sun = new T.DirectionalLight('#ffa060', 3.0); sun.position.set(-34, 12, 26); sun.castShadow = true;
Object.assign(sun.shadow.camera, {left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 100}); sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0006;
scene.add(sun, sun.target);

// ---------- Materials, named by what they are. ----------
function brickTex() {
 const c = Object.assign(document.createElement('canvas'), {width: 128, height: 128}), g = c.getContext('2d');
 g.fillStyle = '#8a4a34'; g.fillRect(0, 0, 128, 128);
 for (let r = 0; r < 16; r++) for (let k = -1; k < 5; k++) { const x = k * 32 + (r % 2) * 16, y = r * 8; g.fillStyle = ['#c0643f', '#c96e46', '#b25a3a', '#c4683f'][(r * 7 + k * 3) & 3]; g.fillRect(x + 1, y + 1, 30, 6); }
 const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.colorSpace = T.SRGBColorSpace; t.magFilter = T.LinearFilter; return t;
}
function meshTex() {
 const c = Object.assign(document.createElement('canvas'), {width: 32, height: 32}), g = c.getContext('2d');
 g.fillStyle = '#4b5560'; g.fillRect(0, 0, 32, 32); g.strokeStyle = '#a9b4bd'; g.lineWidth = 1.4;
 for (let i = -32; i < 64; i += 6) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 32, 32); g.stroke(); g.beginPath(); g.moveTo(i + 32, 0); g.lineTo(i, 32); g.stroke(); }
 const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.magFilter = T.NearestFilter; return t;
}
const BRICK = brickTex();
const M = {
 brick: (rx, ry) => { const t = BRICK.clone(); t.needsUpdate = true; t.repeat.set(rx, ry); return new T.MeshStandardMaterial({map: t, roughness: .9, name: 'brick wall'}); },
 coping: new T.MeshStandardMaterial({color: '#d8d0c4', roughness: .8, name: 'concrete coping'}),
 roof: new T.MeshStandardMaterial({color: '#8d8794', roughness: 1, name: 'tar and gravel roof'}),
 gymRoof: new T.MeshStandardMaterial({color: '#7c7686', roughness: 1, name: 'gym roof membrane'}),
 door: new T.MeshStandardMaterial({color: '#2f7f86', roughness: .55, metalness: .2, name: 'painted steel door'}),
 frame: new T.MeshStandardMaterial({color: '#245c62', roughness: .5, metalness: .3, name: 'door frame'}),
 brass: new T.MeshStandardMaterial({color: '#d8b04a', roughness: .3, metalness: .9, name: 'brass knob'}),
 steel: new T.MeshStandardMaterial({color: '#9aa3ab', roughness: .4, metalness: .8, name: 'galvanised steel'}),
 pipe: new T.MeshStandardMaterial({color: '#c9c3b5', roughness: .5, metalness: .3, name: 'drainpipe'}),
 conduit: new T.MeshStandardMaterial({color: '#7d8a92', roughness: .4, metalness: .7, name: 'electrical conduit'}),
 phone: new T.MeshStandardMaterial({color: '#59646b', roughness: .5, metalness: .5, name: 'telephone junction box'}),
 grate: new T.MeshStandardMaterial({map: meshTex(), roughness: .6, metalness: .6, name: 'mesh grate'}),
 hvac: new T.MeshStandardMaterial({color: '#b9bec4', roughness: .5, metalness: .5, name: 'rooftop air handler'}),
 hvacDark: new T.MeshStandardMaterial({color: '#4a4f5a', roughness: .7, name: 'air handler vents'}),
 wall: new T.MeshStandardMaterial({color: '#a2735c', roughness: .9, name: 'parapet wall'}),
 grass: new T.MeshStandardMaterial({color: '#6f8a4a', roughness: 1, name: 'school field grass'}),
 asphalt: new T.MeshStandardMaterial({color: '#5d5966', roughness: 1, name: 'schoolyard asphalt'}),
 sidewalk: new T.MeshStandardMaterial({color: '#a99fa4', roughness: 1, name: 'concrete sidewalk'}),
 road: new T.MeshStandardMaterial({color: '#3e3a47', roughness: 1, name: 'street asphalt'}),
 paint: new T.MeshStandardMaterial({color: '#f1e6b0', roughness: 1, name: 'road paint'}),
 window: new T.MeshStandardMaterial({color: '#2b3550', emissive: '#ffcf8a', emissiveIntensity: .15, roughness: .2, name: 'classroom window'}),
 leaf: new T.MeshStandardMaterial({color: '#c46a3a', roughness: 1, flatShading: true, name: 'autumn maple leaves'}),
 leaf2: new T.MeshStandardMaterial({color: '#7a8a3a', roughness: 1, flatShading: true, name: 'spruce needles'}),
 bark: new T.MeshStandardMaterial({color: '#4a3528', roughness: 1, name: 'tree bark'}),
 ball: new T.MeshStandardMaterial({color: '#d7f04a', roughness: .9, emissive: '#7a8a10', emissiveIntensity: .25, name: 'tennis ball felt'}),
 skin: new T.MeshStandardMaterial({color: '#f0c29b', roughness: .8, name: 'skin'}),
 jacket: new T.MeshStandardMaterial({color: '#f2ede4', roughness: .8, name: 'white t-shirt'}),
 shorts: new T.MeshStandardMaterial({color: '#c8322e', roughness: .8, name: 'red shorts'}),
 cap: new T.MeshStandardMaterial({color: '#d83a3a', roughness: .8, name: 'ball cap'}),
 jeans: new T.MeshStandardMaterial({color: '#2e3550', roughness: .9, name: 'jeans'}),
 fur: new T.MeshStandardMaterial({color: '#d8a055', roughness: 1, flatShading: true, name: 'shaggy dog fur'}),
 furDark: new T.MeshStandardMaterial({color: '#6e4524', roughness: 1, name: 'dog ears'}),
 collar: new T.MeshStandardMaterial({color: '#d83a3a', roughness: .6, name: 'dog collar'}),
 house: ['#c9b79c', '#9fb2c4', '#d9c6a0', '#b7a3b8'].map((c, i) => new T.MeshStandardMaterial({color: c, roughness: .9, name: `house siding ${i}`})),
 shingle: new T.MeshStandardMaterial({color: '#4e3f45', roughness: 1, flatShading: true, name: 'roof shingles'}),
 lampPost: new T.MeshStandardMaterial({color: '#3a3644', roughness: .6, metalness: .5, name: 'street lamp post'}),
 lampGlow: new T.MeshStandardMaterial({color: '#fff3c8', emissive: '#ffd27a', emissiveIntensity: 0, name: 'street lamp'}),
};
const box = (w, h, d, mat, x, y, z, name) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; if (name) m.name = name; scene.add(m); return m; };
const cyl = (r, h, mat, x, y, z, name, seg = 10) => { const m = new T.Mesh(new T.CylinderGeometry(r, r, h, seg), mat); m.position.set(x, y, z); m.castShadow = true; if (name) m.name = name; scene.add(m); return m; };
const v3 = (x = 0, y = 0, z = 0) => new T.Vector3(x, y, z);

// ---------- The school: a stylized, cartoon-tall version of the one-storey brick school from Evan's aerial photo. ----------
// Main block A, north wing B, the taller gym C, a lower annex D and the entrance canopy E. The street runs along the
// west side, in front of the climbing wall, so in the iso view cars cross diagonally from top right to bottom left.
const H = 7, GYM = 9.5, CANOPY = 4.6;
const RECT = {A: [-7, 5, -3.5, 3.5, H], B: [1, 7, -7, -3.5, H], C: [0, 8, 3.5, 9, GYM], D: [-10, -7, -5, -1, 5], E: [5, 7.6, -1, 3.5, CANOPY]};
const occluders = [];
for (const [k, [x0, x1, z0, z1, h]] of Object.entries(RECT)) {
 const w = x1 - x0, d = z1 - z0, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
 if (k === 'E') { // the canopy: a flat slab on posts
  const s = box(w, .25, d, M.coping, cx, h - .12, cz, 'entrance canopy'); occluders.push(s);
  for (const [px, pz] of [[x1 - .2, z0 + .2], [x1 - .2, z1 - .2]]) cyl(.09, h - .25, M.steel, px, (h - .25) / 2, pz, 'canopy post');
  continue;
 }
 const body = box(w, h, d, M.brick(w / 2.2, h / 1.1), cx, h / 2, cz, `school ${k === 'C' ? 'gym' : 'wing'} wall`); occluders.push(body);
 const top = box(w, .06, d, k === 'C' ? M.gymRoof : M.roof, cx, h + .03, cz, 'roof'); top.castShadow = false;
 for (const [px, pz, pw, pd] of [[cx, z0 + .1, w, .2], [cx, z1 - .1, w, .2], [x0 + .1, cz, .2, d], [x1 - .1, cz, .2, d]]) occluders.push(box(pw, .35, pd, M.coping, px, h + .17, pz, 'parapet coping'));
 if (k !== 'C') for (let x = x0 + 1.2; x < x1 - .8; x += 1.6) for (const z of [z0 - .02, z1 + .02]) { const win = box(1.1, 1.4, .05, M.window, x, 2.2, z); win.castShadow = false; }
}
// Walls and such on the roof to hide behind (from the aerial: stairwell, air handlers, the dark gym units, dividers).
// Two barriers only (Evan, 09:36Z: "make it really obvious"): a tall brick wall and the big air handler. Their
// headlight shadows are the only safe places on the main roof.
const BLOCKERS = [
 [-4.4, -3.8, -3, 1.6, 1.6, 'brick barrier wall'], [-.6, 1.6, -1.8, 1.4, 1.5, 'big air handler'],
 [1.4, 3.4, 5.2, 7, 1, 'gym unit'], [5, 7, 5.6, 8, 1, 'gym unit'],
];
for (const [x0, x1, z0, z1, h, name] of BLOCKERS) {
 const base = x0 > -.1 && z0 >= 3.5 ? GYM : H;
 const b = box(x1 - x0, h, z1 - z0, name.includes('wall') ? M.wall : M.hvac, (x0 + x1) / 2, base + h / 2, (z0 + z1) / 2, name); occluders.push(b);
 if (!name.includes('wall')) { const v = box((x1 - x0) * .7, .05, (z1 - z0) * .5, M.hvacDark, (x0 + x1) / 2, base + h + .03, (z0 + z1) / 2); v.castShadow = false; }
}
for (const [x, z] of [[-5.5, -1.2], [-1.8, 2.2], [0, -2.5], [3.5, 1.5], [4, -6]]) { const d = new T.Mesh(new T.SphereGeometry(.28, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), M.window); d.position.set(x, H + .05, z); d.name = 'skylight dome'; scene.add(d); }

// Ground: the yard in front of the climbing wall, sidewalk and street along the west, houses across it, field east.
const ROAD_X = -19, LANES = [-18.1, -19.9];
const ground = (w, d, mat, x, z, y = 0) => { const m = new T.Mesh(new T.PlaneGeometry(w, d), mat); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m; };
ground(160, 160, M.grass, 0, 0, -.02); ground(16, 9, M.asphalt, 4, -12, .005); ground(2.2, 160, M.sidewalk, -16.4, 0, .008); ground(5.6, 160, M.road, ROAD_X, 0, .01);
for (let z = -70; z < 70; z += 4) ground(.14, 1.8, M.paint, ROAD_X, z, .02);
ground(6.5, 3, M.asphalt, -10.2, 1.0, .006); // the path to the north-west door
function tree(x, z, s = 1, conifer = false) {
 cyl(.14 * s, 1.6 * s, M.bark, x, .8 * s, z, 'tree trunk');
 const g = conifer ? new T.ConeGeometry(1.1 * s, 3 * s, 7) : new T.IcosahedronGeometry(1.4 * s, 0);
 const c = new T.Mesh(g, conifer ? M.leaf2 : M.leaf); c.position.set(x, (conifer ? 2.8 : 2.6) * s, z); c.castShadow = true; c.name = conifer ? 'spruce' : 'maple'; scene.add(c);
}
[[-13.5, -8, 1.1], [-12.5, 9.5, 1.3], [-4, 12, 1], [11.5, -9, 1.2, true], [14, 11, 1.1], [-14.5, 14, .9, true], [9, 12.5, 1], [16, -2, 1.4], [-25, -14, 1.2], [-26, 9, 1.1, true]].forEach(a => tree(...a));
for (let i = 0; i < 8; i++) { // houses across the street
 const z = -32 + i * 9, m = M.house[i % 4];
 box(6, 3.2, 6, m, -29, 1.6, z, 'house');
 const r = new T.Mesh(new T.ConeGeometry(4.8, 2, 4), M.shingle); r.rotation.y = Math.PI / 4; r.position.set(-29, 4.2, z); r.scale.x = .75; r.castShadow = true; r.name = 'house roof'; scene.add(r);
 const w = box(.05, 1, 1.2, M.window, -25.97, 1.8, z - 1.2); w.castShadow = false;
}
const streetLamps = [-24, -6, 12].map(z => { cyl(.07, 4.4, M.lampPost, -15.6, 2.2, z, 'street lamp post'); const l = box(.5, .18, .3, M.lampGlow, -15.9, 4.4, z, 'street lamp'); const p = new T.PointLight('#ffcf8a', 0, 9, 1.6); p.position.set(-15.9, 4.1, z); scene.add(p); return p; });

// ---------- The climbing walls. A wall is an origin on the ground, a right vector and the normal toward the climber. ----------
class Wall {
 constructor(origin, right, normal) { this.o = origin; this.r = right; this.n = normal; }
 at(u, y, out = 0) { return this.o.clone().addScaledVector(this.r, u).add(v3(0, y, 0)).addScaledVector(this.n, out); }
 put(mesh, u, y, out = 0) { mesh.position.copy(this.at(u, y, out)); mesh.lookAt(mesh.position.clone().add(this.n)); scene.add(mesh); mesh.castShadow = true; return mesh; }
}
const NW = new Wall(v3(-7, 0, 1.0), v3(0, 0, 1), v3(-1, 0, 0));
const GW = new Wall(v3(2.5, H, 3.5), v3(-1, 0, 0), v3(0, 0, -1));
const SW = new Wall(v3(5, CANOPY, 1.2), v3(0, 0, -1), v3(1, 0, 0));
const part = (geo, mat, name) => Object.assign(new T.Mesh(geo, mat), {name});
const upright = m => { m.rotation.set(0, 0, 0); return m; };
const along = (m, wall) => { m.quaternion.setFromUnitVectors(v3(0, 1, 0), wall.r); return m; };
// north-west face: the door bay with pilasters, the hydro cage, drainpipe, two conduit runs, the telephone box
NW.put(part(new T.BoxGeometry(1.5, H, .12), M.brick(.7, 3), 'bay pilaster'), 2.25, H / 2, .06);
const fasciaMat = new T.MeshStandardMaterial({color: '#6f7d96', roughness: .7, name: 'painted fascia board'});
occluders.push(box(.7, .45, 7.4, fasciaMat, -7.25, H + .1, 0, 'roof fascia overhang'));
cyl(.12, 11, M.bark, -15.2, 5.5, 7.5, 'power pole'); box(2.2, .12, .12, M.bark, -15.2, 10.4, 7.5, 'power pole crossarm');
for (const dx of [-.9, .9]) { const wire = new T.Mesh(new T.CylinderGeometry(.012, .012, 90, 4), new T.MeshBasicMaterial({color: '#2a2230', name: 'power line'})); wire.rotation.x = Math.PI / 2; wire.position.set(-15.2 + dx, 10.5, 0); scene.add(wire); }
NW.put(part(new T.BoxGeometry(1.24, 2.3, .08), M.frame, 'door frame'), 0, 1.15, .04);
NW.put(part(new T.BoxGeometry(1.0, 2.1, .06), M.door, 'steel door'), 0, 1.05, .09);
NW.put(part(new T.BoxGeometry(.56, .42, .05), M.grate, 'mesh grate'), 0, 2.6, .07);
NW.put(part(new T.BoxGeometry(.18, .26, .05), M.steel, 'wall lamp'), -1.0, 2.45, .2);
upright(NW.put(part(new T.CylinderGeometry(.06, .06, H - .3, 10), M.pipe, 'drainpipe'), .95, (H - .3) / 2 + .15, .14));
along(NW.put(part(new T.CylinderGeometry(.035, .035, 2.4, 8), M.conduit, 'electrical conduit'), .55, 3.2, .1), NW);
along(NW.put(part(new T.CylinderGeometry(.035, .035, 1.8, 8), M.conduit, 'electrical conduit'), .45, 5.6, .1), NW);
upright(NW.put(part(new T.CylinderGeometry(.03, .03, 1.2, 8), M.conduit, 'telephone line'), .4, 5.0, .08));
NW.put(part(new T.BoxGeometry(.34, .44, .14), M.phone, 'telephone junction box'), .4, 4.4, .1);
{ // beside the door: the hydro station in its wire-mesh cage behind aluminium poles, under an angled sheet-metal hood. Scenery only.
 const alu = new T.MeshStandardMaterial({color: '#c4cad0', roughness: .35, metalness: .85, name: 'aluminium sheet metal'});
 const cage = new T.MeshStandardMaterial({map: meshTex(), transparent: true, opacity: .85, roughness: .6, metalness: .6, name: 'wire mesh cage'});
 NW.put(part(new T.BoxGeometry(.75, 1.5, .7), cage, 'hydro station cage'), -1.75, .75, .38);
 NW.put(part(new T.BoxGeometry(.5, 1.1, .4), new T.MeshStandardMaterial({color: '#5d6a52', roughness: .7, name: 'hydro transformer box'}), 'hydro transformer'), -1.75, .55, .3);
 NW.put(part(new T.BoxGeometry(.9, .12, .85), alu, 'angled sheet-metal hood'), -1.75, 1.62, .42).rotateX(-.35);
 for (const du of [-.5, 0, .5]) upright(NW.put(part(new T.CylinderGeometry(.04, .04, 1.0, 8), alu, 'aluminium pole'), -1.75 + du, .5, 1.0));
}
GW.put(part(new T.BoxGeometry(.7, .5, .08), M.grate, 'louvre vent'), -.3, .9, .04);
GW.put(part(new T.BoxGeometry(.7, .5, .08), M.grate, 'louvre vent'), -.25, 1.85, .04);
upright(GW.put(part(new T.CylinderGeometry(.05, .05, 2.4, 10), M.pipe, 'drainpipe'), .38, 1.2, .1));
SW.put(part(new T.BoxGeometry(.6, .25, .3), M.steel, 'vent hood'), -.2, .55, .1);
upright(SW.put(part(new T.CylinderGeometry(.05, .05, 2.4, 10), M.pipe, 'drainpipe'), .25, 1.2, .1));

const HOLD_GEO = {
 hinge: new T.CylinderGeometry(.035, .035, .14, 8), knob: new T.SphereGeometry(.055, 10, 8), bar: new T.BoxGeometry(.5, .05, .06),
