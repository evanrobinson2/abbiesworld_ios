<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paper Warrior Props</title>
<link rel="stylesheet" href="/app-style.css?v=1">
<script type="importmap">{"imports":{"three":"/simulations/vendor/three.module.js"}}</script>
<style>
/* One row per prop: the reference, the fitted render from the same camera, then the model itself to turn and zoom. */
html,body{margin:0;background:var(--app-canvas,#f4edcf)}
.wrap{max-width:1180px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
h1{margin:0 0 6px}
.lede{margin:0 0 22px;color:var(--app-muted);max-width:70ch}
.prop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr);gap:12px;background:var(--app-paper);border:1px solid var(--app-border);border-radius:18px;padding:14px;margin-bottom:16px}
.prop h2{grid-column:1/-1;margin:2px 4px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.prop h2 small{font-family:var(--app-font);font-size:13px;font-weight:500;color:var(--app-muted);letter-spacing:0}
figure{margin:0;min-width:0;display:grid;gap:6px;align-content:start}
figure img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;background:#fff}
figcaption{font-size:12px;color:var(--app-muted)}
.view{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#fdfbf3,#d9d3bd);touch-action:none;cursor:grab}
.view:active{cursor:grabbing}
.view canvas{display:block;width:100%;height:100%}
.view .hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:#5d5540;background:#fffcf0cc;border-radius:8px;padding:3px 8px;pointer-events:none}
.view button{position:absolute;right:8px;top:8px;min-height:32px;padding:4px 10px;font-size:12px;border:1px solid var(--app-border);background:#fffcf0;color:var(--app-ink);border-radius:999px;cursor:pointer}
.whole{grid-template-columns:minmax(0,1fr)}
.whole .view{aspect-ratio:16/10}
@media (max-width:760px){.prop{grid-template-columns:1fr 1fr}.prop .view{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
 <h1>Five props</h1>
 <p class="lede">Each prop was cut from the reference, fitted on its own, then snapped onto the body. Drag a model to turn it, scroll or pinch to zoom.</p>
 <div id="props"></div>
</div>
<script type="module">
import * as T from 'three';
import {OrbitControls} from '/simulations/vendor/OrbitControls.js';
import {GLTFLoader} from '/simulations/vendor/loaders/GLTFLoader.js';

const PROPS=[
 ['cuirass','Cuirass','Banded chest armour',['cuirass']],
 ['pauldrons','Pauldrons','Left and right shoulder plates',['pauldron_l','pauldron_r']],
 ['belt','Belt','Waist belt',['belt']],
 ['greaves','Greaves','Left and right shin guards',['greave_l','greave_r']],
 ['sandals','Sandals','Left and right sandals',['sandal_l','sandal_r']],
];
const loader=new GLTFLoader(),host=document.getElementById('props');

function viewer(el,files){
 const renderer=new T.WebGLRenderer({antialias:true,alpha:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;
 renderer.toneMapping=T.ACESFilmicToneMapping;el.prepend(renderer.domElement);
 const scene=new T.Scene(),camera=new T.PerspectiveCamera(32,1,.01,100);
 scene.add(new T.HemisphereLight(0xfffaf0,0x8a8270,1.6));
 const sun=new T.DirectionalLight(0xffffff,2.2);sun.position.set(2,3,2.5);scene.add(sun);
 const rim=new T.DirectionalLight(0xdfe8ff,.9);rim.position.set(-2,1.5,-2.5);scene.add(rim);
 const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.12;
 let home;
 const render=()=>renderer.render(scene,camera);
 const resize=()=>{const r=el.getBoundingClientRect();if(!r.width)return;renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();render();};
 new ResizeObserver(resize).observe(el);
 // Render only while something moves, so many viewers on one page stay cheap.
 let raf=0;const tick=()=>{raf=0;if(controls.update())raf=requestAnimationFrame(tick);render();};
 controls.addEventListener('change',()=>{if(!raf)raf=requestAnimationFrame(tick);});
 Promise.all(files.map(f=>loader.loadAsync(f+'.glb'))).then(gs=>{
  const group=new T.Group();gs.forEach(g=>group.add(g.scene));scene.add(group);
  const box=new T.Box3().setFromObject(group),size=box.getSize(new T.Vector3()),c=box.getCenter(new T.Vector3());
  const d=Math.max(size.x,size.y,size.z)/(2*Math.tan(T.MathUtils.degToRad(camera.fov/2)))*1.35;
  controls.target.copy(c);camera.position.copy(c).add(new T.Vector3(0,.15,1).normalize().multiplyScalar(d));
  camera.near=d/100;camera.far=d*20;camera.updateProjectionMatrix();controls.minDistance=d*.25;controls.maxDistance=d*4;
  home=camera.position.clone();controls.update();resize();
 }).catch(e=>{el.querySelector('.hint').textContent='Model failed to load';console.error(e);});
 el.querySelector('button').onclick=()=>{if(home){camera.position.copy(home);controls.update();render();}};
}

for(const [id,name,sub,files] of PROPS){
 const s=document.createElement('section');s.className='prop';s.id=id;
 s.innerHTML=`<h2>${name}<small>${sub}</small></h2>
  <figure><img src="${id}/target.jpg" alt="${name} cut from the reference" loading="lazy"><figcaption>Reference</figcaption></figure>
  <figure><img src="${id}/fit.png" alt="${name} fitted render" loading="lazy"><figcaption>Fitted, same camera</figcaption></figure>
  <figure><div class="view"><span class="hint">Drag to turn · scroll to zoom</span><button type="button">Reset</button></div><figcaption>Model</figcaption></figure>`;
 host.appendChild(s);viewer(s.querySelector('.view'),files);
}
const w=document.createElement('section');w.className='prop whole';w.id='composed';
w.innerHTML=`<h2>The composed warrior<small>All five props snapped onto the body</small></h2><figure><div class="view"><span class="hint">Drag to turn · scroll to zoom</span><button type="button">Reset</button></div></figure>`;
host.appendChild(w);viewer(w.querySelector('.view'),['composed']);
</script>
</body>
</html>
