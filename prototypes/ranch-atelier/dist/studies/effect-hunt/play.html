<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>The Effect Hunt</title>
<style>
html,body{margin:0;height:100%;background:#1c1530;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
#boot{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:600 20px ui-rounded,system-ui,sans-serif;background:#1c1530;transition:opacity .6s}
</style>
</head>
<body>
<div id="boot">🛒</div>
<script>
// Works from /studies/effect-hunt/play.html (modules two levels up) and from an instant preview (modules beside the page).
const SIM = location.pathname.includes('/studies/') ? '../../simulations/' : './simulations/';
const map = document.createElement('script'); map.type = 'importmap';
map.textContent = JSON.stringify({imports: {three: new URL(SIM + 'vendor/three.module.js', location.href).href}});
document.head.append(map);
window.__SIM = new URL(SIM, location.href).href;
</script>
<script type="module">
import * as T from 'three';
const S = window.__SIM, q = new URLSearchParams(location.search);
const [{createHunt}, {makeStandin}, {fromBoard}, {createPaintWorld}] = await Promise.all([import(S + 'effect-hunt/hunt.mjs'), import(S + 'effect-hunt/standin.mjs'), import(S + 'effect-hunt/world.mjs'), import(S + 'paint-world/paint-world.mjs')]);

const renderer = new T.WebGLRenderer({antialias: true}); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap; document.body.append(renderer.domElement);
const scene = new T.Scene(), camera = new T.PerspectiveCamera(58, innerWidth / innerHeight, .5, 3000);
const standin = makeStandin(); scene.add(standin.group);
const world = fromBoard(standin.board, {near: standin.near});

// dusk by default so the beacons glow; ?hour=12 for noon. Light and sky come from one number.
let hour = +(q.get('hour') ?? 18.6);
const hemi = new T.HemisphereLight('#bcd4ff', '#6a5a3a', 1), sun = new T.DirectionalLight('#ffd9a0', 2.2); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left: -90, right: 90, top: 90, bottom: -90, near: 1, far: 500}); scene.add(hemi, sun, sun.target);
const day = h => { const s = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); }; return s(5.5, 8, h) * (1 - s(17.5, 20.5, h)); };
function lighting() {
 const d = day(hour), dusk = Math.max(0, 1 - Math.abs(hour - 18.6) / 1.6);
 const sky = new T.Color('#0f1030').lerp(new T.Color('#8fd0ff'), d).lerp(new T.Color('#ff9a7a'), dusk * .55);
 scene.background = sky; scene.fog = new T.Fog(sky, 380, 1400);
 hemi.intensity = .35 + d * .9; sun.intensity = .3 + d * 2; sun.color.set('#ffd9a0').lerp(new T.Color('#fff'), d * (1 - dusk));
}
lighting();

const clock = {day: 1, hour};
const paint = createPaintWorld({scene, heightAt: (a, b) => world.heightAt(a * .6, b * .6) / .6, unit: .6, camera, plantScale: 5});
const hunt = createHunt({scene, camera, renderer, world, paint, clock, mode: q.get('mode') || 'cart', beacons: q.get('beacons') !== '0'});
if (q.has('reset')) { try { localStorage.removeItem('aw-effects'); } catch {} }
paint.warm(renderer, camera);
window.__hunt = hunt; window.__world = world; window.__paint = paint;
window.addEventListener('keydown', e => { if (e.code === 'KeyN') { hour = day(hour) > .5 ? 22 : 12; clock.hour = hour; lighting(); } if (e.code === 'KeyB') hunt.setBeacons(!hunt.beam.root.visible); if (e.code === 'KeyG') hunt.setMode(hunt.mode === 'god' ? 'cart' : 'god'); if (e.code === 'KeyV') hunt.setMode(hunt.mode === 'cart' ? 'buggy' : hunt.mode === 'buggy' ? 'coaster' : 'cart'); });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
const s0 = hunt.driver.s; camera.position.set(s0.x, s0.y + 8, s0.z + 20);
let last = performance.now();
renderer.setAnimationLoop(now => {
 const dt = (now - last) / 1000; last = now; clock.hour = hour; const s = hunt.frame(dt);
 sun.target.position.set(s.x, s.y, s.z); sun.position.set(s.x - 60, s.y + 90, s.z + 40);
 renderer.render(scene, camera);
});
const boot = document.getElementById('boot'); boot.style.opacity = 0; setTimeout(() => boot.remove(), 700);
</script>
</body>
</html>
