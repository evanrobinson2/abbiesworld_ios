<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>School Jump Models</title>
<style>
/* AW-STUDY-0032: one interactive model at a time (orbit and zoom), lit by the game's own dusk. ?m=bub|kid|school|wagon */
html,body{margin:0;height:100%;background:#2a1f33;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100dvh}
#poses{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));translate:-50% 0;display:flex;gap:6px;padding:5px;border-radius:999px;
 background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.4);box-shadow:0 8px 24px rgba(20,10,40,.35),inset 0 1px 0 rgba(255,255,255,.55)}
#poses button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 16px/1 system-ui}
#poses button[aria-pressed=true]{background:rgba(255,214,120,.85);box-shadow:0 0 12px rgba(255,200,90,.6)}
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/"}}</script>
</head>
<body>
<div id="poses"></div>
<script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/OrbitControls.js';
import {makeBlackLab} from '/simulations/black-lab.mjs';
import {makeYoungDaddy} from '/simulations/young-daddy.mjs';
const W = await import('/studies/school/school-world.mjs').catch(() => ({}));

const which = new URLSearchParams(location.search).get('m') || 'bub';
const renderer = new T.WebGLRenderer({antialias: true}); renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);
const scene = new T.Scene(); scene.background = new T.Color('#3a2b44');
const camera = new T.PerspectiveCamera(35, 1, .02, 400);
scene.add(new T.HemisphereLight('#ffd9c0', '#4a3550', 1.1));
const sun = new T.DirectionalLight('#ffab70', 3.2); sun.position.set(-4, 3, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0004;
const rim = new T.DirectionalLight('#9fb6ff', 1.2); rim.position.set(3, 2.5, -4); scene.add(sun, rim);
const floor = new T.Mesh(new T.CircleGeometry(30, 48), new T.MeshStandardMaterial({color: '#5a4a52', roughness: 1})); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
floor.visible = which !== 'school';
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;

let model, update = () => {}, poses = [], pose = 0;
if (W.duskEnvironment) { scene.environment = W.duskEnvironment(T, renderer); scene.environmentIntensity = .7; }
if (which === 'bub') {
 const bub = makeBlackLab(T); model = bub.group; scene.add(model);
 poses = [['◦', {speed: 0}], ['≈', {speed: 1.1}], ['»', {speed: 2.8}], ['⇶', {speed: 5}], ['▾', {sit: 1, pant: true, wag: 1}]];
 let barkT = 3; update = dt => { bub.update(dt, poses[pose][1]); if ((barkT -= dt) < 0) { barkT = 4; if (pose === 0) bub.bark(); } };
 camera.position.set(1.3, .8, 1.6); controls.target.set(0, .4, 0); sun.shadow.camera.left = sun.shadow.camera.bottom = -2; sun.shadow.camera.right = sun.shadow.camera.top = 2;
} else if (which === 'kid') {
 const kid = makeYoungDaddy(T); model = kid.group; scene.add(model);
 const v = (x, y, z) => new T.Vector3(x, y, z);
 poses = [['◦', {}], ['≈', {walk: 1.4}], ['↑', {hands: [v(-.25, 1.75, .3), v(.22, 1.5, .32)], feet: [v(-.14, .45, .3), v(.15, .25, .3)], lean: -.1}], ['➶', {throw: .3}], ['☼', {shield: 1}]];
 update = dt => kid.update(dt, poses[pose][1]);
 camera.position.set(1.2, 1.2, 2.4); controls.target.set(0, .75, 0); sun.shadow.camera.left = sun.shadow.camera.bottom = -2; sun.shadow.camera.right = sun.shadow.camera.top = 2;
} else if (W.buildSchoolViewer) {
 ({model, update} = W.buildSchoolViewer(T, scene, which, {camera, controls, sun}));
}
const bar = document.getElementById('poses');
poses.forEach(([icon], i) => { const b = document.createElement('button'); b.textContent = icon; b.setAttribute('aria-pressed', i === pose); b.onclick = () => { pose = i; [...bar.children].forEach((c, j) => c.setAttribute('aria-pressed', j === i)); }; bar.append(b); });
if (!poses.length) bar.remove();
const q = new URLSearchParams(location.search); if (q.has('pose')) pose = +q.get('pose');
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now();
renderer.setAnimationLoop(now => { const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); controls.update(); renderer.render(scene, camera); });
window.viewer = {scene, camera, controls, setPose: i => pose = i};
</script>
</body>
</html>
