<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grace's Basement</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* AW-STUDY-0024: the basement, played. Built on docs/design/INTERACTION_GRAMMAR.md: touch the thing you mean, small
   things come to you in a close-up, the girl thinks out loud in captions, lists are paper. */
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}
#keys{position:fixed;left:-200px;top:0;width:10px;height:10px;opacity:0;font-size:16px}
/* Her inner voice (captions at the bottom, "> " choices) comes from /simulations/memory-kit/inner-voice.mjs. */
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
<textarea id="keys" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Grace's keyboard"></textarea>
<script type="module">
import * as T from 'three';
import {createBasement, createKid, createCoin, floorY, ROOM, CHORES} from '/simulations/grace-basement.mjs';
import {GracePC} from '/simulations/grace-pc.mjs';
import {loadGraceKid} from '/simulations/grace-kid.mjs';
import {volunteer, playerCamera, presentation} from '/simulations/presentation-layer.mjs';
import {coinReward} from '/simulations/coin-reward.mjs';
import {eraPass, WARM_UP} from '/simulations/memory-kit/era-pass.mjs';
import {innerVoice} from '/simulations/memory-kit/inner-voice.mjs';
import {dialog} from '/simulations/memory-kit/dialog.mjs';
import {inventory} from '/simulations/inventory.mjs';
import {give as giveMemoryCoin} from '/simulations/memory-coins.mjs';

const q = new URLSearchParams(location.search);
const embed = q.has('embed');   // inside another page's iframe (the sandbox's "play while you wait"): the way up tells the parent instead
const fromCafe = q.get('from') === 'cafe' || embed;
// Both ways up (the door, and the ending) land in the café diorama, which walks her up the stairs.
const CAFE_EXIT = '/studies/cafe/diorama.html?from=basement';
const leave = () => { if (embed) parent.postMessage({type: 'basement', event: 'quit'}, '*'); else location.href = CAFE_EXIT; };
let paused = false;
addEventListener('message', e => { const t = e.data?.type; if (t !== 'pause' && t !== 'resume') return; paused = t === 'pause'; try { if (paused) pc.v86?.stop(); else pc.v86?.run(); } catch {} });
const renderer = new T.WebGLRenderer({antialias: false, powerPreference: 'high-performance'});
renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.BasicShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);

const scene = new T.Scene(); scene.background = new T.Color('#000');
const room = createBasement(); scene.add(room);
const U = room.userData;
const camera = playerCamera(new T.PerspectiveCamera(30, 1, .05, 60));

// ---------- The girl: the rigged base character with every limb in its parts; the old block kid if it can't load. ----------
let kid = createKid(); kid.scale.setScalar(1.12); scene.add(kid); let rigged = false;
loadGraceKid().then(g => { const p = kid.position.clone(), r = kid.rotation.y; scene.remove(kid); kid = g; kid.position.copy(p); kid.rotation.y = r; scene.add(kid); rigged = true; }).catch(e => console.warn('[basement] kid', e));

// ---------- Sound: synthesised, each touch shaped by its material. ----------
let ac = null, hum = null, master = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.connect(ac.destination); } catch { ac = null; } } if (ac?.state === 'suspended') ac.resume(); return ac; }
function blip({f = 440, t = .08, type = 'square', g = .08, slide = 0, noise = false, lp = 0, hp = 0, at = 0} = {}) {
 const a = audio(); if (!a) return; const now = a.currentTime + at, out = a.createGain(); f *= 1 + (Math.random() - .5) * .08;
 out.gain.setValueAtTime(g, now); out.gain.exponentialRampToValueAtTime(.0001, now + t);
 let src; if (noise) { const b = a.createBuffer(1, Math.max(1, a.sampleRate * t | 0), a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; src = a.createBufferSource(); src.buffer = b; }
 else { src = a.createOscillator(); src.type = type; src.frequency.setValueAtTime(f, now); if (slide) src.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), now + t); }
 let node = src; if (lp) { const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; node.connect(fl); node = fl; }
 if (hp) { const fl = a.createBiquadFilter(); fl.type = 'highpass'; fl.frequency.value = hp; node.connect(fl); node = fl; }
 node.connect(out).connect(master); src.start(now); src.stop(now + t + .02);
}
const SFX = {
 gb: n => ({move: () => blip({f: 330, t: .025, type: 'square', g: .03, lp: 2400}), turn: () => blip({f: 520, t: .03, type: 'square', g: .03, lp: 2400}), lock: () => blip({f: 120, t: .06, type: 'square', g: .04, lp: 900}),
  clear: () => [0, 1, 2].forEach(i => blip({f: 520 + i * 160, t: .07, type: 'square', g: .035, lp: 2600, at: i * .06})), big: () => [0, 1, 2, 3, 4].forEach(i => blip({f: 480 + i * 130, t: .08, type: 'square', g: .04, lp: 2800, at: i * .06})),
  over: () => [0, 1, 2, 3].forEach(i => blip({f: 400 - i * 70, t: .14, type: 'square', g: .04, lp: 1600, at: i * .14})), start: () => [0, 1].forEach(i => blip({f: 600 + i * 300, t: .08, type: 'square', g: .035, lp: 2600, at: i * .08})), click: () => blip({f: 700, t: .03, type: 'square', g: .03, lp: 2400})})[n]?.(),
 click: () => { blip({noise: true, t: .03, g: .25, lp: 3000}); blip({f: 1800, t: .02, g: .05}); },
 stepWood: () => blip({noise: true, t: .09, g: .12, lp: 500}), stepStone: () => blip({noise: true, t: .05, g: .05, lp: 1800}), stepRug: () => blip({noise: true, t: .07, g: .05, lp: 300}),
 creak: () => blip({f: 180, t: .35, type: 'sawtooth', g: .02, slide: 90, lp: 900}),
 thunk: () => { blip({f: 70, t: .25, type: 'sine', g: .3}); blip({noise: true, t: .06, g: .1, lp: 800}); },
 beep: () => blip({f: 880, t: .18, type: 'square', g: .04}),
 disk: () => { for (let i = 0; i < 7; i++) blip({f: 90 + (i % 3) * 40, t: .07, type: 'square', g: .03, lp: 700, at: i * .11}); },
 key: () => blip({noise: true, t: .03, g: .09, lp: 2500}),
 plug: () => { blip({noise: true, t: .04, g: .2, lp: 1500}); blip({f: 140, t: .08, type: 'square', g: .05, lp: 600, at: .03}); },
 spray: () => blip({noise: true, t: .22, g: .06, hp: 2500}), squeak: () => blip({f: 1300, t: .07, type: 'sine', g: .03, slide: 500}),
 rub: () => blip({noise: true, t: .08, g: .03, lp: 900}),
 boop: () => blip({f: 220, t: .12, type: 'sine', g: .06, slide: -60}),
 door: () => { blip({f: 120, t: .5, type: 'sawtooth', g: .02, slide: 60, lp: 700}); blip({noise: true, t: .1, g: .15, lp: 400, at: .45}); },
 page: () => blip({noise: true, t: .12, g: .05, hp: 1500}),
 tick: () => { blip({noise: true, t: .05, g: .07, hp: 3000}); blip({noise: true, t: .05, g: .07, hp: 3000, at: .08}); },
 chime: () => [784, 988, 1175, 1568].forEach((f, i) => blip({f, t: .25, type: 'triangle', g: .05, at: i * .07})),
};
function startHum() { const a = audio(); if (!a || hum) return; const o = a.createOscillator(), g = a.createGain(); o.type = 'sawtooth'; o.frequency.value = 120;
 const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 260; g.gain.value = 0; o.connect(f).connect(g).connect(master); o.start(); hum = {o, g}; }

// Faint 8-bit music: our own little tune, a pulse-wave melody over a triangle bass. It is meta (it lives in her body,
// not in the room) and it grows as she nears Grace's computer, because the computer is calling her.
const TUNE = {bpm: 92, lead: [76, 0, 79, 81, 79, 76, 74, 0, 72, 74, 76, 0, 74, 72, 69, 0, 72, 0, 74, 76, 79, 76, 74, 72, 74, 0, 0, 0, 67, 69, 72, 0],
 bass: [48, 0, 55, 0, 45, 0, 52, 0, 41, 0, 48, 0, 43, 0, 50, 0]};
let music = null;
function startMusic() {
 const a = audio(); if (!a || music) return;
 const gain = a.createGain(); gain.gain.value = 0; gain.connect(master);
 const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.connect(gain);
 const n = 32, re = new Float32Array(n), im = new Float32Array(n); for (let k = 1; k < n; k++) im[k] = 2 / (k * Math.PI) * Math.sin(k * Math.PI * .25);
 const pulse = a.createPeriodicWave(re, im);
 const step = 60 / TUNE.bpm / 2; let next = a.currentTime + .1, i = 0;
 const hz = m => 440 * Math.pow(2, (m - 69) / 12);
 const note = (m, at, len, wave, g) => { if (!m) return; const o = a.createOscillator(), e = a.createGain(); if (wave === 'pulse') o.setPeriodicWave(pulse); else o.type = wave; o.frequency.value = hz(m);
  e.gain.setValueAtTime(0, at); e.gain.linearRampToValueAtTime(g, at + .01); e.gain.exponentialRampToValueAtTime(.0001, at + len); o.connect(e).connect(lp); o.start(at); o.stop(at + len + .05); };
 const timer = setInterval(() => { while (next < a.currentTime + .4) { note(TUNE.lead[i % 32], next, step * .9, 'pulse', .5); if (i % 2 === 0) note(TUNE.bass[(i / 2) % 16], next, step * 1.8, 'triangle', .7); next += step; i++; } }, 100);
 music = {gain, timer};
}

// ---------- Her voice: she thinks out loud. The device speaks it in a bright, curious child's voice. ----------
const voice = innerVoice({font: 'VT323', speak: q.has('voice'), onTouch: () => { audio(); startMusic(); }});
const say = voice.say, once = voice.once, hush = voice.hush, spoken = {has: voice.heard, add: voice.mark};

// ---------- The computer: a real PC in an emulator, on a CRT shader with real grime you wash and dry. ----------
const pc = new GracePC({sound: k => SFX[k]?.(), found: id => { giveCoin(id, U.screen); if (id === 'coin-disk') ending.pending = true; }});
const screenTex = new T.CanvasTexture(pc.canvas); screenTex.colorSpace = T.SRGBColorSpace; screenTex.minFilter = T.LinearFilter;
// Grime: red = dust and old fingerprints, green = wet streaks. Washing turns dust to wet; drying takes the wet away.
const GW = 96, GH = 72, grime = Object.assign(document.createElement('canvas'), {width: GW, height: GH}), gx = grime.getContext('2d', {willReadFrequently: true});
{ const d = gx.createImageData(GW, GH); for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) { const i = (y * GW + x) * 4, n = .72 + .28 * Math.sin(x * .37 + y * .21) * Math.cos(y * .53 - x * .11) + (Math.random() - .5) * .25;
 d.data[i] = 255 * Math.min(1, Math.max(.45, n)); d.data[i + 3] = 255; } gx.putImageData(d, 0, 0); }
const grimeTex = new T.CanvasTexture(grime); grimeTex.minFilter = T.LinearFilter;
const crt = new T.ShaderMaterial({
 name: 'crt phosphor screen',
 uniforms: {map: {value: screenTex}, grime: {value: grimeTex}, power: {value: 0}, time: {value: 0}, rows: {value: 400}},
 vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
 fragmentShader: `uniform sampler2D map, grime; uniform float power, time, rows; varying vec2 vUv;
  void main(){
   vec2 c = vUv - .5; vec2 uv = .5 + c * (1. + .1 * dot(c, c)) * 1.04;
   vec3 glass = vec3(.16, .18, .17) * (.55 + .45 * (1. - length(c) * 1.4)) + .06 * smoothstep(.2, .0, length(c - vec2(-.22, .25)));
   vec3 col = vec3(0.);
   if (uv.x > 0. && uv.x < 1. && uv.y > 0. && uv.y < 1.) {
    vec3 s = texture2D(map, uv).rgb;
    vec3 g = (texture2D(map, uv + vec2(.004, 0.)).rgb + texture2D(map, uv - vec2(.004, 0.)).rgb + texture2D(map, uv + vec2(0., .006)).rgb + texture2D(map, uv - vec2(0., .006)).rgb) * .25;
    float scan = .72 + .28 * pow(sin(uv.y * rows * 3.14159), 2.);
    col = (s * scan + g * .45) * vec3(.95, 1., 1.02);
    col *= .96 + .04 * sin(time * 60.);
   }
   float edge = smoothstep(.5, .36, max(abs(c.x), abs(c.y)));
   vec3 lit = mix(glass * .5, glass * .1 + col * 1.25 * edge + vec3(.015, .02, .02) * edge, power);
   vec2 gr = texture2D(grime, vUv).rg;
   lit = mix(lit, vec3(.24, .21, .16) * (.6 + .4 * power), gr.r * .82);
   lit += vec3(.10, .12, .13) * gr.g * (.5 + .5 * sin(vUv.x * 90. + vUv.y * 30.));
   gl_FragColor = vec4(lit, 1.);
  }`,
});
U.screen.material = crt;
const crtLight = new T.PointLight('#b8d0ff', 0, 1.6, 2); crtLight.castShadow = false; scene.add(crtLight);

// ---------- Lights: dark until the switches are right. ----------
scene.add(new T.AmbientLight('#20243a', .16));
U.gameboy.onSound = n => SFX.gb(n);
// Holding it up to the bulb: a little extra warmth over the handheld while she looks at it (the desk's cone is hard-edged).
const gbLamp = new T.PointLight('#ffe6bf', 0, 1.1, 1.6); gbLamp.position.copy(U.gameboy.group.position).add(new T.Vector3(-.14, .24, 0)); scene.add(gbLamp);
const hall = new T.SpotLight('#ffcf8a', 5, 7, .55, .6, 1.4); hall.position.set(.45, ROOM.landing + 1.8, ROOM.back + .4); hall.target.position.set(1.6, 0, -.4);
hall.castShadow = true; hall.shadow.mapSize.set(512, 512); scene.add(hall, hall.target);
// The little lamp over the switches: enough light to see the three toggles, never enough to see the room.
const spill = new T.PointLight('#ffcf8a', .55, 1.5, 2); spill.position.copy(U.switchLamp.getWorldPosition(new T.Vector3())).add(new T.Vector3(0, -.06, .1)); scene.add(spill);
const moon = new T.SpotLight('#5c7cff', 1.6, 6, .5, .8, 1.2); moon.position.set(4.6, 2.3, ROOM.back + .2); moon.target.position.set(5.2, 0, .6); scene.add(moon, moon.target);
const B = ROOM.bulb, L1 = ROOM.lamp1;
const bulbSpot = new T.SpotLight('#ffd7a0', 0, 6, .95, .55, 1.3); bulbSpot.position.set(B.x, B.y - .03, B.z); bulbSpot.target.position.set(B.x, 0, B.z);
bulbSpot.castShadow = true; bulbSpot.shadow.mapSize.set(1024, 1024); bulbSpot.shadow.bias = -.0005; bulbSpot.shadow.normalBias = .02; scene.add(bulbSpot, bulbSpot.target);
const bulbFill = new T.PointLight('#ffcf98', 0, 5, 1.8); bulbFill.position.set(B.x, B.y, B.z); scene.add(bulbFill);
const lamp1 = new T.PointLight('#ffd2a0', 0, 5.5, 1.6); lamp1.position.set(L1.x, L1.y - .05, L1.z); lamp1.castShadow = true; lamp1.shadow.mapSize.set(512, 512); lamp1.shadow.normalBias = .03; scene.add(lamp1);

const coneH = B.y - .02, coneG = new T.CylinderGeometry(.03, 1.25, coneH, 24, 1, true); coneG.translate(0, -coneH / 2, 0);
const coneM = new T.ShaderMaterial({name: 'bulb light shaft', transparent: true, depthWrite: false, blending: T.AdditiveBlending, side: T.DoubleSide,
 uniforms: {on: {value: 0}}, vertexShader: 'varying float h; varying vec3 n, v; void main(){ h = -position.y; n = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position,1.); v = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
 fragmentShader: `uniform float on; varying float h; varying vec3 n, v; void main(){ float f = pow(abs(dot(n, v)), 1.6); float fall = smoothstep(${coneH.toFixed(2)}, .1, h) * smoothstep(0., .25, h); gl_FragColor = vec4(vec3(1., .82, .55) * .16 * f * fall * on, 1.); }`});
const cone = new T.Mesh(coneG, coneM); cone.name = 'bulb light shaft'; cone.position.set(B.x, B.y, B.z); cone.raycast = () => {}; scene.add(cone);
const dustN = 90, dustP = new Float32Array(dustN * 3), dustSeed = [];
for (let i = 0; i < dustN; i++) dustSeed.push([Math.random(), Math.random() * Math.PI * 2, Math.random()]);
const dustG = new T.BufferGeometry(); dustG.setAttribute('position', new T.BufferAttribute(dustP, 3));
const dustM = new T.PointsMaterial({name: 'dust motes', color: '#ffe2b0', size: .009, transparent: true, opacity: 0, depthWrite: false, blending: T.AdditiveBlending});
const dust = new T.Points(dustG, dustM); dust.name = 'dust'; scene.add(dust);
// Grace's glitter powder mishap (Evan): the strange, unworldly glow on top of her computer is glitter, spilled long
// ago and never quite cleaned up. Each fleck sits on the real surface (dropped onto it with a ray) and winks as the
// light and the camera move, a little brighter when the bulb is on.
const glitter = (() => {
 room.updateMatrixWorld(true);
 const box = new T.Box3().setFromObject(U.computer), parts = []; U.computer.traverse(o => { if (o.isMesh) parts.push(o); });
 const down = new T.Raycaster(), pos = [], seed = [], col = [], tints = ['#ffd75e', '#ff8fd8', '#8ff0ff', '#c9a2ff', '#b9ff8f'].map(c => new T.Color(c));
 for (let i = 0; i < 1400 && pos.length < 900 * 3; i++) {
  // Thick on the top, thinning towards the front edge, as if it was shaken out over the back.
  const u = Math.random(), x = T.MathUtils.lerp(box.min.x - .03, box.max.x + .03, u), z = T.MathUtils.lerp(box.min.z, box.max.z, Math.pow(Math.random(), .7));
  down.set(new T.Vector3(x, box.max.y + .2, z), new T.Vector3(0, -1, 0));
  const hit = down.intersectObjects(parts, false)[0]; if (!hit || hit.point.y < box.max.y - .14) continue;
  pos.push(hit.point.x, hit.point.y + .002, hit.point.z); seed.push(Math.random() * 100); tints[i % tints.length].toArray(col, col.length);
 }
 const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); g.setAttribute('seed', new T.Float32BufferAttribute(seed, 1)); g.setAttribute('color', new T.Float32BufferAttribute(col, 3));
 const m = new T.ShaderMaterial({name: 'glitter flecks', transparent: true, depthWrite: false, blending: T.AdditiveBlending, uniforms: {time: {value: 0}, light: {value: .25}, px: {value: 1}},
  vertexShader: `attribute float seed; attribute vec3 color; uniform float time, light, px; varying vec3 c; varying float a;
   void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.); float w = pow(max(0., sin(time * (1.3 + fract(seed) * 2.) + seed * 7.1 + mv.x * 40.)), 12.);
    a = (.25 + 2.2 * w) * light; c = color; gl_PointSize = clamp((.8 + 2. * w) * px * .9 / -mv.z, 1., 3. + 3. * w); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: 'varying vec3 c; varying float a; void main(){ vec2 d = abs(gl_PointCoord - .5); float s = max(1. - (d.x + d.y) * 2.2, 0.) + max(0., 1. - d.x * 9.) * max(0., 1. - d.y * 2.) + max(0., 1. - d.y * 9.) * max(0., 1. - d.x * 2.); gl_FragColor = vec4(c * a * s, 1.); }'});
 const pts = new T.Points(g, m); pts.name = 'glitter'; pts.raycast = () => {}; scene.add(pts);
 return {m, top: box.max.y};
})();

// ---------- The era pass (shared kit): chunky dithered pixels in the room, crisp at the screen, the old set's warm-up. ----------
const era = eraPass(T, renderer);

// ---------- Her body: walk the stairs and the floor, reach, crouch, sit, stand. ----------
const me = {x: .35, target: .35, face: 1, state: 'standing', seated: 0, walkT: 0, after: null, reach: 0, crouch: 0, gone: 0};
let anim = '';
const act = (name, fade) => { if (!rigged || anim === name) return; anim = name; kid.userData.play(name, fade); };
function placeKid(dt) {
 const onStairs = me.x > ROOM.stairs[0] - .05 && me.x < ROOM.stairs[1] + .05, dx = me.target - me.x, speed = onStairs ? .42 : .72; // slow and careful: the stairs are steep
 if (rigged && kid.userData.actions.walk) kid.userData.actions.walk.timeScale = speed / .9;
 const walking = me.state === 'walking' && Math.abs(dx) > .01;
 if (walking) { const step = Math.sign(dx) * Math.min(Math.abs(dx), speed * dt); me.x += step; me.face = Math.sign(dx); me.walkT += dt * 7.5 * speed / 1.15;
  const ph = Math.floor(me.walkT / Math.PI); if (ph !== me.lastPh) { me.lastPh = ph; (me.x < ROOM.stairs[1] ? SFX.stepWood : Math.abs(me.x - 5.1) < 1.2 ? SFX.stepRug : SFX.stepStone)(); } }
 else if (me.state === 'walking') { me.state = 'standing'; const f = me.after; me.after = null; f?.(); }
 const sit = me.seated, fy = floorY(me.x); me.y = me.y === undefined ? fy : me.y + (fy - me.y) * Math.min(1, dt * 9); const y = me.y;
 kid.position.set(T.MathUtils.lerp(me.x, ROOM.chair.x + (rigged ? .02 : 0), sit), T.MathUtils.lerp(y, rigged ? SEAT_Y : 0, sit) + (walking && !rigged ? Math.abs(Math.sin(me.walkT)) * .025 : 0), T.MathUtils.lerp(ROOM.walkZ, ROOM.chair.z, sit) - me.gone * .9);
 const yaw = rigged ? (me.face > 0 ? Math.PI / 2 : -Math.PI / 2) : (me.face > 0 ? 0 : Math.PI), seatYaw = rigged ? Math.PI / 2 : 0;
 const want = me.gone > .01 ? (rigged ? Math.PI : -Math.PI / 2) : sit > .3 ? seatYaw : yaw;
 let d = want - kid.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); kid.rotation.y += d * Math.min(1, dt * 10);
 if (rigged) {
  if (me.state === 'seated' || sit > 0) act(me.sitting ? 'sitDown' : 'sit', .3);
  else if (walking) act('walk', .2);
  else if (me.crouch > 0) act('pickUp', .15);
  else if (me.reach > 0) act('reach', .15);
  else act('idle', .3);
  me.reach = Math.max(0, me.reach - dt * .9); me.crouch = Math.max(0, me.crouch - dt * .7);
  kid.userData.update(dt);
  // Feet stay on the steps: lift her just enough that no foot point sinks into the step beneath it. On the stairs
  // the leading foot then hangs over the lower step and the trailing one stands on the higher, the way a child steps
  // down; on flat floor it changes nothing.
