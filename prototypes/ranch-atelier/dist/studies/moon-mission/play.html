<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon Mission</title>
<!-- The Moon Mission plays inside Winchester (/town), never on its own page (Evan, 2026-10-23). This keeps old links working:
     ?beat=<id> and ?chapter=<n> carry over. -->
<script>
const q = new URLSearchParams(location.search), out = new URLSearchParams({mission: ''});
for (const k of ['beat', 'chapter', 'quiet']) if (q.has(k)) out.set(k, q.get(k));
if (q.get('beat') === 'outpost' && !q.has('chapter')) out.set('chapter', '2');
location.replace('/town?' + out.toString().replace('mission=', 'mission'));
</script>
<p>Opening the Moon Mission in Winchester… <a href="/town?mission">Go</a></p>
