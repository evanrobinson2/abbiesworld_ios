<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moon Mission in the world</title>
<style>
/* AW-STUDY-0036: the Part 1 mission loop on the big TV. Light mode on Earth, dark mode on the Moon. Words only in cutscene
   cards and the bottom captions; jobs live on the capsule panel. Nothing covers the world. */
:root{--bg:#eaf3ff;--ink:#1b2238;--dim:#5b6785;--line:#cdd7ee;--key:#ffffff;--glow:#ff7eb6;--pink:#ff7eb6;--purple:#b18cff;--blue:#6f9bff;--green:#6fe3a5;--bar:rgba(255,255,255,.92)}
:root[data-mood=dark]{--bg:#05070f;--ink:#eef1fb;--dim:#9aa6c8;--line:#26304f;--key:#121a33;--bar:rgba(5,7,15,.92)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:clamp(16px,2vw,26px)/1.3 "Atkinson Hyperlegible",system-ui,sans-serif;transition:background 1.2s,color 1.2s;overflow:hidden;display:grid;grid-template-rows:auto minmax(46vh,1fr) auto auto auto}
header{display:flex;justify-content:space-between;gap:16px;padding:14px 20px 0;align-items:flex-start}
.card{font:500 clamp(11px,1.6vw,20px)/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;min-height:1.4em;min-width:0}
.card i{display:block;height:1px;background:var(--ink);margin-top:6px;transform-origin:left}
.clock{font:600 clamp(18px,3vw,36px)/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;white-space:nowrap}
.clock.held{color:var(--glow)}
.stage{position:relative;display:grid;place-items:center;min-height:0}
.zone{position:absolute;left:20px;top:8px;font:500 12px/1.3 "IBM Plex Mono",monospace;color:var(--dim);max-width:60%}
.rocket{width:min(22vh,160px);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.rocket.pop{animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(0) rotate(-8deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.stage.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}}
.count{position:absolute;right:24px;bottom:12px;font:800 clamp(48px,12vw,140px)/1 "Big Shoulders Display","Arial Narrow",sans-serif;color:var(--glow)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.say{padding:6px 20px 4px;min-height:2.6em}
.say .who{display:inline-block;width:.6em;height:.6em;border-radius:50%;margin-right:.5em;background:var(--dim)}
.say.thought{font-style:italic;color:var(--dim)}
.opts{display:grid;gap:4px;padding:0 20px}
.opt{display:flex;gap:10px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bar);cursor:pointer;font:inherit;color:inherit;text-align:left}
.opt.sel{border-color:var(--glow)}
.chip{width:.9em;height:.9em;border-radius:50%;display:inline-block}
.panel{display:flex;flex-wrap:wrap;gap:10px;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));align-items:stretch}
.pl{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:16px;padding:8px;background:var(--bar);display:grid;gap:6px}
.pl h2{margin:0;font:700 14px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.keys{display:flex;flex-wrap:wrap;gap:6px}
button.key{min-width:4.5em;padding:8px 8px;border-radius:12px;border:2px solid var(--c);background:var(--key);color:var(--ink);font:700 clamp(12px,1.7vw,18px)/1.1 inherit;cursor:pointer}
button.key[disabled]{opacity:.3;cursor:default}
button.key.on{box-shadow:0 0 0 3px var(--c),0 0 22px var(--c)}
button.key.pulse{animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.pocket{display:flex;gap:6px;flex-wrap:wrap;font-size:22px}
.hint{color:var(--dim);font:500 12px/1.3 "IBM Plex Mono",monospace;padding:0 20px 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="card" id="card"></div><div class="clock" id="clock">T-24:00:00</div></header>
<div class="stage" id="stage"><canvas id="cv"></canvas><div class="zone" id="zone"></div>
 <svg class="rocket" id="rocket" viewBox="0 0 60 100" hidden aria-hidden="true"><path d="M30 4c12 10 16 28 14 52H16C14 32 18 14 30 4z" fill="#fff" stroke="#c9d3ea" stroke-width="1.5"/><path d="M30 4c6 5 10 12 12 20H18c2-8 6-15 12-20z" fill="#ff7eb6"/><circle cx="30" cy="38" r="7" fill="#7fb4ff" stroke="#8aa0c6" stroke-width="2"/><path d="M16 56l-10 18 12-6zM44 56l10 18-12-6z" fill="#ff7eb6"/><path d="M22 56h16l-3 12h-10z" fill="#9aa6c8"/></svg>
 <div class="count" id="count" hidden></div></div>
<div class="say" id="say"></div>
<div class="opts" id="opts"></div>
<div class="panel" id="panel"></div>
<div class="hint" id="hint">Keys: Daddy A, Abbie G, Ani L (action). Up/Down moves the choice. Space (Daddy) is thrust, hold R to talk to Houston. Tap the keys on screen too.</div>
<script type="importmap">{"imports": {"three": "/vendor/three.module.js", "three/addons/loaders/GLTFLoader.js": "/vendor/loaders/GLTFLoader.js"}}</script>
<script type="module">
import {createMission, PLAYERS} from '/simulations/moonmission/mission.mjs';
import {ZONES} from '/simulations/moonmission/zones.mjs';
import {createWorld} from '/simulations/moonmission/world3d.mjs';
const $ = id => document.getElementById(id), q = new URLSearchParams(location.search);
const world = createWorld($('cv'), ZONES), m = createMission(), root = document.documentElement;
const color = id => (PLAYERS.find(p => p.id === id) || {}).color || '#9aa6c8';
const VOICE = {houston: {pitch: .8, rate: .95}, officer: {pitch: .9, rate: 1}, daddy: {pitch: .7, rate: 1}, abbie: {pitch: 1.5, rate: 1.05}, ani: {pitch: 1.4, rate: 1.05}};
let cursor = {daddy: 0, abbie: 0, ani: 0}, sound = q.get('quiet') == null, thrust = 0, tilt = 0, typing = 0;

function speak(who, text) { const s = $('say'); s.className = 'say' + (arguments[2] ? ' thought' : ''); s.innerHTML = `<span class="who" style="background:${color(who)}"></span>`; s.append(text);
 if (sound && 'speechSynthesis' in window) { try { const u = new SpeechSynthesisUtterance(text), v = VOICE[who] || {}; u.pitch = v.pitch || 1; u.rate = v.rate || 1; speechSynthesis.speak(u); } catch {} } }
function card(e) { const el = $('card'), t = `${e.org} · ${e.clock} · ${e.place}`; el.innerHTML = '<span></span><i></i>'; const [sp, ln] = [el.firstChild, el.lastChild]; clearInterval(typing); let n = 0;
 typing = setInterval(() => { n++; sp.textContent = t.slice(0, n); ln.style.transform = `scaleX(${n / t.length})`; if (n >= t.length) clearInterval(typing); }, 30); }
function fx(e) {
 world.onFx(e);
 switch (e.fx) {
  case 'card': card(e); break;
  case 'zone': root.dataset.mood = e.mood; $('zone').textContent = (ZONES[e.id].region ? ZONES[e.id].region.replace('abbie-daddy-side','Abbie and Daddy').replace('anis-side','Ani\'s side') + ' · ' : '') + ZONES[e.id].name; break;
  case 'speak': speak(e.who, e.text, e.thought); break;
  case 'kaboom': { if (world.state.port) break; const r = $('rocket'); r.hidden = false; r.classList.remove('pop'); void r.getBoundingClientRect(); r.classList.add('pop'); $('stage').classList.add('shake'); setTimeout(() => $('stage').classList.remove('shake'), 600); break; }
  case 'liftoff': break;
  case 'count': { const c = $('count'); c.hidden = e.n < 0; c.textContent = e.n; if (e.n === 0) setTimeout(() => c.hidden = true, 900); break; }
  case 'item': { const el = document.createElement('span'); el.title = e.name; el.textContent = e.icon; $('pocket').append(el); break; }
  case 'hold': $('clock').classList.add('held'); break;
  case 'job-done': $('clock').classList.remove('held'); break;
  case 'chip': break;
  case 'end': speak('houston', 'Part 1 complete: welcome to the Moon base.'); break;
 }
}
function pump(es) { for (const e of es) fx(e); render(); }
function ownerJobs(p, v) { return v.step && v.step.jobs ? v.step.jobs.filter(j => j.owner === p || j.owner === 'any') : []; }
function act(p) { // the one button: whatever this player's moment is
 const v = m.view(), st = v.step; if (!st) return;
 if (st.k === 'ask') pump(m.dispatch({type: 'choose', player: p, index: cursor[p] || 0}));
 else if (st.k === 'accept') pump(m.dispatch({type: 'press', player: p, key: 'yes'}));
 else if (st.k === 'poll') pump(m.dispatch({type: 'press', player: p, key: 'go'}));
 else if (st.k === 'jobs') { const j = ownerJobs(p, v)[0]; if (j) pump(m.dispatch({type: 'press', player: p, key: j.key})); }
 else if (st.k === 'say') pump(m.dispatch({type: 'press', player: p, key: 'next'}));
 else if (st.k === 'cutscene') pump(m.dispatch({type: 'skip', player: p}));
 else if (st.k === 'lander') { if (p === 'abbie') pump(m.dispatch({type: 'lights', on: true})); if (p === 'ani') pump(m.dispatch({type: 'feet', on: true})); }
}
function render() {
 const v = m.view(), st = v.step; $('clock').textContent = v.clock;
 const opts = $('opts'); opts.innerHTML = '';
 if (st && st.k === 'ask') st.options.forEach((t, i) => { const b = document.createElement('button'); b.className = 'opt'; b.innerHTML = '<span>&gt;</span>'; b.append(' ' + t);
  for (const [pid, idx] of Object.entries(st.votes || {})) if (idx === i) { const c = document.createElement('span'); c.className = 'chip'; c.style.background = color(pid); b.append(c); }
  b.onclick = () => act(st.who || 'daddy'); opts.append(b); });
 if (st && st.k === 'accept') { const b = document.createElement('div'); b.className = 'opt sel'; b.innerHTML = '<span>&gt;</span> We accept'; for (const pid of st.yes) { const c = document.createElement('span'); c.className = 'chip'; c.style.background = color(pid); b.append(c); } opts.append(b); }
 const panel = $('panel'); panel.innerHTML = '';
 for (const p of PLAYERS) { const d = document.createElement('div'); d.className = 'pl'; d.style.borderColor = p.color;
  d.innerHTML = `<h2 style="color:${p.color}"><span>${p.name}</span><span>${v.hat === p.id ? 'HAT' : ''}</span></h2>`;
  const keys = document.createElement('div'); keys.className = 'keys'; const mine = ownerJobs(p.id, v);
  const add = (label, on, fn) => { const b = document.createElement('button'); b.className = 'key' + (on ? ' on' : ''); b.style.setProperty('--c', p.color); b.textContent = label; b.disabled = !on; b.onclick = fn; keys.append(b); };
  if (st && st.k === 'ask') { st.options.forEach((t, i) => add(i + 1, !st.who || st.who === p.id, () => { cursor[p.id] = i; act(p.id); })); }
  else if (st && st.k === 'accept') add('YES', !st.yes.includes(p.id), () => act(p.id));
  else if (st && st.k === 'poll') add('GO!', true, () => act(p.id));
  else if (st && st.k === 'jobs') { mine.forEach(j => add(j.key.replace(/-/g, ' ').toUpperCase(), true, () => pump(m.dispatch({type: 'press', player: p.id, key: j.key})))); if (!mine.length) add('…', false); }
  else if (st && st.k === 'lander') { if (p.id === 'abbie') add('LANDING LIGHTS', true, () => act('abbie')); else if (p.id === 'ani') add('FEET DOWN', true, () => act('ani')); else add('THRUST (space)', true, () => {}); }
  else add(st && st.k === 'say' ? 'NEXT' : st && st.k === 'cutscene' ? 'SKIP' : '…', st && ['say', 'cutscene'].includes(st.k), () => act(p.id));
  d.append(keys); panel.append(d); }
 const pk = document.createElement('div'); pk.className = 'pl'; pk.innerHTML = '<h2><span>Pocket</span></h2>'; const pc = document.createElement('div'); pc.className = 'pocket'; pc.id = 'pocket';
 for (const i of v.items) { const s = document.createElement('span'); s.title = i.name; s.textContent = i.icon; pc.append(s); } pk.append(pc); panel.append(pk);
}
function drawLander(L) { const cv = $('cv'), g = cv.getContext('2d'); cv.width = cv.clientWidth; cv.height = cv.clientHeight; g.clearRect(0, 0, cv.width, cv.height); if (!L) return;
 const gy = cv.height - 30, y = gy - L.alt / 220 * (cv.height - 80) - 14, x = cv.width / 2 + L.x * 4;
 g.fillStyle = '#9aa6c8'; g.fillRect(0, gy, cv.width, 30); g.save(); g.translate(x, y); g.rotate(L.tilt * .5); g.fillStyle = '#fff'; g.fillRect(-14, -12, 28, 18); g.fillStyle = '#ff7eb6'; g.fillRect(-14, -12, 28, 5);
 g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.moveTo(-14, 6); g.lineTo(-22, 16); g.moveTo(14, 6); g.lineTo(22, 16); g.stroke();
 if (thrust) { g.fillStyle = '#ffb46b'; g.beginPath(); g.moveTo(-6, 8); g.lineTo(0, 8 + 20 + Math.random() * 8); g.lineTo(6, 8); g.fill(); } g.restore();
 g.fillStyle = '#eef1fb'; g.font = '14px monospace'; g.fillText(`alt ${L.alt.toFixed(0)} m  speed ${Math.abs(L.vy).toFixed(1)} m/s  ${L.lights ? 'lights ' : ''}${L.feet ? 'feet' : ''}`, 16, 28); }

const KEYS = {a: 'daddy', g: 'abbie', l: 'ani'};
addEventListener('keydown', e => { if (e.repeat) return; const k = e.key.toLowerCase();
 if (KEYS[k]) act(KEYS[k]);
 else if (k === 'arrowdown' || k === 'arrowup') { const st = m.view().step; if (st && st.k === 'ask') { const p = st.who || 'daddy', n = st.options.length; cursor[p] = ((cursor[p] || 0) + (k === 'arrowdown' ? 1 : n - 1)) % n; } }
 else if (k === ' ') { thrust = 1; m.dispatch({type: 'fly', thrust, tilt}); e.preventDefault(); }
 else if (k === 'r') listen(); });
addEventListener('keyup', e => { if (e.key === ' ') { thrust = 0; m.dispatch({type: 'fly', thrust, tilt}); } });
let rec = null; function listen() { const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR || rec) return; rec = new SR(); rec.lang = 'en-US'; rec.onresult = ev => { pump(m.dispatch({type: 'heard', text: ev.results[0][0].transcript})); }; rec.onend = () => { rec = null; }; try { rec.start(); } catch { rec = null; } }
// gamepads: pad i is player i; A acts, the stick or d-pad moves the choice, right trigger is thrust for Daddy
const was = [];
function pads() { const gp = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; gp.forEach((p, i) => { const id = PLAYERS[i] && PLAYERS[i].id; if (!id) return; const a = !!p.buttons[0]?.pressed; if (a && !was[i]) act(id); was[i] = a; if (id === 'daddy') { const t = p.buttons[7]?.value || 0; if (t !== thrust) { thrust = t; } tilt = p.axes[0] || 0; m.dispatch({type: 'fly', thrust, tilt}); } }); }
let last = performance.now();
function frame(now) { const dt = Math.min(.1, (now - last) / 1000); last = now; pads(); pump(m.dispatch({type: 'tick', dt})); world.tick(dt, m.view(), thrust); requestAnimationFrame(frame); }
// test by state: ?beat=launch plays a bot family up to that beat (no speech)
function bot(until) { sound = false; for (let s = 0; s < 400000 && m.view().beat !== until && !m.view().done; s++) { m.dispatch({type: 'tick', dt: .1}); const v = m.view(), st = v.step; if (!st) continue;
 if (st.k === 'ask') for (const p of PLAYERS) m.dispatch({type: 'choose', player: p.id, index: 0}); else if (st.k === 'accept') for (const p of PLAYERS) m.dispatch({type: 'press', player: p.id, key: 'yes'});
 else if (st.k === 'jobs') for (const j of st.jobs) m.dispatch({type: 'press', player: j.owner === 'any' ? 'daddy' : j.owner, key: j.key}); else if (st.k === 'poll') for (const p of PLAYERS) m.dispatch({type: 'press', player: p.id, key: 'go'}); } sound = q.get('quiet') == null; }
if (q.get('beat')) { bot(q.get('beat')); const v = m.view(); if (v.zone) world.setZone(v.zone, ZONES[v.zone].mood); }
window.moonMission = {world, m, bot, act, view: () => m.view(), dispatch: e => pump(m.dispatch(e))};
pump(m.drain()); render(); requestAnimationFrame(frame);
</script></body></html>
