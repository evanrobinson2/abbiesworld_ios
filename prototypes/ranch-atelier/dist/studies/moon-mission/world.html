<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moon Mission in the world</title>
<style>
/* AW-STUDY-0036: the Moon Mission test bench. The mission HUD (hud.mjs, shared with the Abbie's Town stage) floats over the 3D world.
   ?chapter=2 starts at the Moon base; ?beat=<id> jumps ahead with a bot family; ?quiet mutes speech; ?view=fp is first person. */
html,body{margin:0;height:100%;background:#05070f;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
</style></head><body>
<canvas id="cv"></canvas>
<script type="importmap">{"imports": {"three": "/vendor/three.module.js", "three/addons/loaders/GLTFLoader.js": "/vendor/loaders/GLTFLoader.js"}}</script>
<script type="module">
import {createMission} from '/simulations/moonmission/mission.mjs';
import {ZONES} from '/simulations/moonmission/zones.mjs';
import {createWorld} from '/simulations/moonmission/world3d.mjs';
import {createHud} from '/simulations/moonmission/hud.mjs';
const q = new URLSearchParams(location.search);
const world = createWorld(document.getElementById('cv'), ZONES), m = createMission({chapter: +q.get('chapter') || 1});
const hud = createHud({mission: m, world, quiet: q.get('quiet') != null});
if (q.get('beat')) { hud.bot(q.get('beat')); const v = m.view(); if (v.zone) world.setZone(v.zone, ZONES[v.zone].mood); }
window.moonMission = {world, m, hud, bot: hud.bot, act: hud.act, view: () => m.view(), dispatch: e => { hud.pump(m.dispatch(e)); }};
let last = performance.now();
(function frame(now) { const dt = Math.min(.1, (now - last) / 1000); last = now; hud.frame(dt); requestAnimationFrame(frame); })(last);
</script></body></html>
