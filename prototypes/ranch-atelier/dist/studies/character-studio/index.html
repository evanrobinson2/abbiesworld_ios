<!doctype html>
<html lang="en" data-aw-skin="look study">
<head>
<meta charset="utf-8">
<title>Character Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<script src="/theme/boot.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* AW-STUDY-0037 Character Studio. Layout (docs/design/look/LOOK.md): the stage is the page. A thin top bar (AW mark,
   name, the three rooms). The cast stands as portrait blocks down the left edge, the art directions as swatch blocks
   down the right. The moves live in a drawer at the bottom: genre blocks, then pose tiles you can see before you tap.
   Flat colour, Roboto, toy blocks that press down; glass only as small lenses. */
:root{
 --bg:var(--aw-bg,#f3eee3); --surface:var(--aw-surface,#fbf8f2); --ink:var(--aw-ink,#2b2218); --soft:var(--aw-soft,#6b5d4c);
 --line:var(--aw-line,#e2d8c6); --accent:var(--aw-accent,#7a5236); --on-accent:var(--aw-on-accent,#ffffff); --edge:color-mix(in srgb,var(--accent) 35%,var(--line));
 --font:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif; --r:14px;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.35 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important} /* .rail and .drawer set display, which would otherwise beat the hidden attribute */
/* a room (2D, Cast, Crowd) sits under the bar, never behind it, so its own title can't collide with ours */
.frame{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 52px);border:0;width:100%;height:calc(100% - env(safe-area-inset-top,0px) - 52px);background:var(--bg)}
body[data-room] .bar{background:var(--bg)}
.bar{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;gap:10px;
 padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 13px var(--font);letter-spacing:.5px;flex:none}
.title{font:500 16px var(--font);white-space:nowrap}
.title small{display:block;font:400 11px var(--font);color:var(--soft);letter-spacing:.3px}
.grow{flex:1}
.block{font:500 13px var(--font);color:var(--ink);background:var(--surface);border:0;border-radius:10px;padding:8px 12px;cursor:pointer;
 box-shadow:0 3px 0 var(--edge);transform:translateY(-3px);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.block:active{transform:translateY(0);box-shadow:0 0 0 var(--edge)}
.block[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.block:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.rail{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:3;display:flex;flex-direction:column;gap:22px}
.rail.left{left:max(16px,env(safe-area-inset-left,0px))}
.rail.right{right:max(46px,calc(env(safe-area-inset-right,0px) + 30px));align-items:flex-end} /* clear of the Context tab */
.tile{position:relative;width:58px;height:58px;border:0;padding:0;border-radius:var(--r);background:var(--surface) center/cover no-repeat;cursor:pointer;
 box-shadow:0 3px 0 var(--edge);transform:translateY(-3px);transition:transform .08s}
.tile:active{transform:translateY(0)}
.tile[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent),0 3px 0 var(--edge)}
.tile span{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:5px;font:500 10px var(--font);color:var(--ink);white-space:nowrap}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));
 display:flex;flex-direction:column;gap:6px;pointer-events:none}
.drawer>*{pointer-events:auto}
.now{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.now b{font:700 18px var(--font)}
.now .src{font:400 12px var(--font);color:var(--soft)}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 4px}
.strip::-webkit-scrollbar{display:none}
.genre{display:flex;align-items:center;gap:6px}
.genre i{width:22px;height:22px;border-radius:6px;background-color:var(--bg);background-repeat:no-repeat;flex:none}
.block[aria-pressed="true"] i{background-color:var(--surface)}
.pose{width:78px;height:104px;flex:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:6px 4px 6px;
 background-color:var(--surface);background-repeat:no-repeat;font:500 10.5px/1.15 var(--font);text-align:center;color:var(--ink);white-space:normal}
.pose[aria-pressed="true"]{background-color:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--ink);box-shadow:0 0 0 2px var(--accent),0 3px 0 var(--edge)}
.pose .pic{width:66px;height:66px;border-radius:8px;flex:none;background-repeat:no-repeat}
.pose .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{font:500 9px var(--font);color:var(--soft);margin-top:2px}
#load{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);font:500 14px var(--font);color:var(--soft);z-index:2}
@media (max-width:640px){.title small{display:none}.rail{top:calc(env(safe-area-inset-top,0px) + 56px);gap:20px}.tile{width:46px;height:46px}.pose{width:70px;height:98px}.pose .pic{width:58px;height:58px}}
/* on a dark stage (painted, 80s action) the words over the stage turn light */
body[data-dark] .title,body[data-dark] .tile span,body[data-dark] .now b{color:#fff}
body[data-dark] .title small,body[data-dark] .now .src{color:#d9d2e6}
@media (max-height:760px) and (min-width:641px){.rail{gap:18px}.tile{width:48px;height:48px}}
@media (prefers-reduced-motion:reduce){.block,.tile{transition:none}}
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/loaders/GLTFLoader.js":"/vendor/loaders/GLTFLoader.js","three/addons/controls/OrbitControls.js":"/vendor/OrbitControls.js"}}</script>
</head>
<body>
<canvas id="stage" aria-label="The character on stage. Press on it to pick it up."></canvas>
<iframe class="frame" id="room" hidden title="Character Studio room"></iframe>
<div id="load">Rigging the brute…</div>
<header class="bar">
 <div class="mark" aria-hidden="true">AW</div>
 <div class="title">Character Studio<small>AW-STUDY-0037</small></div>
 <span class="grow"></span>
 <button class="block" data-room="stage" aria-pressed="true">3D</button>
 <button class="block" data-room="puppet.html" aria-pressed="false">2D</button>
 <button class="block" data-room="review.html" aria-pressed="false">Scores</button>
 <button class="block" data-room="crowd.html" aria-pressed="false">Crowd</button>
</header>
<nav class="rail left" id="cast" aria-label="Who"></nav>
<nav class="rail right" id="dirs" aria-label="Art direction"></nav>
<section class="drawer" aria-label="Moves">
 <div class="now"><b id="nowName">Idle</b><span class="src" id="nowSrc"></span><span class="grow"></span>
  <button class="block" id="real" aria-pressed="true" title="Real motion capture where we have it">Real motion</button>
  <button class="block" id="tour" aria-pressed="false">Play all</button></div>
 <div class="strip" id="genres"></div>
 <div class="strip" id="moves"></div>
</section>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {toonify, TOON_LOOKS} from '/simulations/toon-kit.mjs';
import {filmLook} from '/simulations/film-look.mjs';
import {MOVES, GENRES, byId, P} from './moves.mjs';
import {BODIES, loadBody} from './bodies.mjs';
import {DIRECTIONS, dress} from './directions.mjs';
import {loadMocap} from './mocap.mjs';

const $ = s => document.querySelector(s);
const BASE = new URL('./', location.href);
const canvas = $('#stage');
const renderer = new T.WebGLRenderer({canvas, antialias: false});
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.outputColorSpace = T.SRGBColorSpace; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(30, 1, .1, 200);
camera.position.set(3.4, 1.6, 6.2);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, .95, 0); controls.enableDamping = true; controls.maxPolarAngle = 1.5; controls.minDistance = 1.6; controls.maxDistance = 30;

// light: a warm low sun, sky fill and ground bounce; the film look (AW-STUDY-0028) adds contact shadows, air and lens
const hemi = new T.HemisphereLight('#dfe9ff', '#b9906a', 1.1); scene.add(hemi);
const sun = new T.DirectionalLight('#fff1dc', 2.6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left: -5, right: 5, top: 5, bottom: -5, near: .5, far: 30});
sun.shadow.bias = -.0004; sun.shadow.normalBias = .02; sun.shadow.radius = 3;
scene.add(sun, sun.target);
const floor = new T.Mesh(new T.CircleGeometry(40, 96), new T.MeshStandardMaterial({color: '#e3cba8', roughness: .95}));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const box = new T.Mesh(new T.BoxGeometry(.42, .32, .34), new T.MeshStandardMaterial({color: '#c79a62', roughness: .9}));
box.castShadow = true; box.visible = false; scene.add(box);
toonify(T, scene, TOON_LOOKS.sunday);
const film = filmLook(T, renderer, scene, camera, {fogDensity: .02, fogStart: 9, focus: 6, aperture: .7, aoRadius: .3, bloom: .12, threshold: 1.3, sunCol: '#ffd6a0'});

let dir = 'studio', bodyId = 'red', room = 'stage', real = true, tour = false, dressed = null;
let actor = null, move = byId.idle, t0 = performance.now() / 1000;
const loader = new GLTFLoader(), cache = {}, drawing = {value: 0};
let mocap = {};
const active = () => (real && mocap[move.id]) || move;
// the moves on offer: the quality pass cut the ones that didn't hold up next to real motion (moves.mjs CUT)
const LIVE = MOVES.filter(m => !m.cut);

// pictures for the blocks, rendered once by tools/character-studio/thumbs.mjs: one tile per move, in MOVES order
const COLS = 10;
const ROWS = Math.ceil(MOVES.length / COLS);
function sprite(el, i) { // sized by the element, so one sprite serves the 22 px genre icons and the pose tiles
 el.style.backgroundImage = 'url(img/moves.jpg)'; el.style.backgroundSize = `${COLS * 100}% ${ROWS * 100}%`;
 el.style.backgroundPosition = `${(i % COLS) / (COLS - 1) * 100}% ${Math.floor(i / COLS) / (ROWS - 1) * 100}%`;
}
function castBlocks() {
 const el = $('#cast'); el.innerHTML = '';
 for (const b of BODIES.filter(b => !b.hidden)) {
  const t = document.createElement('button'); t.className = 'tile'; t.style.backgroundImage = `url(img/body-${b.id}.jpg)`;
  t.setAttribute('aria-pressed', String(b.id === bodyId)); t.setAttribute('aria-label', b.name); t.innerHTML = `<span>${b.short || b.name}</span>`;
  t.onclick = () => { bodyId = b.id; castBlocks(); setBody(); };
  el.appendChild(t);
 }
}
function dirBlocks() {
 const el = $('#dirs'); el.innerHTML = '';
 for (const d of DIRECTIONS) {
  const t = document.createElement('button'); t.className = 'tile'; t.style.backgroundImage = `url(img/dir-${d.id}.jpg)`;
  t.setAttribute('aria-pressed', String(d.id === dir)); t.setAttribute('aria-label', d.name); t.innerHTML = `<span>${d.short || d.name}</span>`;
  t.onclick = () => { dir = d.id; dirBlocks(); applyDir(); };
  el.appendChild(t);
 }
}
let genre = 'cozy';
function genreBlocks() {
 const el = $('#genres'); el.innerHTML = '';
 for (const g of GENRES.filter(g => LIVE.some(m => m.genre === g.id))) {
  const b = document.createElement('button'); b.className = 'block genre'; b.setAttribute('aria-pressed', String(g.id === genre));
  const i = document.createElement('i'); sprite(i, MOVES.findIndex(m => m.genre === g.id));
  b.append(i, g.name); b.onclick = () => { genre = g.id; genreBlocks(); moveTiles(); };
  el.appendChild(b);
 }
}
function moveTiles() {
 const el = $('#moves'); el.innerHTML = '';
 MOVES.forEach((m, i) => {
  if (m.genre !== genre || m.cut) return;
  const b = document.createElement('button'); b.className = 'block pose'; b.setAttribute('aria-pressed', String(m.id === move.id));
  // the pose picture sits above the name, never under it
  const pic = document.createElement('i'); pic.className = 'pic'; sprite(pic, i); b.appendChild(pic);
  b.insertAdjacentHTML('beforeend', `<span class="nm">${m.name}</span>${real && mocap[m.id] ? `<span class="tag">${mocap[m.id].by === 'quaternius' ? 'game animation' : 'motion capture'}</span>` : ''}`);
  b.onclick = () => pick(m.id);
  el.appendChild(b);
 });
}
function pick(id, keepTour) {
 move = byId[id]; t0 = performance.now() / 1000; dist = 0;
 if (!keepTour) { tour = false; $('#tour').setAttribute('aria-pressed', 'false'); }
 const g = GENRES.find(x => x.id === move.genre), a = active();
 $('#nowName').textContent = move.name;
 $('#nowSrc').textContent = a.by === 'quaternius' ? `Game animation · Quaternius, ${a.source.replace(/_/g, ' ')}` : a.source ? `CMU motion capture · take ${a.source}` : `Hand-keyed · ${g.name}, as in ${g.from}`;
 if (genre !== move.genre) { genre = move.genre; genreBlocks(); }
 moveTiles();
 try { history.replaceState(null, '', '#' + id); } catch {}
}
$('#tour').onclick = () => { tour = !tour; $('#tour').setAttribute('aria-pressed', String(tour)); if (tour) pick(move.id, true); };
$('#real').onclick = () => { real = !real; $('#real').setAttribute('aria-pressed', String(real)); pick(move.id, tour); };
for (const b of document.querySelectorAll('[data-room]')) b.onclick = () => setRoom(b.dataset.room);
function setRoom(r) {
 room = r; document.querySelectorAll('[data-room]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.room === r)));
 const f = $('#room'), stage = r === 'stage';
 f.hidden = stage; ['#cast', '#dirs', '.drawer'].forEach(s => { $(s).hidden = !stage; }); canvas.style.visibility = stage ? 'visible' : 'hidden';
 if (!stage && !f.src.endsWith(r)) f.src = r;
 // the dark-stage words belong to the 3D stage only
 document.body.toggleAttribute('data-room', !stage);
 document.body.toggleAttribute('data-dark', stage && !!dressed?.stage?.dark);
}

// an art direction restyles the body and the stage together
function applyDir() {
 dressed?.undress(); dressed = null;
 if (!actor) return;
 dressed = dir === 'studio' ? null : dress(T, actor, dir, drawing);
 const st = dressed?.stage || {sky: ['#efe4d2'], floor: '#e3cba8', sun: '#fff1dc', sunI: 2.6, hemi: ['#dfe9ff', '#b9906a', 1.1], shadow: true};
 document.body.toggleAttribute('data-dark', !!st.dark && room === 'stage');
 renderer.setClearColor(st.sky[0]); film.U.fogHigh.value.set(st.sky[0]); film.U.fogLow.value.set(st.sky[1] || st.sky[0]);
 floor.material.color.set(st.floor); sun.color.set(st.sun); sun.intensity = st.sunI;
 hemi.color.set(st.hemi[0]); hemi.groundColor.set(st.hemi[1]); hemi.intensity = st.hemi[2]; sun.castShadow = st.shadow;
 film.on.ao = dir !== 'stick'; film.on.dof = dir !== 'stick';
 toonify(T, actor.object, TOON_LOOKS.sunday);
}
async function setBody() {
 $('#load').hidden = false; $('#load').textContent = 'Rigging…';
 const a = cache[bodyId] ||= await loadBody(T, loader, bodyId, BASE);
 dressed?.undress(); dressed = null;
 if (actor) scene.remove(actor.object);
 actor = a; scene.add(actor.object); applyDir(); $('#load').hidden = true;
}

// pick up the doll: press on it and drag; it dangles from your finger, limbs lagging the way you swing it, kicks its
// feet, and when you let go it drops, lands in a crouch and carries on with its move
const hold = {state: null, vel: new T.Vector3(), prev: new T.Vector3(), target: new T.Vector3(), grab: 0, landT: 0, sx: 0, sz: 0};
const ray = new T.Raycaster(), ndc = new T.Vector2(), plane = new T.Plane(), tmp = new T.Vector3(), tmp2 = new T.Vector3();
function pointerAt(e) { const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(ndc, camera); }
canvas.addEventListener('pointerdown', e => {
 if (!actor) return;
 pointerAt(e);
 const hit = ray.intersectObject(actor.object, true)[0];
 if (!hit) return;
 controls.enabled = false; canvas.setPointerCapture(e.pointerId);
 hold.state = 'held'; hold.grab = Math.max(hit.point.y - actor.object.position.y, actor.hip * 1.2);
 plane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new T.Vector3()).negate(), hit.point);
 hold.target.copy(hit.point); hold.prev.copy(actor.object.position); hold.vel.set(0, 0, 0);
});
canvas.addEventListener('pointermove', e => { if (hold.state !== 'held') return; pointerAt(e); ray.ray.intersectPlane(plane, hold.target); });
const letGo = () => { if (hold.state !== 'held') return; hold.state = 'falling'; controls.enabled = true; };
canvas.addEventListener('pointerup', letGo); canvas.addEventListener('pointercancel', letGo);
const R = 2.4;
function holdStep(o, dt, now) {
 if (hold.state === 'held') {
  const want = tmp.copy(hold.target); want.y = Math.max(want.y - hold.grab, .05);
  o.position.lerp(want, Math.min(1, dt * 14));
 } else if (hold.state === 'falling') {
  hold.vel.y -= 9.8 * dt; o.position.addScaledVector(hold.vel, dt);
  if (o.position.y <= 0) { o.position.y = 0; hold.state = 'landing'; hold.landT = now; }
 } else if (hold.state === 'landing' && now - hold.landT > .45) {
  hold.state = null; t0 = now; dist = Math.atan2(o.position.x, o.position.z) * R;
 }
 if (hold.state !== 'falling') { hold.vel.copy(o.position).sub(hold.prev).divideScalar(Math.max(dt, 1e-3)); hold.vel.y = Math.max(hold.vel.y, 0); }
 hold.prev.copy(o.position);
 const lv = hold.vel.clone().applyQuaternion(o.quaternion.clone().invert());
 hold.sx = T.MathUtils.clamp(hold.sx * .9 + lv.z * 8, -55, 55); hold.sz = T.MathUtils.clamp(hold.sz * .9 + lv.x * 8, -55, 55);
}
const LR = (b, v) => ({[b + '_L']: v, [b + '_R']: v});
function holdPose(now) {
 const k = Math.sin(now * 7), sx = hold.sx, sz = hold.sz;
 if (hold.state === 'landing') return P({...LR('thigh', [-50, 0, 8]), ...LR('shin', [90, 0, 0]), ...LR('foot', [-36, 0, 0]), spine: [24, 0, 0], ...LR('upperarm', [-30, 0, 30]), ...LR('forearm', [-40, 0, 0])});
 return P({thigh_L: [sx + 14 * k, 0, 4 - sz * .5], thigh_R: [sx - 14 * k, 0, 4 + sz * .5], shin_L: [26 + 16 * Math.max(0, k), 0, 0], shin_R: [26 + 16 * Math.max(0, -k), 0, 0],
  ...LR('foot', [30, 0, 0]), upperarm_L: [sx * .8 - 10, 0, 40 - sz * .4 + 10 * k], upperarm_R: [sx * .8 - 10, 0, 40 + sz * .4 - 10 * k], ...LR('forearm', [-30, 0, 0]),
  spine: [-sx * .2, 0, sz * .15], head: [-14, 10 * k, 0], turn: [-sx * .25, 0, sz * .25]});
}

function resize() {
 const w = innerWidth, h = innerHeight, q = Math.min(devicePixelRatio, 2);
 renderer.setPixelRatio(q); renderer.setSize(w, h, false); film.setSize(w, h, q);
 camera.aspect = w / h; camera.fov = w < h ? 44 : 30; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let freeze = null, dist = 0, last = performance.now() / 1000, plain = false;
function frame() {
 requestAnimationFrame(frame);
 if (room !== 'stage') return;
 const now = performance.now() / 1000, dt = Math.min(.05, now - last); last = now;
 const fps = dressed?.fps || 0, raw = freeze ?? now - t0;
 const t = fps ? Math.floor(raw * fps) / fps : raw;
 drawing.value = fps ? Math.floor(now * fps) % 1000 : 0;
 const a = active();
 if (tour && t > Math.max(a.len * (a.travel ? 2 : 1), 2.5)) { const i = LIVE.indexOf(move); pick(LIVE[(i + 1) % LIVE.length].id, true); }
 if (actor) {
  const o = actor.object;
  if (hold.state) actor.pose(holdPose(now)); else actor.play(a, t);
  if (hold.state) holdStep(o, dt, now);
  else if (a.travel) {
   if (freeze == null) dist += dt * (a.speed || a.fn.speed || 1) * actor.hip;
   const ang = dist / R; o.position.set(Math.sin(ang) * R, 0, Math.cos(ang) * R); o.rotation.y = ang + Math.PI / 2;
  } else o.rotation.y += (0 - o.rotation.y) * .08;
  // the camera keeps the body, not its spot on the floor, in view: one-shot captures can step a metre or two
  if (a.travel) tmp2.set(o.position.x * .6, actor.hip * 1.05, o.position.z * .6);
  else { actor.rig.bones.hips.getWorldPosition(tmp2); tmp2.y = actor.hip * 1.05; }
  controls.target.lerp(tmp2, .06);
  film.U.focus.value = camera.position.distanceTo(o.position);
  box.visible = move.prop === 'box' && !hold.state;
  if (box.visible) {
   const l = actor.rig.bones.hand_L.getWorldPosition(new T.Vector3()), r = actor.rig.bones.hand_R.getWorldPosition(new T.Vector3());
   box.position.copy(l).add(r).multiplyScalar(.5); box.position.y += .02; box.rotation.y = o.rotation.y;
  }
 }
 dressed?.update(camera, drawing.value + Math.floor(t * 1000));
 sun.position.set(controls.target.x + 4, 6, controls.target.z + 5); sun.target.position.copy(controls.target);
 film.U.sunDir.value.copy(sun.position).sub(sun.target.position).normalize();
 controls.update();
 if (plain) { renderer.setRenderTarget(null); renderer.render(scene, camera); } else film.render();
}
