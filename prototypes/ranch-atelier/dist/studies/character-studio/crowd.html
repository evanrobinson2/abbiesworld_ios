<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Golden Hour Promenade</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* AW-STUDY-0037 Character Studio, the crowd: townsfolk walking a square at golden hour, seen through a long lens. */
:root{--ink:#3a2618;--glass:rgba(255,246,232,.55);--rim:rgba(255,255,255,.7);--accent:#e2557a}
html,body{height:100%;margin:0;background:#f2c48e;overflow:hidden;font:600 13px/1 'Nunito Sans',system-ui,sans-serif;color:var(--ink)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:6px;padding:6px;border-radius:999px;
 background:linear-gradient(160deg,rgba(255,255,255,.4),transparent 60%),var(--glass);border:1px solid var(--rim);box-shadow:0 8px 24px rgba(80,40,20,.2);max-width:calc(100vw - 32px);overflow-x:auto}
button{font:inherit;color:inherit;background:rgba(255,255,255,.5);border:1px solid var(--rim);border-radius:999px;padding:8px 12px;cursor:pointer;white-space:nowrap}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/loaders/GLTFLoader.js":"/vendor/loaders/GLTFLoader.js","three/addons/controls/OrbitControls.js":"/vendor/OrbitControls.js"}}</script>
</head>
<body>
<canvas id="c" aria-label="Townsfolk walking a square at golden hour"></canvas>
<div class="dock" id="dock"></div>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {toonify, TOON_LOOKS} from '/simulations/toon-kit.mjs';
import {gait, byId} from './moves.mjs';
import {loadBody} from './bodies.mjs';
import {dress} from './directions.mjs';

T.Cache.enabled = true;
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({canvas, antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.outputColorSpace = T.SRGBColorSpace; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
const scene = new T.Scene();
const HAZE = new T.Color('#f0c79a');
scene.fog = new T.FogExp2(HAZE, .018);

// sky: a gradient dome, warm at the horizon where the sun sits, cooler overhead
const sky = new T.Mesh(new T.SphereGeometry(400, 32, 16), new T.ShaderMaterial({side: T.BackSide, depthWrite: false, fog: false,
 uniforms: {top: {value: new T.Color('#8fb4e0')}, mid: {value: new T.Color('#f6c99a')}, sunDir: {value: new T.Vector3()}},
 vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
 fragmentShader: `uniform vec3 top, mid, sunDir; varying vec3 vD;
  void main(){ float h = clamp(vD.y, 0., 1.); vec3 c = mix(mid, top, pow(h, .6));
   float s = max(dot(normalize(vD), normalize(sunDir)), 0.); c += vec3(1., .72, .4) * (pow(s, 40.) * 1.2 + pow(s, 6.) * .25);
   gl_FragColor = vec4(c, 1.);
   #include <colorspace_fragment>
  }`}));
scene.add(sky);

// low sun from the west: long shadows across the square
const sunDir = new T.Vector3(-.75, .3, .45).normalize();
sky.material.uniforms.sunDir.value.copy(sunDir);
const sun = new T.DirectionalLight('#ffbd7a', 3.4); sun.position.copy(sunDir).multiplyScalar(40); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, {left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 90});
sun.shadow.bias = -.0003; sun.shadow.normalBias = .03; sun.shadow.radius = 3;
scene.add(sun);
scene.add(new T.HemisphereLight('#9cc0ea', '#a8754a', 1.15));

// the square: warm cobbles inside a ring of grass, painted on a canvas so it costs one texture
function paint(w, draw, repeat) {
 const c = document.createElement('canvas'); c.width = c.height = w; draw(c.getContext('2d'), w);
 const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(repeat, repeat); t.colorSpace = T.SRGBColorSpace; t.anisotropy = 8; return t;
}
const cobble = paint(512, (g, w) => {
 g.fillStyle = '#b8977a'; g.fillRect(0, 0, w, w);
 for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
  const o = (y % 2) * 16, l = 58 + Math.random() * 14;
  g.fillStyle = `hsl(${24 + Math.random() * 10},${22 + Math.random() * 10}%,${l}%)`;
  g.beginPath(); g.roundRect(x * 32 + o + 2, y * 32 + 2, 28, 28, 7); g.fill();
 }
}, 14);
const ground = new T.Mesh(new T.CircleGeometry(19, 96), new T.MeshStandardMaterial({map: cobble, roughness: .95}));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grass = new T.Mesh(new T.RingGeometry(19, 140, 96, 1), new T.MeshStandardMaterial({color: '#8fae5a', roughness: 1}));
grass.rotation.x = -Math.PI / 2; grass.position.y = -.005; grass.receiveShadow = true; scene.add(grass);
const kerb = new T.Mesh(new T.TorusGeometry(19, .12, 6, 96), new T.MeshStandardMaterial({color: '#d9c3a2', roughness: .9}));
kerb.rotation.x = -Math.PI / 2; kerb.receiveShadow = kerb.castShadow = true; scene.add(kerb);

// a fountain in the middle and trees round the edge, for scale
const stone = new T.MeshStandardMaterial({color: '#e2cfb2', roughness: .85});
const basin = new T.Mesh(new T.CylinderGeometry(2.6, 2.8, .55, 40), stone); basin.position.y = .27; basin.castShadow = basin.receiveShadow = true; scene.add(basin);
const water = new T.Mesh(new T.CircleGeometry(2.35, 40), new T.MeshStandardMaterial({color: '#5fa8c8', roughness: .15, metalness: .1}));
water.rotation.x = -Math.PI / 2; water.position.y = .5; scene.add(water);
const column = new T.Mesh(new T.CylinderGeometry(.25, .35, 1.8, 16), stone); column.position.y = 1.2; column.castShadow = true; scene.add(column);
const bowl = new T.Mesh(new T.CylinderGeometry(.9, .3, .35, 24), stone); bowl.position.y = 2.1; bowl.castShadow = true; scene.add(bowl);
const leaf = [new T.MeshStandardMaterial({color: '#6f9a45', roughness: .9, flatShading: true}), new T.MeshStandardMaterial({color: '#c98a3a', roughness: .9, flatShading: true}),
 new T.MeshStandardMaterial({color: '#8fae4a', roughness: .9, flatShading: true})];
const bark = new T.MeshStandardMaterial({color: '#6b4a32', roughness: 1});
for (let i = 0; i < 26; i++) {
 const a = i / 26 * Math.PI * 2 + Math.sin(i * 7.1) * .08, r = 21.5 + Math.sin(i * 3.3) * 1.5, s = .8 + (Math.sin(i * 5.7) * .5 + .5) * .7;
 const tree = new T.Group(); tree.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
 const trunk = new T.Mesh(new T.CylinderGeometry(.12 * s, .2 * s, 2.4 * s, 7), bark); trunk.position.y = 1.2 * s;
 const crown = new T.Mesh(new T.IcosahedronGeometry(1.5 * s, 1), leaf[i % 3]); crown.position.y = 3.1 * s; crown.scale.y = 1.15;
 for (const m of [trunk, crown]) { m.castShadow = m.receiveShadow = true; tree.add(m); }
 scene.add(tree);
}
toonify(T, scene, TOON_LOOKS.sunday);

// the townsfolk: each walks its own lane round the square, with its own pace, stride and arm swing
const camera = new T.PerspectiveCamera(22, 1, .5, 900);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, .9, 0); controls.enableDamping = true; controls.maxPolarAngle = 1.48; controls.minDistance = 4; controls.maxDistance = 120;
camera.position.set(34, 9, 30);
const loader = new GLTFLoader(), drawing = {value: 0}, folk = [];
const rnd = (i, k) => (Math.sin(i * 12.9898 + k * 78.233) * 43758.5453 % 1 + 1) % 1;
const CAST = [];
for (let i = 0; i < 26; i++) {
 const body = i % 9 === 4 ? 'red' : i % 9 === 8 ? 'blue' : i % 3 === 0 ? 'smooth' : 'mannequin';
 const kind = i % 11 === 5 ? 'carry' : i % 13 === 7 ? 'jog' : 'walk';
 CAST.push({i, body, kind, lane: 4.2 + (i % 7) * 1.85 + rnd(i, 1) * .5, dir: i % 2 ? 1 : -1, phase: rnd(i, 2) * Math.PI * 2});
}
function makeGait(c) {
 const r = k => rnd(c.i, k);
 if (c.kind === 'jog') return gait({len: .7 + r(3) * .08, stride: 36, knee: 85, arm: 34, elbow: 80, bounce: .045, lean: 9, twist: 8});
 if (c.kind === 'carry') return byId.carry.fn;
 return gait({len: .98 + r(3) * .3, stride: 20 + r(4) * 8, knee: 38 + r(5) * 10, arm: 12 + r(6) * 14, elbow: 14 + r(7) * 16, lean: r(8) * 6 - 1, twist: 4 + r(9) * 5, sway: 1 + r(10) * 3});
}
const LOOKS = [{id: 'village', name: 'Plasticine village'}, {id: 'clay', name: 'Claymation'}, {id: 'comic', name: '80s action'}, {id: 'studio', name: 'As built'}, {id: 'stick', name: 'Stick figures'}];
let look = new URLSearchParams(location.search).get('look') || 'village';
const tint = (o, i) => o.traverse(m => { if (m.isMesh && !m.userData.ink && m.material?.color && !m.userData.dress) m.material.color.offsetHSL((rnd(i, 11) - .5) * .12, (rnd(i, 12) - .5) * .2, (rnd(i, 13) - .5) * .12); });
function restyle() {
 for (const f of folk) {
  f.dressed?.undress(); f.dressed = look === 'studio' ? null : dress(T, f.actor, look, drawing);
  if (look !== 'stick' && look !== 'studio') tint(f.actor.object, f.c.i);
 }
 toonify(T, scene, TOON_LOOKS.sunday);
 const dock = document.getElementById('dock'); [...dock.children].forEach((b, i) => b.setAttribute('aria-pressed', String(LOOKS[i].id === look)));
}
for (const L of LOOKS) {
 const b = document.createElement('button'); b.textContent = L.name; b.onclick = () => { look = L.id; restyle(); };
 document.getElementById('dock').appendChild(b);
}
(async () => {
 for (const c of CAST) {
  const actor = await loadBody(T, loader, c.body, new URL('./', location.href));
  const box = new T.Mesh(new T.BoxGeometry(.4, .3, .32), new T.MeshStandardMaterial({color: '#c79a62', roughness: .9}));
  box.castShadow = true; box.visible = c.kind === 'carry'; scene.add(box);
  scene.add(actor.object);
  const g = makeGait(c);
  folk.push({c, actor, move: {fn: g, speed: g.speed}, box, s: c.phase * c.lane});
  if (folk.length % 6 === 0 || folk.length === CAST.length) restyle();
 }
})();

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < innerHeight ? 34 : 22; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now() / 1000, idle = 0;
controls.addEventListener('start', () => { idle = -6; });
const v = new T.Vector3(), w = new T.Vector3();
function frame() {
 requestAnimationFrame(frame);
 const now = performance.now() / 1000, dt = Math.min(.05, now - last); last = now;
 drawing.value = Math.floor(now * 12) % 1000;
 for (const f of folk) {
  const {c, actor, move} = f, sp = (move.speed ?? 1.5) * actor.hip;
  f.s += dt * sp;
  const a = c.dir * f.s / c.lane + c.phase;
  actor.object.position.set(Math.cos(a) * c.lane, 0, Math.sin(a) * c.lane);
  actor.object.rotation.y = -a + (c.dir > 0 ? 0 : Math.PI);
  const t = f.s / sp + c.phase;
  const fps = f.dressed?.fps === 12 && look !== 'village' ? 12 : 0;
  actor.play(move, fps ? Math.floor(t * fps) / fps : t);
  f.dressed?.update(camera, drawing.value + f.c.i * 31);
  if (f.box.visible) { actor.rig.bones.hand_L.getWorldPosition(v); actor.rig.bones.hand_R.getWorldPosition(w); f.box.position.copy(v).add(w).multiplyScalar(.5); f.box.rotation.y = actor.object.rotation.y; }
 }
 // a slow crane round the square until someone takes the camera
 idle += dt;
 if (idle > 0) { const ang = Math.atan2(camera.position.z, camera.position.x) + dt * .025, d = Math.hypot(camera.position.x, camera.position.z); camera.position.x = Math.cos(ang) * d; camera.position.z = Math.sin(ang) * d; }
 controls.update(); renderer.render(scene, camera);
}
frame();
window.crowd = {camera, controls, folk, setLook: id => { look = id; restyle(); }};
</script>
</body>
</html>
