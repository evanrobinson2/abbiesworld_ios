<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studies</title>
<link rel="stylesheet" href="/app-style.css?v=1">
<style>
/* Studies mini-app: study list on the left, the open study on the right. Each study is its own page in an iframe, so its styles stay its own. */
:root{--rail:268px}
html,body{margin:0;height:100%;overflow:hidden;background:var(--app-canvas,#f4edcf)}
body{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:100dvh;overflow:hidden}
nav{background:var(--app-paper);border-right:1px solid var(--app-border);display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.top h1{margin:0;font-size:24px}
.back{margin-left:auto;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--app-ink);border:1px solid var(--app-border);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;background:#fff}
.back:hover{border-color:var(--app-accent);color:var(--app-accent)}
.list{overflow-y:auto;padding:4px 10px 24px;flex:1}
.group{margin-top:14px}
.group>b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--app-muted);padding:0 8px 6px}
.list a{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:7px 8px;border-radius:12px;text-decoration:none;color:var(--app-ink);transition:background-color .12s}
.list a:hover{background:#0000000a}
.list a[aria-current=true]{background:var(--app-accent);color:var(--app-on-accent,#fffdf4)}
.list a[aria-current=true] small{color:inherit;opacity:.85}
.list img{width:44px;height:44px;object-fit:cover;border-radius:9px;background:#fff;border:1px solid var(--app-border)}
.list span{display:grid;min-width:0}
.list strong{font-size:14px;line-height:1.25}
.list small{font-size:12px;color:var(--app-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{position:relative;min-width:0;min-height:0}
iframe{border:0;width:100%;height:100%;display:block;background:#fff}
.menu{display:none}
@media (max-width:760px){
 body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 nav{border-right:0;border-bottom:1px solid var(--app-border)}
 .list{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:0 12px 12px}
 .group{margin:0;display:contents}.group>b{display:none}
 .list a{grid-template-columns:32px auto;flex:none;padding:6px 10px 6px 6px;border:1px solid var(--app-border);background:#fff}
 .list img{width:32px;height:32px}.list small{display:none}
 .top{padding:12px 16px 10px}
}
</style>
</head>
<body>
<nav aria-label="Studies">
 <div class="top"><h1>Studies</h1><a class="back" href="https://abbies.world/">&larr; Back to ranch</a></div>
 <div class="list" id="list"></div>
</nav>
<main><iframe id="view" title="Study"></iframe></main>
<script>
const GROUPS=[
 ['Roman paper warrior',[
  ['overview','Overview','Where the warrior stands','warrior/index.html','warrior/img/proof_c.jpg'],
  ['round1','Round 1','Fit the image','warrior/index.html#round1','warrior/img/master.jpg'],
  ['round2','Round 2','Keep the style','warrior/index.html#round2','warrior/img/abc_torso.jpg'],
  ['round3','Round 3','Three views','warrior/index.html#round3','warrior/img/r3_spin_sheet.jpg'],
  ['props','Props and kit','How the parts were fitted','warrior/index.html#offshoots','warrior/img/kit_exploded.jpg'],
  ['props3d','Five props in 3D','Turn and zoom each prop, next to its image','/models','img/props-cuirass.png'],
  ['bodies','Paper bodies','The bodies under the kit, in 3D','bodies/index.html','bodies/thumb.jpg'],
 ]],
 ['Helmet',[
  ['helmet','Paper helmet','Same camera, loss and crops','helmet/index.html','helmet/C.jpg'],
  ['ridge','Ridge helmet','Late-Roman helmet for Fritigern','helmet/index.html#ridge','helmet/ridge.jpg'],
 ]],
 ['Models',[
  ['atelier','Atelier pack','Trees, rocks and props, before and after','atelier/index.html','atelier/img/after-z.jpg'],
 ]],
];
const list=document.getElementById('list'),view=document.getElementById('view'),links={};
for(const [name,items] of GROUPS){const g=document.createElement('div');g.className='group';g.innerHTML='<b>'+name+'</b>';
 for(const [id,title,sub,src,thumb] of items){const a=document.createElement('a');a.href='#'+id;a.dataset.src=src;
  a.innerHTML='<img alt="" loading="lazy" src="'+thumb+'"><span><strong>'+title+'</strong><small>'+sub+'</small></span>';links[id]=a;g.appendChild(a);}
 list.appendChild(g);}
function open(){const id=links[location.hash.slice(1)]?location.hash.slice(1):'overview',a=links[id];
 for(const k in links)links[k].setAttribute('aria-current',k===id);
 if(view.dataset.src!==a.dataset.src){view.dataset.src=a.dataset.src;view.src=a.dataset.src;}
 const r=a.getBoundingClientRect(),l=list.getBoundingClientRect();
 list.scrollLeft+=r.left<l.left||r.right>l.right?r.left-l.left-12:0;
 list.scrollTop+=r.top<l.top||r.bottom>l.bottom?r.top-l.top-12:0;}
addEventListener('hashchange',open);open();
</script>
<script src="/version-chip.js?v=1" defer></script>
</body>
</html>
