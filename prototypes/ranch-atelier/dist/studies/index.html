<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studies</title>
<script src="/theme/boot.js?v=1"></script>
<link rel="stylesheet" href="/look/context-card.css?v=1">
<style>
/* Studies, a small app (docs/design/look/LOOK.md, "Studies"). The list on the left and the details on the right can each
   be hidden ([ and ]) and dragged wider; both remember. Home shows Recent, Trending and Most impactful. Each study is its
   own page in a frame and reads the same theme tokens (theme/boot.js), so the whole app is one style. */
:root{--l:280px;--r:300px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--aw-bg);color:var(--aw-ink);font:15px/1.45 var(--aw-font)}
body{display:grid;grid-template-columns:var(--l) 0 minmax(0,1fr) 0 var(--r);height:100dvh}
body.l-off{--l:0px}body.r-off{--r:0px}
body.drag{user-select:none;cursor:col-resize}body.drag iframe{pointer-events:none}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--aw-surface);overflow:hidden}
#left{border-right:1px solid var(--aw-line)}#right{border-left:1px solid var(--aw-line)}
body.l-off #left,body.r-off #right{visibility:hidden;border:0}
.bar{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 16px;min-height:60px}
.bar h1{margin:0;font:600 22px/1 var(--aw-display);flex:1;min-width:0}
.bar h1 a{color:inherit;text-decoration:none}
.bar h2{margin:0;font:600 13px/1 var(--aw-font);letter-spacing:.07em;text-transform:uppercase;color:var(--aw-soft);flex:1}
.ib{all:unset;box-sizing:border-box;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--aw-soft);flex:none}
.ib:hover{background:color-mix(in srgb,var(--aw-ink) 8%,transparent);color:var(--aw-ink)}
.ib:focus-visible{outline:2px solid var(--aw-accent)}
.ib svg{width:20px;height:20px}
.list{overflow-y:auto;padding:0 10px 16px;flex:1}
.group{margin-top:14px}
.group>b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--aw-soft);padding:0 8px 6px}
.list a{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:7px 8px;border-radius:12px;text-decoration:none;color:var(--aw-ink)}
.list a:hover{background:color-mix(in srgb,var(--aw-ink) 6%,transparent)}
.list a[aria-current=true]{background:var(--aw-accent);color:var(--aw-on-accent)}
.list a[aria-current=true] small{color:inherit;opacity:.85}
.list a.home{grid-template-columns:44px 1fr;font-weight:600}
.list a.home i{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--aw-accent) 14%,transparent);color:var(--aw-accent)}
.list a.home[aria-current=true] i{background:color-mix(in srgb,var(--aw-on-accent) 22%,transparent);color:inherit}
.list img{width:44px;height:44px;object-fit:contain;border-radius:10px;background:var(--aw-raised);border:1px solid var(--aw-line)}
.list span{display:grid;min-width:0}
.list strong{font-size:14px;line-height:1.25;font-weight:600}
.list small{font-size:12px;color:var(--aw-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--aw-line)}
.me span{display:grid;min-width:0;flex:1}.me b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:var(--aw-soft);font-size:12px}
.me .aw-me{padding:0}
.grip{position:relative;z-index:5;cursor:col-resize;touch-action:none}
.grip::before{content:"";position:absolute;inset:0 -5px}
.grip:hover::after,.grip:focus-visible::after,body.drag .grip.on::after{content:"";position:absolute;top:0;bottom:0;left:-1.5px;width:3px;background:var(--aw-accent);border-radius:2px}
.grip:focus-visible{outline:none}
body.l-off #gl,body.r-off #gr{pointer-events:none}
main{position:relative;min-width:0;min-height:0;box-sizing:border-box}
/* the show buttons sit in gutters beside the study, never over it */
body.l-off main{padding-left:60px}body.r-off main{padding-right:60px}
body.l-off #home{left:60px}body.r-off #home{right:60px}
iframe{border:0;width:100%;height:100%;display:block;background:var(--aw-bg)}
iframe[hidden]{display:none}
.float{position:absolute;top:12px;z-index:4;display:none;gap:6px;padding:4px;border-radius:16px;border:1px solid var(--aw-rim);
  background:linear-gradient(160deg,rgba(255,255,255,.25),transparent 50%),var(--aw-glass);-webkit-backdrop-filter:blur(12px) saturate(1.6);backdrop-filter:blur(12px) saturate(1.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 20px -10px rgba(0,0,0,.4)}
#fl{left:6px}#fr{right:6px}
body.l-off #fl,body.r-off #fr{display:flex}
/* home */
#home{position:absolute;inset:0;z-index:1;background:var(--aw-bg);overflow:auto;padding:36px clamp(16px,4vw,48px) 60px}
#home[hidden]{display:none}
#home header{max-width:1100px;margin:0 auto 8px}
#home h1{margin:0;font:600 clamp(30px,5vw,46px)/1.05 var(--aw-display)}
#home header p{margin:8px 0 0;color:var(--aw-soft);max-width:60ch}
.row{max-width:1100px;margin:30px auto 0}
.row h2{margin:0 0 4px;font:600 22px/1.2 var(--aw-display)}
.row>p{margin:0 0 12px;color:var(--aw-soft);font-size:14px}
.cards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,300px);gap:16px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity}
.card{display:grid;gap:8px;text-decoration:none;color:var(--aw-ink);background:var(--aw-surface);border:1px solid var(--aw-line);border-radius:var(--aw-radius);
  overflow:hidden;box-shadow:var(--aw-shadow);scroll-snap-align:start;transition:transform .14s}
.card:hover{transform:translateY(-3px)}
.card:focus-visible{outline:3px solid var(--aw-accent);outline-offset:2px}
.card img{width:100%;aspect-ratio:16/10;object-fit:contain;display:block;background:var(--aw-raised)}
.card div{padding:2px 14px 14px;display:grid;gap:4px}
.card b{font:600 17px/1.2 var(--aw-display)}
.card small{color:var(--aw-soft);font-size:13px}
.card em{font-style:normal;font-size:13px;line-height:1.35}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--aw-ink) 8%,transparent);color:var(--aw-soft)}
.chip.go{background:var(--aw-accent);color:var(--aw-on-accent)}
.chip.new{background:var(--aw-accent2);color:#fff}
/* the outcome toolbar: a glass object under the study, Read or Dismiss */
.outcome{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;
  border:1px solid var(--aw-rim);background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 50%),var(--aw-glass);-webkit-backdrop-filter:blur(14px) saturate(1.7);backdrop-filter:blur(14px) saturate(1.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -2px 3px rgba(0,0,0,.1),0 12px 28px -12px rgba(0,0,0,.45)}
.outcome[hidden]{display:none}
.outcome button{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--aw-ink);
  background:color-mix(in srgb,var(--aw-surface) 55%,transparent);border:1px solid var(--aw-line)}
.outcome button svg{width:20px;height:20px}
.outcome .ok{background:var(--aw-accent);color:var(--aw-on-accent);border-color:transparent}
.outcome .go{background:var(--aw-ink);color:var(--aw-bg);border-color:transparent}
.outcome button:hover{filter:brightness(1.06)}.outcome button:active{transform:scale(.97)}
.outcome button:focus-visible{outline:2px solid var(--aw-accent);outline-offset:2px}
.outcome .said{padding:0 8px 0 14px;font-weight:600;font-size:14px}
.list details.done summary{list-style:none;cursor:pointer}.list details.done summary::-webkit-details-marker{display:none}
.list details.done summary b::after{content:" \u203a";display:inline-block;transition:transform .15s}.list details.done[open] summary b::after{transform:rotate(90deg)}
.list details.done a{opacity:.75}
/* read and unread: a dot and bold title until you open it (or mark it unread again) */
.list a .dot,.card .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--aw-accent);margin-right:6px;vertical-align:middle;flex:none}
.list a.unread strong{font-weight:800}
.list a:not(.unread) strong{font-weight:500}
/* right panel tabs */
.tabs{display:flex;gap:4px;flex:1;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--aw-ink) 6%,transparent)}
.tabs button{all:unset;flex:1;text-align:center;padding:7px 10px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--aw-soft)}
.tabs button[aria-selected=true]{background:var(--aw-surface);color:var(--aw-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs button:focus-visible{outline:2px solid var(--aw-accent)}
.tabs i{font-style:normal;margin-left:6px;font-size:11px;padding:1px 6px;border-radius:9px;background:var(--aw-accent);color:var(--aw-on-accent)}
.tabs i:empty{display:none}
[role=tabpanel][hidden]{display:none!important}
/* the notes app: write, keep, send to the study's thread, ask for a review */
.notes,.ctxp{overflow-y:auto;padding:0 16px 20px;flex:1;display:grid;align-content:start;gap:12px}
.ctxp h3{margin:0;font:600 17px/1.2 var(--aw-display)}.ctxp .to{font-size:13px;color:var(--aw-soft)}
.notes h3{margin:0;font:600 17px/1.2 var(--aw-display)}
.notes .to{font-size:12px;color:var(--aw-soft)}
.notes textarea{box-sizing:border-box;width:100%;min-height:96px;resize:vertical;padding:10px 12px;border-radius:14px;border:1px solid var(--aw-line);background:var(--aw-bg);color:var(--aw-ink);font:15px/1.4 var(--aw-font)}
.notes textarea:focus{outline:2px solid var(--aw-accent);outline-offset:0;border-color:transparent}
.notes .acts{display:flex;flex-wrap:wrap;gap:6px}
.notes .acts button,.links a,.links button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;font-weight:600;font-size:13px;border:1px solid var(--aw-line);background:color-mix(in srgb,var(--aw-surface) 70%,transparent);color:var(--aw-ink)}
.notes .acts .primary{background:var(--aw-accent);color:var(--aw-on-accent);border-color:transparent}
.notes .acts button:disabled{opacity:.45;cursor:default}
.notes .acts button:focus-visible,.links a:focus-visible,.links button:focus-visible{outline:2px solid var(--aw-accent);outline-offset:2px}
.notes ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.notes li{padding:10px 12px;border-radius:12px;background:var(--aw-bg);border:1px solid var(--aw-line);font-size:14px;display:grid;gap:4px}
.notes li p{margin:0;white-space:pre-wrap;color:var(--aw-ink)}
.notes li small{display:flex;gap:8px;align-items:center;color:var(--aw-soft);font-size:12px}
.notes li small b{font-weight:600;color:var(--aw-accent)}
.notes li small button{all:unset;cursor:pointer;margin-left:auto;padding:2px 6px;border-radius:6px}
.notes li small button:hover{background:color-mix(in srgb,var(--aw-ink) 7%,transparent)}
.notes .status{font-size:13px;color:var(--aw-soft);min-height:1.2em}
.links{display:flex;flex-wrap:wrap;gap:6px}
.chain{display:flex;gap:6px}
.chain a{flex:1;justify-content:center}
/* details */
.facets{overflow-y:auto;padding:0 16px 20px;flex:1;display:grid;align-content:start;gap:16px}
.facets img.hero{width:100%;aspect-ratio:16/10;object-fit:contain;border-radius:14px;border:1px solid var(--aw-line);background:var(--aw-raised)}
.facets h3{margin:0;font:600 19px/1.2 var(--aw-display)}
.facets dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.facets dt{color:var(--aw-soft)}.facets dd{margin:0;min-width:0}
.facets p{margin:0;font-size:14px;color:var(--aw-soft)}
.facets h4{margin:0 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--aw-soft)}
.toc{display:grid;gap:2px}
.toc button{all:unset;cursor:pointer;padding:6px 8px;border-radius:9px;font-size:14px}
.toc button:hover{background:color-mix(in srgb,var(--aw-ink) 6%,transparent)}
.toc button:focus-visible{outline:2px solid var(--aw-accent)}
.wait{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--aw-accent) 12%,transparent);font-size:14px}
.wait b{display:block}
.open{color:var(--aw-accent);font-weight:600;text-decoration:none;font-size:14px}
@media (max-width:760px){
 body{grid-template-columns:minmax(0,1fr)}
 .grip{display:none}
 .side{position:fixed;top:0;bottom:0;z-index:20;width:min(86vw,340px);box-shadow:0 0 40px rgba(0,0,0,.3)}
 #left{left:0}#right{right:0}
 main{grid-column:1;grid-row:1;height:100dvh;padding:52px 0 0!important}
 #home{left:0!important;right:0!important;top:52px}
 .float{top:4px}#fl{left:8px}#fr{right:8px}
 body.l-off #fl,body.r-off #fr{display:flex}
}
</style>
</head>

 <nav class="list" id="list"></nav>
 <div class="me" id="me"><span><b id="me-name">You</b><small id="me-style"></small></span></div>

const body = document.body, P = Object.assign({l: 280, r: 300, lOff: false, rOff: false}, store('aw-studies-panels') || {});
const phone = matchMedia('(max-width:760px)');
function layout(){
 // A hidden panel gives its width back to the middle; only a slim gutter for its show button stays.
 const lOff = phone.matches ? !P.lPhone : P.lOff, rOff = phone.matches ? !P.rPhone : P.rOff;
 body.style.setProperty('--l', (lOff ? 0 : P.l) + 'px'); body.style.setProperty('--r', (rOff ? 0 : P.r) + 'px');
 body.classList.toggle('l-off', lOff); body.classList.toggle('r-off', rOff);
}
const keep = () => store('aw-studies-panels', {l: P.l, r: P.r, lOff: P.lOff, rOff: P.rOff});
function toggle(side, on){
 if (phone.matches){ const k = side + 'Phone'; P[k] = on ?? !P[k]; if (P[k]) P[side === 'l' ? 'rPhone' : 'lPhone'] = false; }
 else { const k = side + 'Off'; P[k] = on === undefined ? !P[k] : !on; keep(); }
 layout();
}
phone.addEventListener('change', layout);
document.getElementById('hide-l').onclick = () => toggle('l', false);
document.getElementById('show-l').onclick = () => toggle('l', true);
document.getElementById('hide-r').onclick = () => toggle('r', false);
document.getElementById('show-r').onclick = () => toggle('r', true);
function grip(el, side){
 const lim = side === 'l' ? [200, 480] : [240, 560];
 el.addEventListener('pointerdown', e => {
  e.preventDefault(); el.setPointerCapture(e.pointerId); body.classList.add('drag'); el.classList.add('on');
  const move = ev => { P[side] = Math.round(Math.min(lim[1], Math.max(lim[0], side === 'l' ? ev.clientX : innerWidth - ev.clientX))); layout(); };
  const up = () => { el.removeEventListener('pointermove', move); body.classList.remove('drag'); el.classList.remove('on'); keep(); };
  el.addEventListener('pointermove', move); el.addEventListener('pointerup', up, {once: true}); el.addEventListener('pointercancel', up, {once: true});
 });
 el.addEventListener('dblclick', () => toggle(side, false));
 el.addEventListener('keydown', e => {
  const d = {ArrowLeft: -16, ArrowRight: 16}[e.key]; if (!d) return;
  e.preventDefault(); P[side] = Math.min(lim[1], Math.max(lim[0], P[side] + (side === 'l' ? d : -d))); layout(); keep();
 });
}

function keys(e){
 if (e.target.closest?.('input,textarea,select,[contenteditable=true]') || e.metaKey || e.ctrlKey || e.altKey) return;
 if (e.key === '[') { e.preventDefault(); toggle('l'); } else if (e.key === ']') { e.preventDefault(); toggle('r'); }
}

const DESIGN = {th: 'cmsg_01USVJqCbJruSGtaP4zsE2eYWAmCZ4eJRjLcASeQDHST9i', tt: 'Design lead'};
const notesEl = document.getElementById('notes'), notesN = document.getElementById('notes-n');
const allNotes = () => store('aw-study-notes') || {};
const saveNotes = v => { store('aw-study-notes', v); countNotes(); };

function drawNotes(x){
 if (!x){
  const N = allNotes(), ids = Object.keys(N).filter(k => by[k] && N[k].length);
  notesEl.innerHTML = `<h3>Your notes</h3><p class="to">Open a study to write about it. Notes you have kept:</p>${ids.length ? `<div class="toc">${ids.map(k => `<button type="button" data-go="${k}">${esc(by[k].t)} · ${N[k].length}</button>`).join('')}</div>` : '<p class="to">None yet.</p>'}`;

  <p class="status" id="note-status" role="status"></p>
  ${list.length ? `<ul>${[...list].reverse().map(m => `<li><p>${esc(m.text)}</p><small>${new Date(m.at).toLocaleString([], {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'})}${m.sent ? '<b>Sent</b>' : ''}<button type="button" data-del="${m.at}" aria-label="Delete note">Delete</button></small></li>`).join('')}</ul>` : ''}`;

}
async function post(x, note){
 const to = x.th ? x : DESIGN;
 const r = await fetch('/api/feedback', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({
  note, page: '/studies/#' + x.id, title: (x.n ? x.n + ' ' : '') + x.t, thread: to.th, threadTitle: to.tt, entryId: 'study:' + x.id,
  viewport: innerWidth + 'x' + innerHeight, standalone: matchMedia('(display-mode: standalone)').matches})}).catch(() => null);
 return r?.ok ? true : r?.status || 0;
}
async function act(kind, x){
 const N = allNotes(), list = N[x.id] || [], status = () => notesEl.querySelector('#note-status');
 if (kind === 'add'){
  const ta = notesEl.querySelector('#note-in'), text = ta.value.trim(); if (!text) return ta.focus();
  N[x.id] = [...list, {text, at: Date.now()}]; saveNotes(N); store('aw-study-draft-' + x.id, ''); drawNotes(x); notesEl.querySelector('#note-in').focus(); return;
 }
 const pick = kind === 'send' ? list.filter(m => !m.sent) : list;
 if (!pick.length) return;
 const head = kind === 'send' ? `Evan's notes on ${x.n ? x.n + ' ' : ''}${x.t}:` : `Evan asks you to review his notes on ${x.n ? x.n + ' ' : ''}${x.t} and answer each one (what you'll change, or why not):`;
 status().textContent = 'Sending…';
 const ok = await post(x, head + '\n' + pick.map(m => '- ' + m.text).join('\n') + '\nLive: ' + LIVE + x.id + ((x.art || []).length ? '\nArtifact: https://claude.ai/artifact/' + x.art[0] : ''));
 if (ok === true){ N[x.id] = list.map(m => pick.includes(m) ? {...m, sent: true} : m); saveNotes(N); drawNotes(x); status().textContent = kind === 'send' ? 'Sent. The study\u2019s thread has them.' : 'Review asked. The answer comes back in the study\u2019s thread.'; }
 else status().textContent = ok === 401 ? 'Sign in as Evan to send; your notes are kept here.' : 'Couldn\u2019t send just now; your notes are kept here. Try again.';
}

 facets.innerHTML = `<img class="hero" alt="" src="${x.img}"><h3>${esc(x.t)}</h3>${desc ? `<p>${esc(desc)}</p>` : ''}
  ${w ? `<div class="wait"><b>Waiting on you</b>${esc(w.ask)}</div>` : ''}
  <dl>${x.n ? `<dt>Study</dt><dd>${esc(x.n)}</dd>` : ''}<dt>Group</dt><dd>${esc(x.g)}</dd><dt>Status</dt><dd>${esc(x.st)}</dd><dt>Changed</dt><dd>${ago(x.at)}</dd>
  ${doc ? `<dt>Pictures</dt><dd>${pics}</dd><dt>3D views</dt><dd>${models}</dd>` : ''}</dl>
  <div><h4>What it changed</h4><p>${esc(x.why)}</p></div>
  ${heads.length ? `<div><h4>In this study</h4><div class="toc">${heads.map((h, i) => `<button type="button" data-h="${i}">${esc(h.textContent.trim())}</button>`).join('')}</div></div>` : ''}
  ${linksFor(x)}`;
 facets.onclick = e => { const b = e.target.closest('[data-h]'); if (b) heads[Number(b.dataset.h)]?.scrollIntoView({behavior: 'smooth', block: 'start'}); };
}
facets.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) location.hash = b.dataset.go; });
view.addEventListener('load', () => {
 const x = by[location.hash.slice(1)]; if (x) detailsStudy(x);
 try { view.contentWindow.addEventListener('keydown', keys); } catch {}
});

// ---------- routing ----------
function route(){
 const id = by[location.hash.slice(1)] ? location.hash.slice(1) : 'home', x = by[id];
 if (x && unread(x)) { markSeen(x); drawList(); }
 for (const k in links) links[k].setAttribute('aria-current', String(k === id));
 document.getElementById('home').hidden = !!x; view.hidden = !x;
 if (!x){ home(); detailsHome(); document.title = 'Studies'; }
 else {
  document.title = x.t + ' · Studies';
  if (view.dataset.src !== x.src){ view.dataset.src = x.src; view.src = x.src; } else detailsStudy(x);
  const o = opens(); o[id] = {n: (o[id]?.n || 0) + 1, at: Date.now()}; store('aw-studies-opens', o);
  if (phone.matches){ P.lPhone = false; layout(); }
 }
 outcomeBar(x); drawNotes(x); drawCtx(x);
 links[id]?.scrollIntoView({block: 'nearest'});
}
// ---------- the outcome toolbar: Read or Dismiss the open study ----------
const bar = document.getElementById('outcome');
function outcomeBar(x){
 bar.hidden = !x; if (!x) return;
 const o = outcomes()[x.id], next = active().find(y => y.id !== x.id);
 bar.innerHTML = o
  ? `<span class="said">${o.o === 'read' ? 'Read' : 'Dismissed'}, off your list</span><button type="button" data-undo>Undo</button>${next ? `<button type="button" class="go" data-next="${next.id}">Next \u203a</button>` : ''}`
  : `<button type="button" class="ok" data-out="read" title="Read, take it off my list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Read</span></button><button type="button" class="no" data-out="dismissed" title="Dismiss, take it off my list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Dismiss</span></button>`;
}
bar.addEventListener('click', e => {
 const b = e.target.closest('button'), id = location.hash.slice(1); if (!b || !by[id]) return;
 const O = outcomes();
 if (b.dataset.out) O[id] = {o: b.dataset.out, at: new Date().toISOString()};
 else if (b.dataset.undo !== undefined) delete O[id];
 else if (b.dataset.next) { location.hash = b.dataset.next; return; }
 store('aw-study-outcomes', O); drawList(); route();
});
addEventListener('storage', e => { if (e.key === 'aw-study-outcomes') { drawList(); route(); } });
addEventListener('hashchange', route); showTab(store('aw-studies-tab') || 'notes'); route();

// ---------- you ----------
const me = document.getElementById('me');
me.prepend(mountProfileButton(me, {size: 36}));
me.addEventListener('click', e => { if (!e.target.closest('.aw-me')) me.querySelector('.aw-me').click(); });
me.style.cursor = 'pointer';
const who = () => { const p = getProfile(); document.getElementById('me-name').textContent = p.name || 'You'; document.getElementById('me-style').textContent = 'Profile and settings · ' + currentTheme().name; };
who(); for (const ev of ['aw-look-change', 'aw-profile-change', 'storage']) addEventListener(ev, who);
</script>
<script src="/version-chip.js?v=3" defer></script>
