<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Space Mail sketch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&display=swap">
<style>
/* AW-STUDY-0012 playable sketch. The world fills the screen; the play HUD is one glass satchel bottom-left (no words).
   Everything else (mission card, reward, album) is summoned and lives on glass objects, never a mask over the world. */
:root{--glass:rgba(255,255,255,.14);--glass-edge:rgba(255,255,255,.38);--ink:#fff6e6;--sun:#ffd36b;--teal:#00ffd1;--rose:#ff8a6b;
 --display:"Fredoka","Trebuchet MS",sans-serif;--body:"Nunito",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05060d;color:var(--ink);font-family:var(--body);
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.06) 55%,rgba(255,255,255,.12));
 border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -8px 18px rgba(0,0,0,.18),0 18px 40px -18px rgba(0,0,0,.8);
 backdrop-filter:none}
/* Satchel: the only always-on HUD while playing (about 3% of a phone screen). */
#satchel{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:116px;height:66px;border-radius:22px;
 display:none;align-items:center;gap:8px;padding:8px 12px;cursor:pointer}
#satchel svg{flex:0 0 auto}
#satchel .pips{display:grid;grid-template-columns:repeat(3,10px);gap:4px}
#satchel .pip{width:10px;height:8px;border-radius:2px;background:rgba(255,255,255,.18)}
#satchel .pip.on{background:#fff3d6;box-shadow:0 0 6px #ffd36b}
#satchel .pip.parcel{background:var(--pc,#7fd)}
#score{position:absolute;right:10px;top:-14px;font:700 20px var(--display);color:var(--sun);text-shadow:0 2px 0 #0008}
#ring{position:absolute;inset:-5px;border-radius:26px;pointer-events:none}
/* Mission card (Card Forge proportions 63:88). */
#card{position:fixed;left:50%;top:50%;width:min(300px,70vw);aspect-ratio:63/88;border-radius:18px;padding:12px;transform:translate(-50%,-50%) scale(.6) rotateY(80deg);
 opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.2,1.4,.4,1),opacity .25s;display:grid;grid-template-rows:auto 1fr auto auto;gap:8px;perspective:600px}
#card.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotateY(0);pointer-events:auto}
#card .art{border-radius:12px;overflow:hidden;background:#111;position:relative;min-height:0}
#card .art img{width:100%;height:100%;object-fit:cover;display:block}
#card h2{margin:0;font:600 26px/1 var(--display);text-align:center;letter-spacing:.01em}
#card .gem{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9ffb8,#5fbf3a 60%,#2c6b1d);box-shadow:0 0 10px #8fef6a}
#card .row{display:flex;justify-content:center;gap:14px}
#card .row span{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
#card .act{display:flex;justify-content:center;gap:18px}
.btn{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:1px solid var(--glass-edge)}
.btn.go{background:radial-gradient(circle at 35% 30%,#fff2c2,#ffc94a 55%,#d58a12);box-shadow:0 10px 24px -8px #d58a12,inset 0 2px 0 #fff8}
.btn.no{width:48px;height:48px;align-self:center}
.btn.locked{filter:grayscale(1) brightness(.7)}
/* Touch controls: appear only on touch, as glass objects. */
#stick{position:fixed;width:120px;height:120px;border-radius:50%;display:none;pointer-events:none;transform:translate(-50%,-50%)}
#stick i{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.45)}
#tbtns{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:none;gap:14px;align-items:flex-end}
#tbtns .btn{width:84px;height:84px}
#tbtns .btn.small{width:60px;height:60px}
/* Reward: the photo develops on a polaroid, then the badge and stats. */
#reward{position:fixed;inset:auto 0 max(18px,env(safe-area-inset-bottom)) 0;display:none;justify-content:center;gap:18px;align-items:flex-end;flex-wrap:wrap;padding:0 16px}
#photo{background:#fbf7ee;padding:10px 10px 34px;border-radius:6px;transform:rotate(-3deg) translateY(30px);opacity:0;transition:all .7s cubic-bezier(.2,1.3,.4,1);box-shadow:0 24px 50px -16px #000c}
#photo.in{transform:rotate(-3deg);opacity:1}
#photo img{display:block;width:min(360px,74vw);aspect-ratio:16/10;object-fit:cover;filter:saturate(.2) brightness(1.7) blur(2px);transition:filter 2.4s ease}
#photo.dev img{filter:none}
#badge{border-radius:22px;padding:14px 18px;display:grid;gap:8px;min-width:220px;opacity:0;transform:translateY(30px);transition:all .6s .3s cubic-bezier(.2,1.3,.4,1)}
#badge.in{opacity:1;transform:none}
#badge .medal{display:flex;align-items:center;gap:12px}
#badge .medal b{font:600 22px var(--display)}
#stats{display:grid;grid-template-columns:repeat(3,auto);gap:6px 14px;font:700 17px var(--display)}
#stats div{display:flex;align-items:center;gap:6px}
#albumBtn{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));width:54px;height:54px;border-radius:16px;display:grid;place-items:center;cursor:pointer}
#album{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px}
#album .book{border-radius:26px;padding:18px;max-width:900px;width:100%;max-height:86vh;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;background:rgba(30,26,48,.82)}
#album figure{margin:0;background:#fbf7ee;padding:8px 8px 26px;border-radius:5px;color:#3a3020;font:700 13px var(--display);position:relative}
#album figure:nth-child(odd){transform:rotate(-1.5deg)}#album figure:nth-child(even){transform:rotate(1.2deg)}
#album figure img{width:100%;display:block}
#album figure figcaption{position:absolute;bottom:6px;left:10px;right:10px;display:flex;justify-content:space-between}
#pad{position:fixed;right:max(80px,calc(env(safe-area-inset-right) + 80px));top:max(22px,env(safe-area-inset-top));opacity:0;transition:opacity .4s}
#pad.on{opacity:.8}
#load{position:fixed;inset:0;display:grid;place-items:center;font:600 20px var(--display);color:#cfd3ef;pointer-events:none;transition:opacity .6s}
.pop{position:fixed;font:700 26px var(--display);color:var(--sun);text-shadow:0 3px 0 #0009;pointer-events:none;transform:translate(-50%,-50%);transition:transform 1.1s cubic-bezier(.2,.9,.3,1),opacity 1.1s}
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">
 <svg width="64" height="48" viewBox="0 0 64 48" aria-hidden="true"><rect x="4" y="6" width="56" height="36" rx="5" fill="#fff3d6"/><path d="M4 10 L32 28 L60 10" stroke="#d9b98a" stroke-width="3" fill="none"/><path d="M32 22c-4-5-10-1-6 4l6 5 6-5c4-5-2-9-6-4z" fill="#ff6b6b"/></svg>
</div>
<div id="satchel" class="glass" title="">
 <div id="ring"></div>
 <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M6 12h22l-2 17H8z" fill="#c9773a"/><path d="M11 12a6 6 0 0 1 12 0" stroke="#7a4220" stroke-width="3" fill="none"/><rect x="6" y="12" width="22" height="7" rx="2" fill="#e08b45"/><circle cx="17" cy="19" r="2.4" fill="#ffd36b"/></svg>
 <div class="pips" id="pips"></div>
 <div id="score">0</div>
</div>
<div id="card" class="glass" role="dialog" aria-label="Mission">
 <div class="art"><img id="cardArt" alt=""><span class="gem" id="gem"></span></div>
 <h2 id="cardTitle">Happy Letters</h2>
 <div class="row" id="cardRow"></div>
 <div class="act"><div class="btn glass no" id="cardNo" aria-label="Back"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 3l12 12M15 3L3 15" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></div>
  <div class="btn go" id="cardGo" aria-label="Play"><svg width="26" height="26" viewBox="0 0 26 26"><path d="M8 4l14 9-14 9z" fill="#5a3500"/></svg></div></div>
</div>
<div id="stick" class="glass"><i></i></div>
<div id="tbtns"><div class="btn glass small" id="tDash" aria-label="Jet puff"><svg width="26" height="26" viewBox="0 0 26 26"><path d="M4 13h12M10 7l8 6-8 6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg></div>
 <div class="btn glass" id="tJump" aria-label="Hop"><svg width="34" height="34" viewBox="0 0 34 34"><path d="M17 6l9 12h-6v10h-6V18H8z" fill="#fff"/></svg></div></div>
<div id="reward"><div id="photo"><img id="photoImg" alt=""></div>
 <div id="badge" class="glass"><div class="medal"><svg id="medalSvg" width="54" height="54" viewBox="0 0 54 54"></svg><b id="medalName"></b></div><div id="stats"></div></div></div>
<div id="albumBtn" class="glass" aria-label="Photo album"><svg width="28" height="24" viewBox="0 0 28 24"><rect x="2" y="4" width="24" height="18" rx="3" fill="#fbf7ee"/><circle cx="14" cy="13" r="5" fill="#5a6ea8"/><rect x="9" y="1" width="10" height="5" rx="2" fill="#fbf7ee"/></svg></div>
<div id="album"><div class="book glass" id="book"></div></div>
<svg id="pad" width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><rect x="1" y="3" width="32" height="17" rx="8" fill="none" stroke="#fff" stroke-width="2"/><circle cx="24" cy="9" r="2" fill="#fff"/><circle cx="27" cy="13" r="2" fill="#fff"/><path d="M8 11h6M11 8v6" stroke="#fff" stroke-width="2"/></svg>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '/vendor/loaders/GLTFLoader.js';

// ---------- world constants ----------
const R = 34;                                  // tile radius (m), corners on the x axis
const G = 5.2, JUMP = 6.4, FLOAT = 0.45;       // low gravity: ~2.5 s of air, holding hop floats
const RUN = 7.2, ACC = 26, AIR = 0.55;
const ROUND_S = 120;                           // the ferry leaves when its pad lamps are all lit
const KEY = [0x6bd3ff, 0xff8ad8, 0x9be86b, 0xffb84d]; // each home's colour: mailbox flag, door light, suit trim
const NOTES = [293.66, 329.63, 369.99, 440, 493.88, 587.33, 659.25, 739.99]; // D major pentatonic (MUSIC_BIBLE key)
const params = new URLSearchParams(location.search);

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04050c);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 900);
camera.layers.enable(1); // layer 1 = presentation layer (mission light, cues). World perception reads layer 0 only.

// ---------- light ----------
{ // a soft studio environment so metals and glass have something to reflect
  const env = new THREE.Scene(), sky = new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide,
    vertexShader: 'varying vec3 p; void main(){ p=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: 'varying vec3 p; void main(){ float y=normalize(p).y; gl_FragColor=vec4(mix(vec3(.18,.17,.22),vec3(.55,.6,.8),smoothstep(-.2,.8,y)),1.); }' }));
  env.add(sky);
  for (const [x, y, z, c] of [[-6, 5, 3, 0xfff1dc], [5, 3, -5, 0x9fb4ff]]) { const q = new THREE.Mesh(new THREE.PlaneGeometry(5, 3), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); q.position.set(x, y, z); q.lookAt(0, 0, 0); env.add(q); }
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(env, 0.02).texture; scene.environmentIntensity = 0.45;
}
scene.add(new THREE.HemisphereLight(0xbfd0ff, 0x2a2633, 0.55));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
sun.position.set(-40, 34, 22); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 140 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8fa8ff, 0.35); fill.position.set(30, 12, -30); scene.add(fill);

// ---------- sky: stars and Earth ----------
{
  const n = 2400, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(500 + Math.random() * 200); if (v.y < -60) v.y *= -1; p.set([v.x, v.y, v.z], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, color: 0xdfe6ff })));
  const earth = new THREE.Mesh(new THREE.SphereGeometry(30, 48, 32), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 }));
  new THREE.TextureLoader().load('/simulations/moon/assets/earth.jpg', t => { t.colorSpace = THREE.SRGBColorSpace; earth.material.map = t; earth.material.needsUpdate = true; });
  earth.position.set(150, 130, -380); scene.add(earth);
}

// ---------- ground: a hex tile with craters ----------
const craters = [
  [-6, 22, 6, 1.4], [20, 20, 5, 1.1], [-24, -6, 7, 1.6], [6, -24, 5.5, 1.2], [26, -14, 4, 0.9], [-14, -24, 4, 0.8],
  [-26, 14, 3.5, 0.7], [0, 6, 3, 0.5], [12, 8, 2.4, 0.4], [-8, -6, 2.2, 0.4], [16, -28, 3, 0.6], [-30, -18, 2.6, 0.5],
];
const METEOR = new THREE.Vector2(-24, -6);
function hexR(x, z) { const a = Math.atan2(-z, x); let m = ((a * 180 / Math.PI) % 60 + 60) % 60; return R * Math.cos(Math.PI / 6) / Math.cos((m - 30) * Math.PI / 180); }
function heightAt(x, z) {
  let h = 0.35 * Math.sin(x * 0.11) * Math.cos(z * 0.09) + 0.18 * Math.sin(x * 0.31 + z * 0.23);
  for (const [cx, cz, r, d] of craters) {
    const q = Math.hypot(x - cx, z - cz) / r;
    if (q < 1) h -= d * (1 - q * q);
    else if (q < 1.6) h += d * 0.35 * Math.cos((q - 1) / 0.6 * Math.PI / 2) ** 2;
  }
  // flatten pads and building plots
  for (const f of FLATS) { const q = Math.hypot(x - f[0], z - f[1]); if (q < f[2]) h = THREE.MathUtils.lerp(h, f[3], Math.min(1, (f[2] - q) / 2)); }
  return h * THREE.MathUtils.clamp((hexR(x, z) - Math.hypot(x, z)) / 3, 0, 1); // the tile's rim meets the slab cleanly
}
const FLATS = []; // [x, z, radius, height]

function buildGround() {
  const seg = 180, g = new THREE.PlaneGeometry(2 * R, 2 * R, seg, seg); g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i), z = pos.getZ(i); const r = Math.hypot(x, z), lim = hexR(x, z);
    if (r > lim) { x *= lim / r; z *= lim / r; }
    const h = heightAt(x, z); pos.setXYZ(i, x, h, z);
    const n = 0.5 + 0.5 * Math.sin(x * 1.7 + Math.sin(z * 1.3) * 2) * Math.cos(z * 1.1);
    const v = 0.62 + h * 0.05 + n * 0.05;
    c.setRGB(v * 0.93, v * 0.93, v); col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
  const top = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.96 }));
  top.receiveShadow = true; scene.add(top);
  const shape = new THREE.Shape(); for (let k = 0; k <= 6; k++) { const a = k * Math.PI / 3; shape[k ? 'lineTo' : 'moveTo'](R * Math.cos(a), R * Math.sin(a)); }
  const slab = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 5, bevelEnabled: false }), [new THREE.MeshBasicMaterial({ visible: false }), new THREE.MeshStandardMaterial({ color: 0x55546a, roughness: 1 })]);
  slab.rotation.x = Math.PI / 2; slab.position.y = 0; scene.add(slab);
  // boulders
  const rock = new THREE.IcosahedronGeometry(1, 0), rm = new THREE.MeshStandardMaterial({ color: 0x9a9aa6, roughness: 1, flatShading: true });
  for (let i = 0; i < 70; i++) {
    const a = Math.random() * 6.283, d = Math.sqrt(Math.random()) * (R - 3), x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (FLATS.some(f => Math.hypot(x - f[0], z - f[1]) < f[2] + 1)) continue;
    const m = new THREE.Mesh(rock, rm); const s = 0.2 + Math.random() ** 3 * 0.9; m.scale.set(s, s * 0.7, s * 1.1);
    m.position.set(x, heightAt(x, z), z); m.rotation.set(Math.random(), Math.random(), Math.random()); m.castShadow = m.receiveShadow = true; scene.add(m);
  }
}

// ---------- models (the real Moon tile kit) ----------
const loader = new GLTFLoader(), cache = {};
const A = id => `/simulations/moon/assets/${id}.glb`;
function load(id) { return cache[id] ||= new Promise(res => loader.load(A(id), g => res(g.scene), undefined, () => res(new THREE.Group()))); }
async function place(id, x, z, rot = 0, s = 1) {
  const src = await load(id), o = src.clone(true);
  o.traverse(m => { if (m.isMesh) { m.castShadow = m.receiveShadow = true; } });
  o.scale.setScalar(s); o.rotation.y = rot; o.position.set(x, heightAt(x, z), z); scene.add(o); return o;
}
function tint(o, name, hex, emissive = 0) {
  o.traverse(m => { if (m.isMesh) { const mats = Array.isArray(m.material) ? m.material : [m.material];
    const out = mats.map(mt => { if (mt.name !== name) return mt; const c = mt.clone(); c.color.setHex(hex); if (emissive) { c.emissive = new THREE.Color(hex); c.emissiveIntensity = emissive; } return c; });
    m.material = Array.isArray(m.material) ? out : out[0]; } });
}

// ---------- layout ----------
const PAD = new THREE.Vector3(13, 0, -4);     // ferry pad: the post office
const HOMES = [
  { id: 'ME-001', x: -15, z: 12, rot: 0.6 }, { id: 'ME-082', x: 5, z: 21, rot: 2.2 },
  { id: 'MR-002', x: -12, z: -14, rot: -0.4 }, { id: 'ME-001', x: 22, z: 15, rot: -1.2 },
];
FLATS.push([PAD.x, PAD.z, 6.5, 0.2]);
for (const h of HOMES) FLATS.push([h.x, h.z, 4.6, 0.1]);
const HUNT = new THREE.Vector3(METEOR.x, 0, METEOR.y); // second mission cell (idea): moon-rock scavenger hunt

const homes = [], colonists = [], pickups = [], letters = [], fx = [];
let ferry, buggy, player, playerBody, buggyRide;

function mailbox(color) {
  const g = new THREE.Group();
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.1), new THREE.MeshStandardMaterial({ color: 0x5c5c66, metalness: 0.4, roughness: 0.5 }));
  post.position.y = 0.55; g.add(post);
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.7), new THREE.MeshStandardMaterial({ color: 0xeeeae0, roughness: 0.5 }));
  box.position.y = 1.25; g.add(box);
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.7, 16, 1, false, 0, Math.PI), box.material);
  lid.rotation.z = Math.PI / 2; lid.rotation.y = Math.PI / 2; lid.position.y = 1.45; g.add(lid);
  const flag = new THREE.Group(); flag.position.set(0.28, 1.25, 0.1);
  const stem = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.6, 0.04), new THREE.MeshStandardMaterial({ color }));
  stem.position.y = 0.3; flag.add(stem);
  const tab = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.18, 0.26), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.6 }));
  tab.position.set(0, 0.55, 0.12); flag.add(tab); g.add(flag);
  g.userData.flag = flag; g.traverse(m => m.isMesh && (m.castShadow = true));
  return g;
}

// envelope with a heart: the letter people send home
const envTex = (() => { const c = document.createElement('canvas'); c.width = 128; c.height = 88; const x = c.getContext('2d');
  x.fillStyle = '#fff4dc'; x.fillRect(0, 0, 128, 88); x.strokeStyle = '#d9b98a'; x.lineWidth = 5; x.beginPath(); x.moveTo(2, 4); x.lineTo(64, 50); x.lineTo(126, 4); x.stroke();
  x.fillStyle = '#ff5f6d'; x.beginPath(); x.moveTo(64, 70); x.bezierCurveTo(30, 44, 50, 22, 64, 40); x.bezierCurveTo(78, 22, 98, 44, 64, 70); x.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const envGeo = new THREE.BoxGeometry(0.95, 0.64, 0.06);
function envelope(color) {

  pingArrow.layers.set(1); pingArrow.visible = false; scene.add(pingArrow); }

function frame() {
  const dt = Math.min(0.05, clock.getDelta()); T += dt; pollInput();
  for (const m of [missionMail, missionHunt]) if (m) { m.userData.mat.uniforms.t.value = T; const target = m.userData.fade || state !== 'board' && state !== 'card' ? 0 : 1; m.userData.mat.uniforms.a.value += (target - m.userData.mat.uniforms.a.value) * Math.min(1, dt * 4); }
  if (state === 'board') {
    boardCam.t += dt; boardPose(boardCam.t, tmpV, tmpL); camera.position.lerp(tmpV, Math.min(1, dt * 2)); camLook.lerp(tmpL, Math.min(1, dt * 2));
    if (input.mx < -0.5) boardCam.sel = 1; if (input.mx > 0.5) boardCam.sel = 0;
    if (padOn) for (const [i, m] of [missionMail, missionHunt].entries()) m.scale.setScalar(boardCam.sel === i ? 1 + Math.sin(T * 4) * 0.03 : 1);
    if (input.ok) openCard(padOn ? boardCam.sel : 0);
  } else if (state === 'card') {
    if (input.ok) startDive(); if (input.back) closeCard();
  } else if (state === 'dive') {
    dive.t += dt / 1.3; const u = dive.t >= 1 ? 1 : 1 - Math.pow(1 - dive.t, 3);
    followPose(tmpV, tmpL); const arc = Math.sin(u * Math.PI) * 6;
    camera.position.lerpVectors(dive.from, tmpV, u).y += arc; camLook.lerpVectors(dive.fromLook, tmpL, u);
    player.position.copy(pl.pos); player.rotation.y = pl.face + Math.sin(Math.min(1, dive.t) * Math.PI) * 1.2; // the glance back
    if (dive.t >= 1) { state = 'play'; document.getElementById('satchel').style.display = 'flex'; showTouch(); }
  } else if (state === 'play') {
    camYaw += input.camX * dt * 1.5; stepPlay(dt);
    if (state === 'play') { followPose(tmpV, tmpL); camera.position.lerp(tmpV, 1 - Math.exp(-dt * 5)); camLook.lerp(tmpL, 1 - Math.exp(-dt * 8)); }
  } else if (state === 'reward') {
    stepReward(dt); rewardCam(tmpV, tmpL); camera.position.lerp(tmpV, 1 - Math.exp(-dt * 2.5)); camLook.lerp(tmpL, 1 - Math.exp(-dt * 3));
    if (reward.shot && (input.ok || input.back) && reward.t > 4) backToBoard();
  }
  if (state === 'board' || state === 'card') { player.position.copy(pl.pos); }
  for (let i = fx.length - 1; i >= 0; i--) { const f = fx[i]; f.t += dt;
    if (f.arc) { const u = THREE.MathUtils.clamp(f.t / f.life, 0, 1); f.obj.position.lerpVectors(f.arc.a, f.arc.b, u); f.obj.position.y += Math.sin(u * Math.PI) * 3; f.obj.rotation.z += dt * 8; if (f.t >= f.life) { scene.remove(f.obj); fx.splice(i, 1); } continue; }
    f.obj.position.addScaledVector(f.v, dt); f.v.y -= G * 0.15 * dt; f.obj.material.opacity = Math.max(0, 0.7 * (1 - f.t / f.life)); if (f.t > f.life) { scene.remove(f.obj); fx.splice(i, 1); } }
  homes.forEach(h => h.mb.userData.flag.rotation.z += 0); // flags are set by events
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  input.jump = input.dash = input.ping = input.ok = input.back = false;
  requestAnimationFrame(frame);
}
init().then(() => requestAnimationFrame(frame));
</script>
</body>
</html>
