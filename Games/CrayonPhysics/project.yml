name: CrayonPhysics
options:
  bundleIdPrefix: com.abbiesworld
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  CrayonPhysics:
    type: application
    platform: iOS
    sources: [Standalone]
    dependencies:
      - target: CrayonPhysicsKit
      - target: CrayonPhysicsCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Crayon Physics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abbiesworld.crayonphysics
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
  CrayonPhysicsCore:
    type: framework
    platform: iOS
    sources:
      - path: CrayonPhysicsCore
        excludes: [include, Vendor/include]
      - path: CrayonPhysicsCore/include
        headerVisibility: public
      - path: CrayonPhysicsCore/Vendor/include
        headerVisibility: project
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.abbiesworld.crayonphysics.core
        DEFINES_MODULE: true
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/CrayonPhysicsCore/include
          - $(SRCROOT)/CrayonPhysicsCore/Vendor/include
  CrayonPhysicsKit:
    dependencies:
      - target: CrayonPhysicsCore
    type: framework
    platform: iOS
    sources:
      - path: CrayonPhysics
        excludes: [Resources]
      - path: CrayonPhysics/Resources
        buildPhase: resources
        excludes: [draw-loop.wav, erase.wav, paper-tap.wav, star.wav, sound-candidate-metadata.json]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.abbiesworld.crayonphysics.kit
        DEFINES_MODULE: true
  CrayonPhysicsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CrayonPhysicsTests]
    dependencies:
      - target: CrayonPhysicsKit
      - target: CrayonPhysicsCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  CrayonPhysicsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CrayonPhysicsUITests]
    dependencies:
      - target: CrayonPhysics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: CrayonPhysics
schemes:
  CrayonPhysics:
    build:
      targets:
        CrayonPhysics: all
    test:
      targets: [CrayonPhysicsTests, CrayonPhysicsUITests]
