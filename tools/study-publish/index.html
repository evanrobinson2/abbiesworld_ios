<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening study</title><body><p id="status">Opening the current study…</p><script>
(async()=>{try{const r=await fetch('./current.json',{cache:'no-store'});if(!r.ok)throw Error('No published revision yet.');const m=await r.json();if(!/^[a-f0-9]{64}$/.test(m.revision)||typeof m.entry!=='string'||!/^[A-Za-z0-9_./-]+\.html$/.test(m.entry)||m.entry.split('/').some(p=>!p||p==='..'||p==='.')||m.entry.startsWith('/'))throw Error('Invalid study pointer.');const target=new URL('./versions/'+m.revision+'/'+m.entry,location.href);target.search=location.search;target.hash=location.hash;location.replace(target.href)}catch(e){document.querySelector('#status').textContent='Study unavailable: '+e.message+' Reload to retry.'}})();
</script></body></html>
