<script type="module">
// Same-camera shot of Grace's computer against Evan's photo (1024x768). Query: theta, phi, dist, fov, ty, ex (exploded).
import * as T from 'three';
import {createGraceComputer, createGraceFloppy} from '/prototypes/ranch-atelier/dist/simulations/grace-computer.mjs';
import {GLTFLoader} from '/prototypes/ranch-atelier/dist/vendor/loaders/GLTFLoader.js';

const th = n('theta', -32) * Math.PI / 180, ph = n('phi', 82) * Math.PI / 180, d = n('dist', 1.1);
const c = new T.PerspectiveCamera(n('fov', 30), 1024 / 768, .01, 20), tgt = new T.Vector3(n('tx', 0), n('ty', .19), 0);

c.lookAt(tgt); c.setViewOffset(1024, 768, n('ox', 0), n('oy', 0), 1024, 768);
r.render(s, c); window.done = true;
</script>
