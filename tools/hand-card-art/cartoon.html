<!doctype html><meta charset="utf-8"><body style="margin:0;background:transparent">
<script type="module">
// Renders each tile's comic-mode cartoon (developer-mode.mjs cartoonLandmark + storybook dressing) on a cartoon hex,
// on a transparent canvas, for the hand cards. Served next to dist by render-cartoon.cjs.
import * as T from '/vendor/three.module.js';
import {cartoonLandmark} from '/simulations/developer-mode.mjs';
import {planStorybookDressing} from '/simulations/storybook-dressing-plan.mjs';
import {drawStorybookDressing} from '/simulations/storybook-dressing-render.mjs';
const S = 1024, renderer = new T.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
renderer.setSize(S, S); renderer.setClearColor(0, 0); renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.outputColorSpace = T.SRGBColorSpace; document.body.append(renderer.domElement);
const ground = {ranch: ['#93c25c', '#6f8f3e'], crop: ['#9cc45f', '#6f8f3e'], meadow: ['#8fc463', '#6a8c40'], moon: ['#b9bec8', '#7c828f']};
window.renderCartoon = (type, view = {}) => {
 const scene = new T.Scene(), d = 100, R = d * .1 / 2, [top, side] = ground[type];
 scene.add(new T.HemisphereLight('#fff6e0', '#6a7a5a', 1.4));
 const sun = new T.DirectionalLight('#fff1d6', 2.6); sun.position.set(-6, 12, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
 Object.assign(sun.shadow.camera, {left: -8, right: 8, top: 8, bottom: -8}); sun.shadow.bias = -.0005; scene.add(sun);
 const mat = c => new T.MeshStandardMaterial({color: c, roughness: 1, flatShading: true});
 const slab = new T.Mesh(new T.CylinderGeometry(R, R, .6, 6), [mat(side), mat(top), mat(side)]); slab.rotation.y = Math.PI / 6; slab.position.y = -.3; slab.receiveShadow = true; scene.add(slab);
 if (type === 'moon') for (const [x, z, r] of [[-2.6, 2.2, .7], [2.9, -1.6, .55], [1.8, 2.8, .4], [-3, -1.5, .45]]) {
  const rim = new T.Mesh(new T.TorusGeometry(r, r * .22, 5, 14), mat('#a3a9b4')); rim.rotation.x = Math.PI / 2; rim.position.set(x, 0, z); rim.receiveShadow = true; scene.add(rim);
  const floor = new T.Mesh(new T.CircleGeometry(r, 14), mat('#9aa0ab')); floor.rotation.x = -Math.PI / 2; floor.position.set(x, .01, z); scene.add(floor);
 }
 const landmark = cartoonLandmark(type); landmark.scale.setScalar(d * .1 * .21); landmark.position.y = .05; scene.add(landmark);
 if (type !== 'moon') scene.add(drawStorybookDressing(planStorybookDressing({seed: 'hand-card', id: 'card-' + type, type, diameter: d, paths: []}), {center: {x: 0, z: 0}}, () => 0));
 scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
 const camera = new T.PerspectiveCamera(view.fov || 30, 1, .1, 200), a = view.yaw ?? .45, e = view.pitch ?? .62, r = view.dist ?? 19;
 const target = new T.Vector3(...(view.target || [0, .9, 0]));
 camera.position.set(target.x + Math.sin(a) * Math.cos(e) * r, target.y + Math.sin(e) * r, target.z + Math.cos(a) * Math.cos(e) * r); camera.lookAt(target);
 renderer.render(scene, camera); return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
