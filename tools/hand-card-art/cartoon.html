<!doctype html><meta charset="utf-8"><body style="margin:0;background:transparent">
<script type="module">
// Renders each tile's comic-mode cartoon (developer-mode.mjs cartoonLandmark + storybook dressing) on a cartoon hex,
// on a transparent canvas, for the hand cards. Served next to dist by render-cartoon.cjs.
// Render pass: cel shading (a three-step toon ramp in place of the game's flat-shaded standard materials), shadows,
// then ink lines from a normal and depth pass (creases, contact edges and the silhouette), 2x supersampled.
import * as T from '/vendor/three.module.js';
import {cartoonLandmark} from '/simulations/developer-mode.mjs';
import {planStorybookDressing} from '/simulations/storybook-dressing-plan.mjs';
import {drawStorybookDressing} from '/simulations/storybook-dressing-render.mjs';
const S = 2048, renderer = new T.WebGLRenderer({antialias: false, alpha: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1); renderer.setSize(S, S); renderer.setClearColor(0, 0); renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.outputColorSpace = T.SRGBColorSpace; document.body.append(renderer.domElement);
const ramp = new T.DataTexture(new Uint8Array([90, 90, 90, 255, 175, 175, 175, 255, 255, 255, 255, 255]), 3, 1);
ramp.minFilter = ramp.magFilter = T.NearestFilter; ramp.needsUpdate = true;
const ground = {ranch: ['#93c25c', '#6f8f3e'], crop: ['#9cc45f', '#6f8f3e'], meadow: ['#8fc463', '#6a8c40'], moon: ['#b9bec8', '#7c828f']};
const toon = new Map(), toonOf = m => {
 const key = m.color.getHexString() + (m.side === T.DoubleSide ? 'd' : '');
 if (!toon.has(key)) toon.set(key, new T.MeshToonMaterial({color: m.color, gradientMap: ramp, side: m.side}));
 return toon.get(key);
};
const rtColor = new T.WebGLRenderTarget(S, S, {samples: 4, type: T.HalfFloatType});
const rtNormal = new T.WebGLRenderTarget(S, S); rtNormal.depthTexture = new T.DepthTexture(S, S);
const normals = new T.MeshNormalMaterial({side: T.DoubleSide});
const ink = new T.ShaderMaterial({
 uniforms: {tColor: {value: rtColor.texture}, tNormal: {value: rtNormal.texture}, tDepth: {value: rtNormal.depthTexture}, texel: {value: new T.Vector2(1 / S, 1 / S)}, near: {value: .1}, far: {value: 200}, inkColor: {value: new T.Color('#2a1c12')}},
 vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
 fragmentShader: `uniform sampler2D tColor,tNormal,tDepth;uniform vec2 texel;uniform float near,far;uniform vec3 inkColor;varying vec2 vUv;
 float lin(vec2 uv){float z=texture2D(tDepth,uv).x;if(z>=1.)return 1e4;return (2.*near*far)/(far+near-(z*2.-1.)*(far-near));}
 void main(){vec4 c=texture2D(tColor,vUv);float d0=lin(vUv);vec3 n0=texture2D(tNormal,vUv).xyz;float e=0.,cover=0.;
  for(int i=0;i<8;i++){float a=float(i)*0.785398;vec2 o=vec2(cos(a),sin(a))*texel*2.2;float d=lin(vUv+o);vec3 n=texture2D(tNormal,vUv+o).xyz;
   if(d<1e3)cover=1.;
   if(d0<1e3&&d<1e3){e=max(e,smoothstep(.35,.6,length(n-n0)));e=max(e,smoothstep(.03,.06,abs(d-d0)/d0));}}
  if(d0>=1e3){gl_FragColor=vec4(inkColor,cover);}else{gl_FragColor=vec4(mix(c.rgb,inkColor,e*.9),1.);}
  #include <colorspace_fragment>
 }`
});
const quadScene = new T.Scene(), quadCam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
quadScene.add(new T.Mesh(new T.PlaneGeometry(2, 2), ink));
window.renderCartoon = (type, view = {}) => {
 const scene = new T.Scene(), d = 100, R = d * .1 / 2, [top, side] = ground[type];
 scene.add(new T.HemisphereLight('#fff6e0', '#8a9a7a', 1.1));
 const sun = new T.DirectionalLight('#fff1d6', 2.8); sun.position.set(-6, 12, 8); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
 Object.assign(sun.shadow.camera, {left: -8, right: 8, top: 8, bottom: -8}); sun.shadow.bias = -.0004; sun.shadow.radius = 2; scene.add(sun);
 const mat = c => new T.MeshStandardMaterial({color: c});
 const slab = new T.Mesh(new T.CylinderGeometry(R, R, .6, 6), [mat(side), mat(top), mat(side)]); slab.rotation.y = Math.PI / 6; slab.position.y = -.3; scene.add(slab);
 if (type === 'moon') for (const [x, z, r] of [[-2.6, 2.2, .7], [2.9, -1.6, .55], [1.8, 2.8, .4], [-3, -1.5, .45]]) {
  const rim = new T.Mesh(new T.TorusGeometry(r, r * .22, 6, 18), mat('#a3a9b4')); rim.rotation.x = Math.PI / 2; rim.position.set(x, 0, z); scene.add(rim);
  const floor = new T.Mesh(new T.CircleGeometry(r, 18), mat('#9aa0ab')); floor.rotation.x = -Math.PI / 2; floor.position.set(x, .01, z); scene.add(floor);
 }
 const landmark = cartoonLandmark(type); landmark.scale.setScalar(d * .1 * .21); landmark.position.y = .05; scene.add(landmark);
 if (type !== 'moon') scene.add(drawStorybookDressing(planStorybookDressing({seed: 'hand-card', id: 'card-' + type, type, diameter: d, paths: []}), {center: {x: 0, z: 0}}, () => 0));
 scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.material = Array.isArray(o.material) ? o.material.map(toonOf) : toonOf(o.material); } });
 const camera = new T.PerspectiveCamera(view.fov || 30, 1, .1, 200), a = view.yaw ?? .45, e = view.pitch ?? .62, r = view.dist ?? 19;
 const target = new T.Vector3(...(view.target || [0, .9, 0]));
 camera.position.set(target.x + Math.sin(a) * Math.cos(e) * r, target.y + Math.sin(e) * r, target.z + Math.cos(a) * Math.cos(e) * r); camera.lookAt(target);
 ink.uniforms.near.value = camera.near; ink.uniforms.far.value = camera.far;
 scene.overrideMaterial = normals; renderer.setRenderTarget(rtNormal); renderer.render(scene, camera);
 scene.overrideMaterial = null; renderer.setRenderTarget(rtColor); renderer.render(scene, camera);
 renderer.setRenderTarget(null); renderer.render(quadScene, quadCam);
 const out = document.createElement('canvas'); out.width = out.height = S / 2;
 const g = out.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(renderer.domElement, 0, 0, S / 2, S / 2);
 return out.toDataURL('image/png');
};
window.ready = true;
</script>
