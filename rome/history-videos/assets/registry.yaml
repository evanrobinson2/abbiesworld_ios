# Asset registry — single source of truth for what exists and what is approved.
#
# Every asset ID referenced by a frame card must appear here with status APPROVED
# before that frame can be generated. This file is deliberately machine-readable so
# continuity can be checked by inspection rather than by memory.
#
# status: planned | draft | proposed | APPROVED | superseded

id_scheme:
  characters: "<TAG>-<nnn>"                    # FRI-001
  character_states: "<TAG>-<year>-<letter>"    # YOUNG-WARRIOR-376-C
  locations: "MAR-<AREA>-<VIEW>-<nn>"          # MAR-GATE-INT-01
  boards: "BOARD-<TAG>-<nnn>"                  # BOARD-GOTH-ELITE-001
  comps: "COMP-<AREA>-<nnn>"
  frames: "FRAME-<SEQ>-<nnn>"

registers:
  R1: realised          # attested; frame may enter the moment
  R2: reconstructed     # inferred; observational
  R3: unrecoverable     # record fails; image cannot complete itself

base_register: papercut    # layered cut-paper, silhouette figures — adopted after 4-subject screen

characters: []
