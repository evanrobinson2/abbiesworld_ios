<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Character Studio Spike — Pose Binder</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #141018;
      --panel: rgba(12, 16, 22, 0.9);
      --ink: #e8eef7;
      --muted: #9aa8bc;
      --hot: #e89a3c;
      --ok: #5dca8a;
      --bad: #e86a6a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: hidden; }
    model-viewer {
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, #2a2438 0%, #141018 70%);
      --poster-color: transparent;
    }
    #clip-badge {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      z-index: 3; pointer-events: none;
      background: rgba(0,0,0,0.72); color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px; padding: 10px 18px;
      text-align: center; min-width: 220px;
    }
    #clip-badge .label { font-size: 10px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
    #clip-badge .name { font-size: 18px; font-weight: 700; margin-top: 2px; color: var(--hot); }
    #clip-badge .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    #ui {
      position: fixed; inset: 10px auto auto 10px; z-index: 2;
      display: flex; flex-direction: column; gap: 8px; width: min(340px, 46vw);
      max-height: calc(100vh - 20px); pointer-events: none;
    }
    #ui .panel { pointer-events: auto; }
    #ui-right {
      position: fixed; inset: 10px 10px auto auto; z-index: 2;
      display: flex; flex-direction: column; gap: 8px; width: min(260px, 38vw);
      max-height: calc(100vh - 20px); pointer-events: none;
    }
    #ui-right .panel { pointer-events: auto; }
    .panel {
      background: var(--panel); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 10px;
    }
    h1 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.06em; color: var(--muted);
      text-transform: uppercase; font-weight: 600; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; }
    button, select {
      appearance: none; border: 0; border-radius: 8px; padding: 7px 10px;
      background: #1c2736; color: var(--ink); cursor: pointer; font: inherit;
    }
    button:hover, select:hover { background: #243246; }
    button.active { background: var(--hot); color: #1a1208; font-weight: 700; }
    button.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.15); }
    #pose-list {
      display: flex; flex-direction: column; gap: 4px;
      max-height: 42vh; overflow: auto;
    }
    .pose {
      text-align: left; width: 100%;
      display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
    }
    .pose .idx { color: var(--muted); font-size: 10px; }
    .pose.playing { outline: 1px solid var(--hot); }
    .bind-row {
      display: grid; grid-template-columns: 72px 1fr; gap: 6px; align-items: center;
      margin-top: 6px;
    }
    .bind-row label { color: var(--muted); font-size: 11px; }
    .bind-row select { width: 100%; }
    #hint { color: var(--muted); font-size: 11px; margin: 8px 0 0; }
    #status { color: var(--ok); margin-top: 8px; font-size: 11px; }
    #status.err { color: var(--bad); }
    label.knob { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; color: var(--muted); }
    input[type="range"] { width: 100%; }
    #sparkle-layer {
      pointer-events: none; position: fixed; inset: 0; z-index: 1;
      background-image:
        radial-gradient(circle, rgba(255,232,160,0.9) 0 1px, transparent 2px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      background-size: 120px 120px, 180px 180px;
      opacity: 0.3; animation: drift 12s linear infinite; mix-blend-mode: screen;
    }
    #sparkle-layer.off { opacity: 0; }
    @keyframes drift {
      from { background-position: 0 0, 40px 60px; }
      to { background-position: 120px 240px, 220px 300px; }
    }
  </style>
</head>
<body>
  <model-viewer
    id="viewer"
    src="../output/character.glb"
    alt="Meshy avatar on pedestal"
    shadow-intensity="1"
    exposure="1.1"
    environment-image="neutral"
    camera-controls
    touch-action="pan-y"
    camera-orbit="20deg 78deg 4.5m"
    field-of-view="28deg"
    min-camera-orbit="auto auto 2.5m"
    max-camera-orbit="auto auto 8m"
    interpolation-decay="100"
  ></model-viewer>

  <div id="sparkle-layer"></div>

  <div id="clip-badge">
    <div class="label">Playing clip</div>
    <div class="name" id="badge-name">—</div>
    <div class="meta" id="badge-meta">pick a pose</div>
  </div>

  <div id="ui">
    <div class="panel">
      <h1>State machine</h1>
      <div class="row" id="state-buttons"></div>
      <p id="hint">States use observed remapping (Meshy names lie). Wrong still? change the dropdown.</p>
    </div>

    <div class="panel">
      <h1>All poses in asset (<span id="pose-count">0</span>)</h1>
      <div id="pose-list"></div>
      <p id="hint">Click a pose to preview. Assign it to a state when it looks right.</p>
      <div class="row" style="margin-top:8px">
        <select id="assign-state"></select>
        <button type="button" id="btn-assign">ASSIGN CURRENT → STATE</button>
      </div>
      <div id="status">Loading…</div>
    </div>
  </div>

  <div id="ui-right">
    <div class="panel">
      <h1>Bindings (editable)</h1>
      <div id="bind-editors"></div>
      <div class="row" style="margin-top:10px">
        <button type="button" class="ghost" id="btn-auto">AUTO-GUESS</button>
        <button type="button" class="ghost" id="btn-clear">CLEAR</button>
        <button type="button" class="ghost" id="btn-save">SAVE</button>
      </div>
    </div>
    <div class="panel">
      <h1>Appearance</h1>
      <label class="knob">Tint hue <input id="knob-hue" type="range" min="0" max="360" value="0" /></label>
      <label class="knob">Tint strength <input id="knob-tint" type="range" min="0" max="100" value="0" /></label>
      <label class="knob">Sparkles <input id="knob-sparkles" type="range" min="0" max="100" value="40" /></label>
      <div class="row" style="margin-top:10px">
        <button type="button" id="btn-sparkle-toggle" class="active">SPARKLES ON</button>
        <button type="button" id="btn-reset-look">RESET LOOK</button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
